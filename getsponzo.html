const QUICK={patrocinado:["¡Hola! Gracias por escribir 😊","Te envío una propuesta con entregas","¿Hacemos una videollamada?","Ya subí la evidencia, ¿la puedes revisar?"],patrocinador:["¡Hola! Nos interesa tu evento","¿Cuál es el público exacto?","¿Hacemos una videollamada?","Te envío la propuesta de acuerdo"]};
function ChatView(){
  const {user,route,go,toast,bump,startCall}=useApp();
  const [txt,setTxt]=useState("");
  const [rep,setRep]=useState(false),[aiBusy,setAiBusy]=useState(false);
  const {apiKey}=useApp();
  const endRef=useRef(null);
  const chats=DB.chats().filter(c=>c.participants.includes(user.id)).sort((a,b)=>{const am=a.messages||[],bm=b.messages||[];const la=am[am.length-1],lb=bm[bm.length-1];return (lb?lb.ts:"").localeCompare(la?la.ts:"")});
  const ch=route.chat&&chats.find(c=>c.id===route.chat);
  useEffect(()=>{
    if(ch&&(ch.unread||{})[user.id]){markRead(ch.id,user.id);bump()}
    if(endRef.current)endRef.current.scrollIntoView({block:"end"});
  },[route.chat,ch&&(ch.messages||[]).length]);
  if(!ch)return <div>
    <Head title="Mensajes" sub="Conversa con marcas y eventos dentro de GetSponzo"/>
    {chats.length===0?<Empty icon="💬" title="Aún no tienes conversaciones" text={user.role==="patrocinador"?"Busca un evento y toca “💬 Escribir”.":"Ve a las marcas y escríbeles para presentar tu evento."} action={user.role==="patrocinador"?"🔍 Buscar eventos":"🏢 Ver marcas"} onAction={()=>go(user.role==="patrocinador"?"buscar":"marcas",{})}/>
    :<div className="card" style={{padding:"4px 14px"}}>{chats.map(c=>{
      const oid=c.participants.find(p=>p!==user.id),o=userById(oid),last=(c.messages||[])[(c.messages||[]).length-1],n=(c.unread||{})[user.id]||0;
      return <button key={c.id} className="lrow" onClick={()=>go("mensajes",{chat:c.id})}>
        <Av u={o} size={46}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:8}}><span className={"tmd ellip "+(n?"fw7":"fw6")}>{c.names[oid]||dispName(o)}</span><span className="txs cmu" style={{flexShrink:0}}>{last?hhmm(last.ts):""}</span></div>
          {c.eventName&&<div className="txs cte ellip">{c.eventName}</div>}
          <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"center"}}><span className="tsm ellip" style={{color:n?"var(--white)":"var(--muted)"}}>{last?(last.from===user.id?"Tú: ":"")+last.text:"Sin mensajes"}</span>{n>0&&<span className="pill" style={{background:"var(--teal)",color:"#07101e",padding:"2px 8px"}}>{n}</span>}</div>
        </div>
      </button>})}</div>}
  </div>;
  const oid=ch.participants.find(p=>p!==user.id),other=userById(oid);
  const writeAI=async()=>{
    const evs=DB.events();const ev=evs.find(e=>e.name===ch.eventName)||(user.role==="patrocinado"?evs.find(e=>e.ownerId===user.id):evs.find(e=>e.ownerId===oid));
    const fb=proposalTemplate(user,other,ev);
    setAiBusy(true);
    const r=await aiText(apiKey,`Escribe un mensaje breve (máximo 70 palabras), cordial y profesional, en español de Chile, para iniciar o continuar una conversación de patrocinio en una plataforma. Yo soy ${dispName(user)} (${ROLE[user.role].l}). Le escribo a ${dispName(other)} (${other?ROLE[other.role].l:""}${other&&other.sector?", sector "+other.sector:""}). ${ev?`Evento: ${ev.name}, en ${ev.loc}, público: ${ev.audience||"no indicado"}, paquetes: ${(ev.packages||[]).map(p=>p.name+" "+money(p.price,curOf(ev))).join(", ")||"sin paquetes"}.`:""} No incluyas correos ni teléfonos. Solo el mensaje, sin comillas.`,fb);
    setTxt(r.text.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,"").slice(0,700));setAiBusy(false);
    toast(r.ai?"Borrador escrito por IA":"Borrador listo",r.ai?"✨":"📝","Revísalo y tócalo para editar antes de enviar");
  };
  const send=t=>{
    const text=(t||txt).trim();if(!text)return;
    if(/[\w.+-]+@[\w-]+\.[\w.]+/.test(text)||/(\+?\d[\d\s-]{7,}\d)/.test(text)){toast("Por tu seguridad no compartas correos ni teléfonos","🛡️","Todo dentro de GetSponzo queda protegido");return}
    pushMsg(ch.id,{id:msgId(),from:user.id,text,ts:new Date().toISOString()},oid);
    setTxt("");bump();
  };
  return <div>
    <div className="chat-wrap">
      <div className="chat-head">
        <button className="ibtn" onClick={()=>go("mensajes",{})} aria-label="Volver">←</button>
        <Av u={other} size={38}/>
        <div style={{flex:1,minWidth:0}}><div className="fw7 tmd ellip">{ch.names[oid]||dispName(other)}</div><div className="txs cmu ellip">{ch.eventName||ROLE[(other||{}).role||"patrocinado"].l}</div></div>
        <button className="ibtn" onClick={()=>startCall(other)} title="Videollamada" style={{background:"rgba(23,212,160,.12)",borderColor:"var(--border)"}}>📹</button>
        <button className="ibtn" onClick={()=>setRep(true)} title="Reportar" aria-label="Reportar">🚩</button>
      </div>
      <div className="chat-body">
        <div className="sysmsg">🔒 Conversación protegida por GetSponzo</div>
        {(ch.messages||[]).map(m=>m.from==="sys"?<div key={m.id} className="sysmsg">{m.text}{m.call&&/^https:\/\/meet\.jit\.si\/[\w-]+$/.test(m.call)&&<div><a href={m.call} target="_blank" rel="noopener" className="btn btn-p btn-sm" style={{marginTop:8,textDecoration:"none"}}>📹 Unirme a la llamada</a></div>}</div>:
          <div key={m.id} style={{display:"flex",flexDirection:"column",alignItems:m.from===user.id?"flex-end":"flex-start"}}>
            <div className={"bub "+(m.from===user.id?"bub-me":"bub-them")}>{m.text}</div>
            <div className="bub-time">{hhmm(m.ts)}</div>
          </div>)}
        <div ref={endRef}/>
      </div>
      <div className="qr"><button disabled={aiBusy} onClick={writeAI} style={{background:"var(--pbg)",borderColor:"rgba(167,139,250,.4)",color:"var(--pur)"}}>{aiBusy?"✨ Escribiendo…":"✨ Escribir con IA"}</button>{(QUICK[user.role]||QUICK.patrocinado).map(q=><button key={q} onClick={()=>send(q)}>{q}</button>)}</div>
      {rep&&<ReportSheet target={other} chatId={ch.id} onClose={()=>setRep(false)}/>}
      <div className="chat-foot">
        <input className="inp" value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Escribe un mensaje…" style={{flex:1}}/>
        <button className="btn btn-p" style={{width:52,padding:0,flexShrink:0}} onClick={()=>send()} aria-label="Enviar">➤</button>
      </div>
    </div>
  </div>;
}

}

/* ══════════ ESTRUCTURA DE LA APP ══════════ */
const TABS={
  patrocinado:[["inicio","Inicio","🏠"],["eventos","Mis eventos","🎪"],["acuerdos","Acuerdos","🤝"],["mensajes","Mensajes","💬"],["perfil","Perfil","👤"]],
  patrocinador:[["inicio","Inicio","🏠"],["buscar","Buscar","🔍"],["acuerdos","Acuerdos","🤝"],["mensajes","Mensajes","💬"],["perfil","Perfil","👤"]],
  inversor:[["resumen","Resumen","📈"],["numeros","Números","💰"],["mercado","Mercado","🌎"],["contacto","Contacto","📩"],["perfil","Perfil","👤"]],
};
const homeTab=u=>u&&u.role==="inversor"?"resumen":"inicio";
function View(){
  const {user,route}=useApp();
  const V={admin:AdminView,inicio:HomeView,eventos:EventsView,buscar:ExploreView,marcas:BrandsView,acuerdos:DealsView,nuevo:NewDeal,mensajes:ChatView,perfil:ProfileView,resumen:InvResumen,numeros:InvNumeros,mercado:InvMercado,contacto:InvContacto}[route.tab];
  const allowed=TABS[user.role].map(t=>t[0]).concat(isAdmin()?["admin"]:[]).concat(user.role==="patrocinado"?["marcas","nuevo"]:user.role==="patrocinador"?["nuevo"]:[]);
  if(!V||!allowed.includes(route.tab)){const H=user.role==="inversor"?InvResumen:HomeView;return <H/>}
  return <V/>;
}
function Shell(){
  const A=useApp();const {user,route,go,openHelp}=A;
  const tabs=TABS[user.role];
  const tasks=getTasks(user);
  const badge={acuerdos:tasks.filter(t=>t.go[0]==="acuerdos").length,mensajes:unreadCount(user.id),inicio:0};
  const active=route.tab==="nuevo"?"acuerdos":route.tab==="marcas"?"inicio":route.tab;
  const nb=n=>n>0?<i className="nb">{n>9?"9+":n}</i>:null;
  return <div>
    <nav className="tnav"><div className="container"><div className="tni">
      <button onClick={()=>go(homeTab(user),{})} style={{display:"flex",alignItems:"center",gap:8,color:"var(--white)",minWidth:0}}><Logo size={26} glow={false}/><Word s={17}/></button>
      <div style={{display:"flex",gap:7,alignItems:"center"}}>
        <button className="ibtn" onClick={A.openNotif} title="Avisos" aria-label="Avisos" style={{position:"relative"}}>🔔{tasks.length>0&&<i className="nb" style={{top:-6,left:"auto",right:-6}}>{tasks.length>9?"9+":tasks.length}</i>}</button>
        <button className="ibtn" onClick={openHelp} title="Ayuda" aria-label="Ayuda">❓</button>
        <button className="ibtn" onClick={()=>{A.toast("Buscando la versión más nueva…","🔄");setTimeout(()=>location.replace(location.pathname+"?v="+Date.now()),500)}} title="Actualizar" aria-label="Actualizar">🔄</button>
        <button onClick={()=>go("perfil",{})} aria-label="Perfil" style={{borderRadius:"50%"}}><Av u={user} size={38}/></button>
      </div>
    </div></div></nav>
    {!REAL&&HAS_FB&&<div style={{background:"rgba(245,200,66,.12)",borderBottom:"1px solid rgba(245,200,66,.3)"}}><div className="container" style={{display:"flex",alignItems:"center",gap:10,padding:"8px 16px"}}>
      <span style={{fontSize:13,flex:1,lineHeight:1.35}}>👀 <b>Estás en la DEMO.</b> <span className="cmu">Nada de lo que hagas aquí afecta la plataforma real.</span></span>
      <button className="btn btn-g btn-sm" style={{flexShrink:0,minHeight:34,padding:"6px 12px"}} onClick={A.logout}>Salir</button></div></div>}
    <div className="container play">
      <aside className="sbar">
        <div style={{padding:"4px 13px 12px"}}><div className="txs cmu">Conectado como</div><div className="fw7 tsm ellip">{ROLE[user.role].i} {ROLE[user.role].l}</div></div>
        {tabs.map(([id,l,i])=><button key={id} className={active===id?"on":""} onClick={()=>go(id,{})}><i>{i}</i>{l}{nb(badge[id])}</button>)}
        {user.role!=="inversor"&&<button className="btn btn-p btn-sm mt16" style={{width:"100%",color:"#07101e",justifyContent:"center",background:"linear-gradient(135deg,var(--teal),var(--td))"}} onClick={()=>go(user.role==="patrocinado"?"eventos":"nuevo",user.role==="patrocinado"?{nuevo:1}:{})}>{user.role==="patrocinado"?"➕ Crear evento":"➕ Nuevo acuerdo"}</button>}
      </aside>
      <main className="main" style={{animation:"fadeIn .25s ease"}} key={route.tab+(route.cid||"")+(route.did||"")+(route.chat||"")}><View/></main>
    </div>
    <div className="bnav">{tabs.map(([id,l,i])=><button key={id} className={"bni"+(active===id?" on":"")} onClick={()=>go(id,{})}><i>{i}</i>{l}{nb(badge[id])}</button>)}</div>
  </div>;
}

function App(){
  const [user,setUserS]=useState(()=>{if(REAL)return null;initData();const id=DB.sess();return id?userById(id)||null:null});
  const [screen,setScreen]=useState(()=>REAL?"loading":(DB.sess()&&userById(DB.sess())?"app":"landing"));
  const [authMode,setAuthMode]=useState("login");
  const [route,setRoute]=useState(()=>({tab:homeTab(user)}));
  const [,setRev]=useState(0);
  const [toastS,setToastS]=useState(null);
  const [call,setCall]=useState(null);
  const [conf,setConf]=useState(null);
  const [help,setHelp]=useState(false),[notif,setNotif]=useState(false),[pick,setPick]=useState(null);
  const lastTasks=useRef(-1);
  const [welcome,setWelcome]=useState(false);
  const [apiKey,setApiKeyS]=useState(DB.api());
  const tRef=useRef(null);
  const userRef=useRef(user);userRef.current=user;

  useEffect(()=>{
    history.replaceState({screen:screen==="loading"?"landing":screen,...route},"");
    const onPop=e=>{
      const s=e.state;if(!s||s.screen==="loading")return;
      if(s.screen==="app"&&!userRef.current){setScreen("landing");return}
      setScreen(s.screen);
      if(s.screen==="auth")setAuthMode(s.mode||"login");
      if(s.screen==="app"){const {screen:_x,...r}=s;setRoute(r.tab?r:{tab:homeTab(userRef.current)})}
      setConf(null);
    };
    window.addEventListener("popstate",onPop);return()=>window.removeEventListener("popstate",onPop);
  },[]);

  const toast=(msg,icon="✅",sub)=>{setToastS({msg,icon,sub});clearTimeout(tRef.current);tRef.current=setTimeout(()=>setToastS(null),3000)};
  const bump=()=>{if(userRef.current){const u=userById(userRef.current.id);if(u)setUserS(u)}setRev(r=>r+1)};
  const go=(tab,extra={})=>{const r={tab,...extra};history.pushState({screen:"app",...r},"");setRoute(r);setScreen("app");window.scrollTo(0,0)};
  const nav=(s,extra={})=>{history.pushState({screen:s,...extra},"");setScreen(s);window.scrollTo(0,0)};
  useEffect(()=>{
    if(!HAS_FB||!AUTH)return;
    onData=()=>{if(userRef.current){const u=userById(userRef.current.id);if(u)setUserS(u)}setRev(r=>r+1)};
    return AUTH.onAuthStateChanged(async fu=>{
      if(!REAL)return;
      if(!fu){stopSync();userRef.current=null;setUserS(null);setScreen(s=>s==="auth"?"auth":"landing");return}
      setScreen(s=>s==="auth"||s==="pickrole"?s:"loading");
      await startSync(fu.uid);
      let u=userById(fu.uid);
      if(!u){
        const p=PENDING;PENDING=null;
        if(!p||!p.role){setPick(fu);setScreen("pickrole");return}
        u={id:fu.uid,name:p.name||fu.displayName||(fu.email||"").split("@")[0],role:p.role,company:p.company||"",cur:p.cur||"CLP",bio:"",loc:"",created:new Date().toISOString()};
        if(fu.photoURL)u.photoUrl=fu.photoURL;
        DB.setUsers([...DB.users(),u]);
      }
      login(u);
      try{const was=fu.emailVerified;await fu.reload();const cu=AUTH.currentUser;if(cu&&cu.emailVerified){await cu.getIdToken(true);if(!was)toast("¡Correo verificado!","✅")}setRev(r=>r+1)}catch(e){}
    });
  },[]);
  const login=u=>{
    if(!REAL)DB.setSess(u.id);setUserS(u);userRef.current=u;const r={tab:homeTab(u)};
    history.pushState({screen:"app",...r},"");setRoute(r);setScreen("app");window.scrollTo(0,0);
    if(!DB.flag("welcome_"+u.id)){DB.setFlag("welcome_"+u.id);setWelcome(true)}
  };
  const wasDemo=()=>HAS_FB&&!REAL;
  const logout=()=>{const d=wasDemo();if(REAL)AUTH.signOut();else DB.clearSess();if(d)setDemo(false);userRef.current=null;setUserS(null);nav("landing");toast(d?"Saliste de la demo":"Sesión cerrada","👋",d?"Volviste a la plataforma real":undefined)};
  const enterDemo=id=>{
    if(HAS_FB&&AUTH&&AUTH.currentUser){REAL=false;AUTH.signOut().catch(()=>{})}
    stopSync();setDemo(true);initData();const u=userById(id);
    if(u){login(u);toast("Estás en la demo","👀","Nada de lo que hagas aquí afecta la plataforma real")}
  };
  const setUser=u=>{DB.setUsers(DB.users().map(x=>x.id===u.id?u:x));setUserS(u)};
  const setApiKey=k=>{DB.setApi(k);setApiKeyS(k)};
  const switchUser=id=>{const u=userById(id);if(u){login(u);toast("Ahora ves la app como "+ROLE[u.role].l,ROLE[u.role].i)}};
  const chatWith=(otherId,eventName)=>{
    const me=userRef.current;
    const ch=findChat(me.id,otherId)||createChat(me.id,otherId,eventName);
    go("mensajes",{chat:ch.id});
  };
  const ctx={user,setUser,route,go,toast,bump,apiKey,setApiKey,logout,switchUser,chatWith,enterDemo,
    startCall:peer=>setCall(peer||{id:"x",name:"Usuario"}),confirm:o=>setConf(o),openHelp:()=>setHelp(true),openNotif:()=>setNotif(true)};
  const tcount=user?getTasks(user).length:0;
  useEffect(()=>{
    try{document.title=(tcount?"("+tcount+") ":"")+(LANG==="en"?"GetSponzo — Protected sponsorship":"GetSponzo — Patrocinio protegido")}catch(e){}
    if(lastTasks.current>=0&&tcount>lastTasks.current)pushNotif("GetSponzo","Tienes "+tcount+" pendiente"+(tcount>1?"s":"")+". Toca para revisar.");
    lastTasks.current=user?tcount:-1;
  });

  return <Ctx.Provider value={ctx}>
    {screen==="pickrole"&&pick&&<RolePick fu={pick} onDone={u=>{setPick(null);login(u)}} onCancel={()=>{setPick(null);AUTH.signOut();nav("landing")}}/>}
    {screen==="loading"&&<div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}><Logo size={56}/><Word s={22}/><div className="tsm cmu">Conectando…</div></div>}
    {screen==="landing"&&<Landing user={user} onPanel={()=>go(homeTab(user),{})} onLogin={()=>{setAuthMode("login");nav("auth",{mode:"login"})}} onRegister={()=>{setAuthMode("register");nav("auth",{mode:"register"})}}/>}
    {screen==="auth"&&<Auth mode={authMode} setMode={setAuthMode} onLogin={login} onDemo={enterDemo} onBack={()=>nav("landing")}/>}
    {screen==="app"&&user&&(user.suspended?<Suspended onLogout={logout}/>:<Shell/>)}
    {screen==="app"&&!user&&<Landing user={null} onPanel={()=>{}} onLogin={()=>{setAuthMode("login");nav("auth",{mode:"login"})}} onRegister={()=>{setAuthMode("register");nav("auth",{mode:"register"})}}/>}
    {welcome&&user&&<WelcomeSheet onClose={()=>setWelcome(false)}/>}
    {help&&user&&<HelpSheet onClose={()=>setHelp(false)}/>}
    {notif&&user&&<NotifSheet onClose={()=>setNotif(false)}/>}
    {conf&&<Sheet title={conf.title} icon={conf.danger?"⚠️":"✋"} onClose={()=>setConf(null)} footer={<><button className="btn btn-g" onClick={()=>setConf(null)}>Cancelar</button><button className={"btn "+(conf.danger?"btn-d":"btn-p")} onClick={()=>{const f=conf.onOk;setConf(null);f&&f()}}>{conf.ok||"Confirmar"}</button></>}><p className="tmd" style={{lineHeight:1.6}}>{conf.text}</p></Sheet>}
    {call&&user&&<CallSheet peer={call} onClose={()=>setCall(null)}/>}
    {toastS&&<div className="toast"><span style={{fontSize:19,flexShrink:0}}>{toastS.icon}</span><div style={{minWidth:0}}><div style={{fontWeight:700,fontSize:14}}>{toastS.msg}</div>{toastS.sub&&<div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>{toastS.sub}</div>}</div></div>}
  </Ctx.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
