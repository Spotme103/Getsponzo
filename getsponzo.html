const {useState,useEffect,useRef,useCallback,useMemo}=React;

/* ══ GEMINI ══ */
async function callGemini(apiKey,d){
  const prompt=`Eres el árbitro imparcial de GetSponzo, marketplace de patrocinio.
DISPUTA: ${d.title}
DESCRIPCIÓN: ${d.description}
EVIDENCIA DEL DEMANDANTE: ${d.claimantEvidence}
DEFENSA DEL ACUSADO: ${d.defense||"No presentó defensa en el plazo de 7 días."}
Analiza objetivamente ambas posiciones. Solo puedes usar: 0, 25, 50, 75 o 100.
Responde SOLO este JSON: {"verdict_pct":NUM,"reasoning":["análisis 1","análisis 2","análisis 3","resolución"]}`;
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.3,maxOutputTokens:700}})
  });
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||"Error de conexión con Gemini")}
  const j=await r.json();
  const t=j.candidates?.[0]?.content?.parts?.[0]?.text||"";
  const m=t.match(/\{[\s\S]*\}/);
  if(!m)throw new Error("Respuesta inválida de la IA");
  return JSON.parse(m[0]);
}

/* ══ VIDEO CALL ══ */
function VideoCall({peer,peerAv,onEnd,showToast}){
  const [dur,setDur]=useState(0);
  const [mic,setMic]=useState(true);
  const [cam,setCam]=useState(true);
  const [connecting,setConnecting]=useState(true);
  useEffect(()=>{
    const t1=setTimeout(()=>setConnecting(false),1800);
    const iv=setInterval(()=>setDur(d=>d+1),1000);
    return()=>{clearTimeout(t1);clearInterval(iv)};
  },[]);
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  return(
    <div className="vcall">
      <div style={{padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:connecting?"var(--warn)":"var(--err)",animation:"pulse 1.6s infinite"}}/>
          <span style={{fontSize:13,fontWeight:600}}>{connecting?"Conectando…":"● REC "+fmt(dur)}</span>
        </div>
        <span style={{fontSize:12,color:"var(--muted)"}}>🔒 Llamada segura</span>
      </div>
      <div className="vc-main">
        <div className="vc-remote">
          {connecting?(
            <>
              <div style={{width:80,height:80,borderRadius:"50%",border:"3px solid rgba(23,212,160,.2)",borderTopColor:"var(--teal)",animation:"spin 1s linear infinite"}}/>
              <div style={{fontSize:15,color:"var(--muted)"}}>Llamando a {peer}…</div>
            </>
          ):(
            <>
              <div style={{animation:"ring 2s infinite",borderRadius:"50%"}}><Av t={peerAv} size={96}/></div>
              <div style={{fontSize:19,fontWeight:700}}>{peer}</div>
              <div style={{fontSize:13,color:"var(--muted)"}}>Videollamada en curso</div>
            </>
          )}
        </div>
        <div className="vc-self">
          {cam?<><span style={{fontSize:26}}>😊</span><span style={{fontSize:11,color:"var(--muted)"}}>Tú</span></>
              :<><span style={{fontSize:24}}>📷</span><span style={{fontSize:10,color:"var(--muted)"}}>Cámara off</span></>}
        </div>
      </div>
      <div className="vc-bar">
        <button className="vc-btn" style={{background:mic?"rgba(255,255,255,.1)":"var(--err)"}} onClick={()=>setMic(!mic)}>{mic?"🎤":"🔇"}</button>
        <button className="vc-btn" style={{background:cam?"rgba(255,255,255,.1)":"var(--err)"}} onClick={()=>setCam(!cam)}>{cam?"📹":"📷"}</button>
        <button className="vc-btn" style={{background:"var(--err)",width:64,height:64,fontSize:26}} onClick={()=>{showToast("Llamada finalizada","📞",`Duración: ${fmt(dur)}`);onEnd()}}>📵</button>
        <button className="vc-btn" style={{background:"rgba(255,255,255,.1)"}} onClick={()=>showToast("Grabación guardada","⏺️","Disponible en el contrato.")}>⏺️</button>
      </div>
    </div>
  );
}

/* ══ AUTH ══ */
function Auth({onLogin,showToast,goBack}){
  const [mode,setMode]=useState("login");
  const [step,setStep]=useState(1);
  const [role,setRole]=useState("");
  const [f,setF]=useState({name:"",email:"",pass:"",company:"",sector:"",loc:"",bio:"",budget:"",range:"",focus:""});
  const [busy,setBusy]=useState(false);
  const S=(k,v)=>setF(p=>({...p,[k]:v}));

  const doLogin=()=>{
    setBusy(true);
    setTimeout(()=>{
      seedIfEmpty();
      const u=DB.users().find(x=>x.email.toLowerCase()===f.email.trim().toLowerCase()&&x.pass===f.pass);
      if(!u){showToast("Email o contraseña incorrectos","❌");setBusy(false);return}
      DB.setSess(u);onLogin(u);setBusy(false);
    },600);
  };

  const doReg=()=>{
    if(step===1){
      if(!f.name.trim()||!f.email.trim()||!f.pass){showToast("Completa todos los campos","⚠️");return}
      if(f.pass.length<6){showToast("Mínimo 6 caracteres en la contraseña","⚠️");return}
      seedIfEmpty();
      if(DB.users().some(u=>u.email.toLowerCase()===f.email.trim().toLowerCase())){showToast("Ya existe una cuenta con ese email","❌");return}
      setStep(2);return;
    }
    if(step===2){if(!role){showToast("Elige un tipo de perfil","⚠️");return}setStep(3);return}
    setBusy(true);
    setTimeout(()=>{
      seedIfEmpty();
      const av=f.name.trim().split(/\s+/).map(w=>w[0]).join("").toUpperCase().slice(0,2);
      const u={id:uid("u"),name:f.name.trim(),email:f.email.trim(),pass:f.pass,role,av,loc:f.loc,bio:f.bio,
        ...(role==="patrocinado"?{trust:70,deals:0,compliance:100}:{}),
        ...(role==="patrocinador"?{company:f.company,sector:f.sector,budget:f.budget}:{}),
        ...(role==="inversor"?{company:f.company,range:f.range,focus:f.focus}:{})};
      DB.setUsers([...DB.users(),u]);DB.setSess(u);onLogin(u);setBusy(false);
      showToast("¡Cuenta creada!","🎉","Bienvenido a GetSponzo.");
    },700);
  };

  const demo=email=>{seedIfEmpty();const u=DB.users().find(x=>x.email===email);if(u){DB.setSess(u);onLogin(u)}};

  const ROLES=[
    {id:"patrocinado",i:"🎯",t:"Patrocinado",d:"Organizo eventos, clubes o creo contenido y busco marcas"},
    {id:"patrocinador",i:"🏢",t:"Patrocinador",d:"Represento una marca que quiere patrocinar proyectos"},
    {id:"inversor",i:"💼",t:"Inversor",d:"Quiero conocer la oportunidad de inversión en GetSponzo"},
  ];

  return(
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",flexDirection:"column"}}>
      <div style={{padding:"16px 16px 0",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}><Logo size={28}/><Word s={19}/></div>
        {goBack&&<button onClick={goBack} style={{fontSize:13,color:"var(--muted)",background:"none",border:"none",cursor:"pointer",fontFamily:"'Inter',sans-serif"}}>← Inicio</button>}
      </div>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"22px 16px 40px"}}>
        <div style={{width:"100%",maxWidth:430}}>
          {mode==="login"?(
            <div className="fu">
              <h1 style={{fontSize:26,fontWeight:800,marginBottom:6}}>Bienvenido de nuevo</h1>
              <p className="cmu mb20" style={{fontSize:15}}>Entra a tu cuenta de GetSponzo</p>
              <div className="iw"><label className="lbl">Email</label><input className="inp" type="email" autoComplete="email" value={f.email} onChange={e=>S("email",e.target.value)} placeholder="tu@email.com"/></div>
              <div className="iw"><label className="lbl">Contraseña</label><input className="inp" type="password" value={f.pass} onChange={e=>S("pass",e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&doLogin()}/></div>
              <button className="btn btn-p mb16" onClick={doLogin} disabled={busy} style={{width:"100%"}}>{busy?"Entrando…":"Entrar →"}</button>
              <div className="tc-c mb20" style={{fontSize:14,color:"var(--muted)"}}>¿No tienes cuenta? <button onClick={()=>{setMode("register");setStep(1)}} style={{color:"var(--teal)",fontWeight:600,background:"none",border:"none",cursor:"pointer",fontSize:14,fontFamily:"'Inter',sans-serif"}}>Crear cuenta gratis</button></div>
              <div style={{background:"rgba(23,212,160,.05)",border:"1px solid var(--border)",borderRadius:13,padding:15}}>
                <div style={{fontSize:11,fontWeight:700,color:"var(--teal)",textTransform:"uppercase",letterSpacing:".5px",marginBottom:11}}>🎮 Prueba con cuentas demo</div>
                {[["cristobal@demo.com","Cristóbal · Patrocinado","🎯"],["maria@demo.com","María · Patrocinadora","🏢"],["pablo@demo.com","Pablo · Inversor","💼"]].map(([e,l,i])=>(
                  <button key={e} onClick={()=>demo(e)} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"11px 12px",borderRadius:10,background:"rgba(255,255,255,.04)",border:"1px solid var(--bs)",marginBottom:7,cursor:"pointer",fontFamily:"'Inter',sans-serif",color:"var(--white)",fontSize:13,fontWeight:500,minHeight:44}}>
                    <span style={{fontSize:17}}>{i}</span><span>{l}</span>
                  </button>
                ))}
              </div>
            </div>
          ):(
            <div className="fu">
              <div className="steps">{[1,2,3].map(n=><div key={n} className={"step"+(n<=step?" on":"")}/>)}</div>
              {step===1&&(<>
                <h1 style={{fontSize:24,fontWeight:800,marginBottom:6}}>Crea tu cuenta</h1>
                <p className="cmu mb20" style={{fontSize:15}}>Gratis. Solo pagas cuando cierras un acuerdo.</p>
                <div className="iw"><label className="lbl">Tu nombre completo</label><input className="inp" value={f.name} onChange={e=>S("name",e.target.value)} placeholder="Cristóbal Torretti"/></div>
                <div className="iw"><label className="lbl">Email</label><input className="inp" type="email" value={f.email} onChange={e=>S("email",e.target.value)} placeholder="tu@email.com"/></div>
                <div className="iw"><label className="lbl">Contraseña (mín. 6)</label><input className="inp" type="password" value={f.pass} onChange={e=>S("pass",e.target.value)} placeholder="••••••••"/></div>
              </>)}
              {step===2&&(<>
                <h1 style={{fontSize:24,fontWeight:800,marginBottom:6}}>¿Cómo usarás GetSponzo?</h1>
                <p className="cmu mb20" style={{fontSize:15}}>Define lo que verás en la plataforma</p>
                <div style={{display:"flex",flexDirection:"column",gap:11}}>
                  {ROLES.map(r=>(
                    <div key={r.id} className={"tc"+(role===r.id?" on":"")} onClick={()=>setRole(r.id)}>
                      <div style={{display:"flex",alignItems:"center",gap:13}}>
                        <span style={{fontSize:30,flexShrink:0}}>{r.i}</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:700,fontSize:15,marginBottom:2}}>{r.t}</div>
                          <div style={{fontSize:12.5,color:"var(--muted)",lineHeight:1.4}}>{r.d}</div>
                        </div>
                        <div style={{width:22,height:22,borderRadius:"50%",border:`2px solid ${role===r.id?"var(--teal)":"var(--bs)"}`,background:role===r.id?"var(--teal)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{role===r.id&&<span style={{color:"#07101e",fontSize:11,fontWeight:800}}>✓</span>}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </>)}
              {step===3&&(<>
                <h1 style={{fontSize:24,fontWeight:800,marginBottom:6}}>Cuéntanos un poco más</h1>
                <p className="cmu mb20" style={{fontSize:15}}>{role==="patrocinado"?"Después podrás crear todos los eventos que quieras":role==="patrocinador"?"Datos de tu marca o empresa":"Datos para el equipo de GetSponzo"}</p>
                {role==="patrocinado"&&(<>
                  <div className="iw"><label className="lbl">Ciudad y país</label><input className="inp" value={f.loc} onChange={e=>S("loc",e.target.value)} placeholder="Santiago, Chile"/></div>
                  <div className="iw"><label className="lbl">Sobre ti (breve)</label><textarea className="inp" value={f.bio} onChange={e=>S("bio",e.target.value)} placeholder="ej: Organizo eventos deportivos amateur desde 2019"/></div>
                  <div style={{background:"rgba(23,212,160,.06)",border:"1px solid var(--border)",borderRadius:12,padding:14,fontSize:13,color:"var(--muted)",lineHeight:1.6}}>
                    💡 Una vez dentro podrás crear <strong className="cwh">todos los eventos o proyectos que quieras</strong> desde el menú "Mis Eventos".
                  </div>
                </>)}
                {role==="patrocinador"&&(<>
                  <div className="iw"><label className="lbl">Nombre de la marca</label><input className="inp" value={f.company} onChange={e=>S("company",e.target.value)} placeholder="ej: Marca Deportiva Chile"/></div>
                  <div className="iw"><label className="lbl">Sector</label><input className="inp" value={f.sector} onChange={e=>S("sector",e.target.value)} placeholder="ej: Retail, Tecnología, Banca"/></div>
                  <div className="iw"><label className="lbl">Ciudad y país</label><input className="inp" value={f.loc} onChange={e=>S("loc",e.target.value)} placeholder="Santiago, Chile"/></div>
                  <div className="iw"><label className="lbl">Presupuesto anual de patrocinio</label><input className="inp" value={f.budget} onChange={e=>S("budget",e.target.value)} placeholder="ej: €10.000–€50.000"/></div>
                </>)}
                {role==="inversor"&&(<>
                  <div className="iw"><label className="lbl">Empresa o fondo</label><input className="inp" value={f.company} onChange={e=>S("company",e.target.value)} placeholder="ej: VC Chile Capital"/></div>
                  <div className="iw"><label className="lbl">Rango de inversión</label>
                    <select className="inp" value={f.range} onChange={e=>S("range",e.target.value)} style={{color:f.range?"var(--white)":"rgba(107,143,168,.5)"}}>
                      <option value="">Selecciona…</option>{["€10K–€50K","€50K–€200K","€200K–€500K","€500K+"].map(r=><option key={r} value={r}>{r}</option>)}
                    </select>
                  </div>
                  <div className="iw"><label className="lbl">Foco de inversión</label><input className="inp" value={f.focus} onChange={e=>S("focus",e.target.value)} placeholder="ej: SaaS, marketplaces"/></div>
                </>)}
              </>)}
              <div style={{display:"flex",gap:10,marginTop:6}}>
                {step>1&&<button className="btn btn-g btn-sm" onClick={()=>setStep(s=>s-1)} style={{flexShrink:0}}>← Atrás</button>}
                <button className="btn btn-p" onClick={doReg} disabled={busy} style={{flex:1}}>{busy?"Creando…":step<3?"Continuar →":"Crear mi cuenta →"}</button>
              </div>
              <div className="tc-c mt20" style={{fontSize:14,color:"var(--muted)"}}>¿Ya tienes cuenta? <button onClick={()=>{setMode("login");setStep(1)}} style={{color:"var(--teal)",fontWeight:600,background:"none",border:"none",cursor:"pointer",fontSize:14,fontFamily:"'Inter',sans-serif"}}>Iniciar sesión</button></div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ══ MIS EVENTOS (patrocinado) ══ */
function EventsView({user,showToast}){
  const [events,setEvents]=useState(()=>DB.events().filter(e=>e.ownerId===user.id));
  const [modal,setModal]=useState(false);
  const [edit,setEdit]=useState(null);
  const blank={name:"",cat:"Deporte",loc:user.loc||"",budgetMin:"",budgetMax:"",audience:"",desc:""};
  const [f,setF]=useState(blank);
  const S=(k,v)=>setF(p=>({...p,[k]:v}));

  const open=(ev)=>{
    if(ev){setEdit(ev.id);setF({name:ev.name,cat:ev.cat,loc:ev.loc,budgetMin:String(ev.budgetMin),budgetMax:String(ev.budgetMax),audience:ev.audience,desc:ev.desc})}
    else{setEdit(null);setF(blank)}
    setModal(true);
  };

  const submit=()=>{
    if(!f.name.trim()){showToast("Escribe el nombre del evento","⚠️");return}
    if(!f.budgetMin||!f.budgetMax){showToast("Indica el rango de presupuesto","⚠️");return}
    const all=DB.events();
    if(edit){
      const upd=all.map(e=>e.id===edit?{...e,name:f.name.trim(),cat:f.cat,loc:f.loc,budgetMin:Number(f.budgetMin),budgetMax:Number(f.budgetMax),audience:f.audience,desc:f.desc,icon:CATS.find(c=>c.v===f.cat)?.i||"⭐"}:e);
      DB.setEvents(upd);setEvents(upd.filter(e=>e.ownerId===user.id));
      showToast("Evento actualizado","✅");
    }else{
      const ne={id:uid("e"),ownerId:user.id,name:f.name.trim(),cat:f.cat,icon:CATS.find(c=>c.v===f.cat)?.i||"⭐",loc:f.loc,budgetMin:Number(f.budgetMin),budgetMax:Number(f.budgetMax),audience:f.audience,desc:f.desc,compliance:100,deals:0,trust:70,badge:"new",created:now()};
      const upd=[...all,ne];DB.setEvents(upd);setEvents(upd.filter(e=>e.ownerId===user.id));
      showToast("¡Evento creado!","🎉","Ya está visible para los patrocinadores.");
    }
    setModal(false);
  };

  const del=(id)=>{
    const upd=DB.events().filter(e=>e.id!==id);
    DB.setEvents(upd);setEvents(upd.filter(e=>e.ownerId===user.id));
    showToast("Evento eliminado","🗑️");
  };

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,marginBottom:18,flexWrap:"wrap"}}>
        <div className="sh mb0"><h2>Mis eventos</h2><p>Crea y gestiona todos tus proyectos</p></div>
        <button className="btn btn-p btn-sm fsh0" onClick={()=>open(null)}>+ Nuevo evento</button>
      </div>

      {events.length===0?(
        <Empty icon="🎪" title="Aún no tienes eventos" text="Crea tu primer evento o proyecto para que las marcas puedan encontrarte y patrocinarte." action="+ Crear mi primer evento" onAction={()=>open(null)}/>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:11}}>
          {events.map(ev=>(
            <div key={ev.id} className="card">
              <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                <div style={{width:46,height:46,borderRadius:13,background:"rgba(23,212,160,.1)",border:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:23,flexShrink:0}}>{ev.icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:15,marginBottom:3}}>{ev.name}</div>
                  <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:7}}>{ev.cat} · {ev.loc}</div>
                  <div className="rowb">
                    <span className="tag" style={{background:"rgba(23,212,160,.1)",color:"var(--teal)"}}>{money(ev.budgetMin)}–{money(ev.budgetMax)}</span>
                    <span className="tag" style={{background:"rgba(255,255,255,.05)",color:"var(--muted)"}}>📊 {ev.compliance}%</span>
                    <span className="tag" style={{background:"rgba(255,255,255,.05)",color:"var(--muted)"}}>{ev.deals} acuerdos</span>
                  </div>
                </div>
              </div>
              {ev.audience&&<div style={{fontSize:12.5,color:"var(--muted)",marginTop:11,paddingTop:11,borderTop:"1px solid var(--bs)"}}>👥 {ev.audience}</div>}
              <div style={{display:"flex",gap:8,marginTop:12}}>
                <button className="btn btn-g btn-sm" style={{flex:1}} onClick={()=>open(ev)}>✏️ Editar</button>
                <button className="btn btn-d btn-sm" style={{flex:1}} onClick={()=>{if(confirm("¿Eliminar este evento?"))del(ev.id)}}>🗑️ Eliminar</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {modal&&(
        <Modal close={()=>setModal(false)} title={edit?"Editar evento":"Nuevo evento"}>
          <div className="iw"><label className="lbl">Nombre del evento o proyecto</label><input className="inp" value={f.name} onChange={e=>S("name",e.target.value)} placeholder="ej: Club Deportivo Andes"/></div>
          <div className="iw"><label className="lbl">Categoría</label>
            <select className="inp" value={f.cat} onChange={e=>S("cat",e.target.value)}>{CATS.map(c=><option key={c.v} value={c.v}>{c.i} {c.v}</option>)}</select>
          </div>
          <div className="iw"><label className="lbl">Ciudad y país</label><input className="inp" value={f.loc} onChange={e=>S("loc",e.target.value)} placeholder="Santiago, Chile"/></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:15}}>
            <div><label className="lbl">Presupuesto mín. (€)</label><input className="inp" type="number" value={f.budgetMin} onChange={e=>S("budgetMin",e.target.value)} placeholder="3000"/></div>
            <div><label className="lbl">Presupuesto máx. (€)</label><input className="inp" type="number" value={f.budgetMax} onChange={e=>S("budgetMax",e.target.value)} placeholder="8000"/></div>
          </div>
          <div className="iw"><label className="lbl">Tu audiencia</label><input className="inp" value={f.audience} onChange={e=>S("audience",e.target.value)} placeholder="ej: Familias 25-45 · 12.000 asistentes"/></div>
          <div className="iw"><label className="lbl">Descripción</label><textarea className="inp" value={f.desc} onChange={e=>S("desc",e.target.value)} placeholder="¿Qué ofreces a las marcas patrocinadoras?"/></div>
          <button className="btn btn-p" style={{width:"100%"}} onClick={submit}>{edit?"Guardar cambios":"🎉 Crear evento"}</button>
        </Modal>
      )}
    </div>
  );
}

                <div style={{width:48,height:48,borderRadius:13,background:"rgba(23,212,160,.1)",border:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>{e.icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:14.5,marginBottom:3}} className="ellip">{e.name}</div>
                  <div style={{fontSize:12,color:"var(--muted)",marginBottom:6}} className="ellip">{e.loc} · {money(e.budgetMin)}–{money(e.budgetMax)}</div>
                  <div className="rowb">

/* ══ CONTRATOS ══ */
function ContractsView({user,showToast,initEvent,clearInit,goTab}){
  const [contracts,setContracts]=useState(()=>DB.contracts().filter(c=>c.sponsorId===user.id||c.sponsoredId===user.id));
  const [sel,setSel]=useState(null);
  const [modal,setModal]=useState(!!initEvent);
  const [targetEvent,setTargetEvent]=useState(initEvent||null);

  useEffect(()=>{if(initEvent){setTargetEvent(initEvent);setModal(true)}},[initEvent]);

  const refresh=()=>setContracts(DB.contracts().filter(c=>c.sponsorId===user.id||c.sponsoredId===user.id));

  const approveMs=(cid,mid)=>{
    const all=DB.contracts().map(c=>{
      if(c.id!==cid)return c;
      const ms=c.milestones.map(m=>m.id===mid?{...m,status:"approved"}:m);
      const done=ms.every(m=>m.status==="approved");
      return{...c,milestones:ms,status:done?"completed":c.status};
    });
    DB.setContracts(all);refresh();
    const c=all.find(x=>x.id===cid);setSel(c);
    showToast("Hito aprobado","✅","El pago fue liberado del escrow.");
  };

  const submitEvidence=(cid,mid,ev)=>{
    const all=DB.contracts().map(c=>c.id!==cid?c:{...c,milestones:c.milestones.map(m=>m.id===mid?{...m,status:"submitted",evidence:ev}:m)});
    DB.setContracts(all);refresh();setSel(all.find(x=>x.id===cid));
    showToast("Evidencia enviada","📎","El patrocinador debe aprobarla.");
  };

  const openDispute=(c,m)=>{
    const d={id:uid("d"),contractId:c.id,milestoneId:m.id,title:`${m.title} — disputa abierta`,openedById:user.id,openedByName:user.name,againstId:user.id===c.sponsorId?c.sponsoredId:c.sponsorId,status:"open",amount:m.amount,description:`Disputa sobre el hito "${m.title}" del contrato con ${user.id===c.sponsorId?c.sponsoredName:c.sponsorName}.`,claimantEvidence:m.evidence||"Sin evidencia adjunta.",defense:"",defenseSent:false,daysLeft:7,created:now()};
    DB.setDisputes([...DB.disputes(),d]);
    const all=DB.contracts().map(x=>x.id!==c.id?x:{...x,milestones:x.milestones.map(mm=>mm.id===m.id?{...mm,status:"disputed"}:mm)});
    DB.setContracts(all);refresh();setSel(all.find(x=>x.id===c.id));
    showToast("Disputa abierta","⚖️","7 días para presentar evidencias.");
  };

  if(sel){
    const c=contracts.find(x=>x.id===sel.id)||sel;
    const paid=c.milestones.filter(m=>m.status==="approved").reduce((a,m)=>a+m.amount,0);
    const isSponsor=user.id===c.sponsorId;
    return <ContractDetail c={c} paid={paid} isSponsor={isSponsor} back={()=>setSel(null)} onApprove={approveMs} onEvidence={submitEvidence} onDispute={openDispute} goTab={goTab} showToast={showToast}/>;
  }

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,marginBottom:18,flexWrap:"wrap"}}>
        <div className="sh mb0"><h2>Contratos</h2><p>Acuerdos con pago protegido por hitos</p></div>
        {user.role==="patrocinador"&&<button className="btn btn-p btn-sm fsh0" onClick={()=>{setTargetEvent(null);setModal(true)}}>+ Nuevo</button>}
      </div>

      {contracts.length===0?(
        <Empty icon="📝" title="Sin contratos todavía" text={user.role==="patrocinador"?"Explora proyectos y crea tu primer contrato con escrow.":"Cuando una marca te contrate, el contrato aparecerá aquí."} action={user.role==="patrocinador"?"Explorar proyectos":null} onAction={()=>goTab("explorar")}/>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:11}}>
          {contracts.map(c=>{
            const paid=c.milestones.filter(m=>m.status==="approved").reduce((a,m)=>a+m.amount,0);
            const disputed=c.milestones.some(m=>m.status==="disputed");
            const done=c.status==="completed";
            return(
              <div key={c.id} className="card card-i" onClick={()=>setSel(c)}>
                <div style={{display:"flex",justifyContent:"space-between",gap:10,marginBottom:11,flexWrap:"wrap"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:14.5,marginBottom:2}} className="ellip">{c.eventName}</div>
                    <div style={{fontSize:12,color:"var(--muted)"}} className="ellip">{c.sponsorName} ↔ {c.sponsoredName}</div>
                  </div>
                  <span className="tag fsh0" style={{background:done?"var(--obg)":disputed?"var(--ebg)":"rgba(23,212,160,.1)",color:done?"var(--ok)":disputed?"var(--err)":"var(--teal)"}}>{done?"✅ Completado":disputed?"⚖️ Disputa":"🟢 Activo"}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,marginBottom:6}}><span className="cmu">Escrow liberado</span><span style={{fontWeight:700}}>{money(paid)} / {money(c.amount)}</span></div>
                <Bar v={c.amount?paid/c.amount*100:0}/>
                <div style={{fontSize:12,color:"var(--muted)",marginTop:8}}>{c.milestones.filter(m=>m.status==="approved").length}/{c.milestones.length} hitos verificados</div>
              </div>
            );
          })}
        </div>
      )}

      {modal&&<NewContract user={user} preEvent={targetEvent} close={()=>{setModal(false);clearInit&&clearInit()}} showToast={showToast} onCreated={()=>{refresh();setModal(false);clearInit&&clearInit()}}/>}
    </div>
  );
}

          </div>
          <span className="tag fsh0" style={{background:c.status==="completed"?"var(--obg)":"rgba(23,212,160,.1)",color:c.status==="completed"?"var(--ok)":"var(--teal)"}}>{c.status==="completed"?"✅ Completado":"🟢 Activo"}</span>
        </div>
        <div style={{background:"rgba(255,255,255,.03)",borderRadius:13,padding:15,marginBottom:16}}>

          const bgc=m.status==="approved"?"var(--obg)":m.status==="disputed"?"var(--ebg)":m.status==="submitted"?"var(--wbg)":"rgba(255,255,255,.05)";

              {!isSponsor&&m.status==="pending"&&(

                <div style={{display:"flex",gap:8,marginTop:11}}>

      {evModal&&(

          <div className="iw"><label className="lbl">Evidencia</label><textarea className="inp" value={evText} onChange={e=>setEvText(e.target.value)} placeholder="ej: Fotos de las camisetas con el logo. Link: drive.google.com/…"/></div>
          <button className="btn btn-p" style={{width:"100%"}} onClick={()=>{if(!evText.trim()){showToast("Describe la evidencia","⚠️");return}onEvidence(c.id,evModal.id,evText.trim());setEvModal(null)}}>📎 Enviar evidencia</button>

function NewContract({user,preEvent,close,showToast,onCreated}){
  const events=useMemo(()=>DB.events().filter(e=>e.ownerId!==user.id),[user.id]);
  const [evId,setEvId]=useState(preEvent?.id||events[0]?.id||"");
  const [amount,setAmount]=useState(preEvent?String(preEvent.budgetMin):"");
  const [ms,setMs]=useState([{title:"",amount:""},{title:"",amount:""}]);
  const [ok,setOk]=useState(false);
  const [done,setDone]=useState(false);

  const ev=events.find(e=>e.id===evId);
  const total=ms.reduce((a,m)=>a+(Number(m.amount)||0),0);

  const addMs=()=>setMs(p=>[...p,{title:"",amount:""}]);
  const upMs=(i,k,v)=>setMs(p=>p.map((m,j)=>j===i?{...m,[k]:v}:m));
  const rmMs=i=>setMs(p=>p.filter((_,j)=>j!==i));

  const create=()=>{
    if(!ev){showToast("Selecciona un evento","⚠️");return}
    const valid=ms.filter(m=>m.title.trim()&&Number(m.amount)>0);
    if(valid.length===0){showToast("Añade al menos un hito con importe","⚠️");return}
    if(!ok){showToast("Acepta la cláusula de arbitraje IA","⚖️");return}
    const owner=DB.users().find(u=>u.id===ev.ownerId);
    const c={id:uid("c"),eventId:ev.id,eventName:ev.name,sponsorId:user.id,sponsorName:user.company||user.name,sponsoredId:ev.ownerId,sponsoredName:owner?.name||"Organizador",amount:total,status:"active",created:now(),
      milestones:valid.map((m,i)=>({id:i+1,title:m.title.trim(),amount:Number(m.amount),status:"pending",evidence:"",due:""}))};
    DB.setContracts([...DB.contracts(),c]);
    // create chat if not exists
    const chats=DB.chats();
    if(!chats.some(ch=>ch.participants.includes(user.id)&&ch.participants.includes(ev.ownerId))){
      DB.setChats([...chats,{id:uid("ch"),participants:[user.id,ev.ownerId],names:{[user.id]:user.company||user.name,[ev.ownerId]:owner?.name||"Organizador"},eventName:ev.name,
        messages:[{id:1,from:user.id,text:`¡Hola! Acabo de crear un contrato de patrocinio para ${ev.name} por ${money(total)}. Quedo atento a coordinar los detalles.`,time:hhmm()}]}]);
    }
    setDone(true);
    showToast("Contrato creado","🔒",`${money(total)} retenidos en escrow.`);
    setTimeout(()=>{onCreated()},1400);
  };

  if(done)return(
    <Modal close={close}>
      <div className="tc-c" style={{padding:"18px 0"}}>
        <div style={{fontSize:52,marginBottom:14}}>✅</div>
        <h3 style={{fontSize:19,fontWeight:700,marginBottom:9}}>¡Contrato activado!</h3>
        <p className="cmu" style={{fontSize:14,lineHeight:1.6}}>{money(total)} retenidos en escrow. Se liberarán hito a hito cuando se verifique el cumplimiento.</p>
      </div>
    </Modal>
  );

  return(
    <Modal close={close} title="Nuevo contrato con escrow">
      <div className="iw"><label className="lbl">Evento a patrocinar</label>
        <select className="inp" value={evId} onChange={e=>setEvId(e.target.value)}>
          {events.length===0&&<option value="">No hay eventos disponibles</option>}
          {events.map(e=><option key={e.id} value={e.id}>{e.icon} {e.name}</option>)}
        </select>
      </div>
      {ev&&<div style={{background:"rgba(23,212,160,.05)",border:"1px solid var(--border)",borderRadius:11,padding:12,marginBottom:15,fontSize:12.5,color:"var(--muted)",lineHeight:1.5}}>
        📍 {ev.loc} · Presupuesto sugerido: <strong className="cte">{money(ev.budgetMin)}–{money(ev.budgetMax)}</strong>
      </div>}

      <label className="lbl">Hitos del contrato</label>
      {ms.map((m,i)=>(
        <div key={i} style={{display:"flex",gap:8,marginBottom:9,alignItems:"flex-start"}}>
          <input className="inp" style={{flex:2}} value={m.title} onChange={e=>upMs(i,"title",e.target.value)} placeholder={`Hito ${i+1}: ej. Logo en camisetas`}/>
          <input className="inp" style={{flex:1,minWidth:90}} type="number" value={m.amount} onChange={e=>upMs(i,"amount",e.target.value)} placeholder="€"/>
          {ms.length>1&&<button onClick={()=>rmMs(i)} style={{width:44,minHeight:48,borderRadius:11,background:"var(--ebg)",color:"var(--err)",border:"1px solid rgba(240,96,74,.2)",fontSize:16,cursor:"pointer",flexShrink:0}}>✕</button>}
        </div>
      ))}
      <button className="btn btn-g btn-sm mb16" style={{width:"100%"}} onClick={addMs}>+ Añadir otro hito</button>

      <div style={{display:"flex",justifyContent:"space-between",padding:"13px 15px",background:"rgba(23,212,160,.06)",borderRadius:12,marginBottom:16}}>
        <span style={{fontSize:13.5,fontWeight:600}}>Total del contrato</span>
        <span style={{fontFamily:"'Sora',sans-serif",fontSize:18,fontWeight:800,color:"var(--teal)"}}>{money(total)}</span>
      </div>

      <div onClick={()=>setOk(!ok)} style={{display:"flex",gap:11,alignItems:"flex-start",padding:"13px 14px",background:"var(--pbg)",border:`1px solid ${ok?"rgba(124,58,237,.5)":"rgba(124,58,237,.2)"}`,borderRadius:12,marginBottom:16,cursor:"pointer"}}>
        <div style={{width:21,height:21,borderRadius:6,border:"2px solid var(--pur)",background:ok?"var(--pur)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>{ok&&<span style={{color:"#fff",fontSize:11,fontWeight:800}}>✓</span>}</div>
        <div style={{fontSize:12.5,color:"var(--pur)",lineHeight:1.5}}><strong>Acepto la Cláusula de Arbitraje IA.</strong> Ante una disputa, ambas partes tienen 7 días para presentar evidencia y Gemini decide qué % se libera. Vinculante.</div>
      </div>

      <button className="btn btn-p" style={{width:"100%"}} onClick={create}>🔒 Crear contrato y activar escrow</button>
    </Modal>
  );
}

/* ══ MENSAJES (funcional) ══ */
function ChatView({user,showToast,initPeer,clearInit}){
  const [chats,setChats]=useState(()=>DB.chats().filter(c=>c.participants.includes(user.id)));
  const [selId,setSelId]=useState(null);
  const [txt,setTxt]=useState("");
  const [call,setCall]=useState(false);
  const endRef=useRef(null);

  useEffect(()=>{
    if(initPeer){
      const owner=DB.users().find(u=>u.id===initPeer.ownerId);
      let all=DB.chats();
      let ex=all.find(c=>c.participants.includes(user.id)&&c.participants.includes(initPeer.ownerId));
      if(!ex){
        ex={id:uid("ch"),participants:[user.id,initPeer.ownerId],names:{[user.id]:user.name,[initPeer.ownerId]:owner?.name||initPeer.name},eventName:initPeer.name,messages:[]};
        all=[...all,ex];DB.setChats(all);
      }
      setChats(all.filter(c=>c.participants.includes(user.id)));
      setSelId(ex.id);
      clearInit&&clearInit();
    }
  },[initPeer]);

  const sel=chats.find(c=>c.id===selId);
  useEffect(()=>{if(sel)endRef.current?.scrollIntoView({behavior:"smooth"})},[sel?.messages?.length,selId]);

  const send=()=>{
    if(!txt.trim()||!sel)return;
    if(/@[\w.-]+\.\w+|(\+?\d[\d\s-]{7,}\d)|whatsapp|telegram|instagram\.com/i.test(txt)){
      showToast("Mensaje bloqueado","🚫","No compartas datos de contacto fuera de GetSponzo.");setTxt("");return;
    }
    const all=DB.chats().map(c=>c.id!==sel.id?c:{...c,messages:[...c.messages,{id:Date.now(),from:user.id,text:txt.trim(),time:hhmm()}]});
    DB.setChats(all);setChats(all.filter(c=>c.participants.includes(user.id)));setTxt("");
  };

  const peerId=sel?sel.participants.find(p=>p!==user.id):null;
  const peerName=sel?(sel.names?.[peerId]||"Contacto"):"";
  const peerAv=peerName.split(/\s+/).map(w=>w[0]).join("").toUpperCase().slice(0,2)||"?";

  if(call&&sel)return <VideoCall peer={peerName} peerAv={peerAv} onEnd={()=>setCall(false)} showToast={showToast}/>;

  if(chats.length===0)return(
    <div><div className="sh"><h2>Mensajes</h2><p>Comunicación segura entre partes</p></div>
    <Empty icon="💬" title="Sin conversaciones" text="Cuando contactes con un evento o una marca te escriba, las conversaciones aparecerán aquí."/></div>
  );

  if(!sel)return(
    <div>
      <div className="sh"><h2>Mensajes</h2><p>Comunicación segura · datos de contacto bloqueados</p></div>
      <div style={{display:"flex",flexDirection:"column",gap:9}}>
        {chats.map(c=>{
          const pid=c.participants.find(p=>p!==user.id);
          const pn=c.names?.[pid]||"Contacto";
          const last=c.messages[c.messages.length-1];
          const av=pn.split(/\s+/).map(w=>w[0]).join("").toUpperCase().slice(0,2);
          return(
            <div key={c.id} className="card card-i" style={{padding:14}} onClick={()=>setSelId(c.id)}>
              <div style={{display:"flex",gap:12,alignItems:"center"}}>
                <Av t={av} size={44}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:14.5,marginBottom:2}} className="ellip">{pn}</div>
                  {c.eventName&&<div style={{fontSize:11.5,color:"var(--teal)",marginBottom:3}} className="ellip">📍 {c.eventName}</div>}
                  <div style={{fontSize:12.5,color:"var(--muted)"}} className="ellip">{last?last.text:"Sin mensajes"}</div>
                </div>
                <div style={{fontSize:11,color:"var(--muted2)",flexShrink:0}}>{last?.time||""}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  return(
    <div>
      <Back onClick={()=>setSelId(null)} label="Conversaciones"/>
      <div className="chat-wrap">
        <div className="chat-head">
          <Av t={peerAv} size={38}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,fontSize:14}} className="ellip">{peerName}</div>
            <div style={{fontSize:11,color:"var(--ok)"}}>● Comunicación segura</div>
          </div>
          <button onClick={()=>setCall(true)} style={{width:42,height:42,borderRadius:"50%",background:"rgba(23,212,160,.12)",border:"1px solid var(--border)",fontSize:19,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}} title="Videollamada">📹</button>
        </div>
        <div className="chat-body">
          {sel.messages.length===0&&<div className="tc-c cmu" style={{fontSize:13,padding:"30px 10px"}}>Envía el primer mensaje para empezar 👋</div>}
          {sel.messages.map(m=>(
            <div key={m.id} style={{display:"flex",flexDirection:"column",alignItems:m.from===user.id?"flex-end":"flex-start"}}>
              <div className={"bub "+(m.from===user.id?"bub-me":"bub-them")}>{m.text}</div>
              <div className="bub-time">{m.time}</div>
            </div>
          ))}
          <div ref={endRef}/>
        </div>
        <div className="chat-foot">
          <textarea className="inp" style={{flex:1,minHeight:44,maxHeight:100,resize:"none",padding:"11px 14px"}} rows={1} value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}}} placeholder="Escribe un mensaje…"/>

/* ══ DISPUTAS ══ */
function DisputesView({user,apiKey,showToast,onNeedApi}){
  const [disputes,setDisputes]=useState(()=>{
    const cs=DB.contracts().filter(c=>c.sponsorId===user.id||c.sponsoredId===user.id).map(c=>c.id);
    return DB.disputes().filter(d=>cs.includes(d.contractId));
  });
  const [sel,setSel]=useState(null);
  const [def,setDef]=useState("");
  const [run,setRun]=useState(false);const [prog,setProg]=useState(0);const [st,setSt]=useState("");
  const [verdict,setVerdict]=useState(null);const [err,setErr]=useState("");

  const refresh=()=>{
    const cs=DB.contracts().filter(c=>c.sponsorId===user.id||c.sponsoredId===user.id).map(c=>c.id);
    setDisputes(DB.disputes().filter(d=>cs.includes(d.contractId)));
  };

  const sendDefense=(d)=>{
    if(!def.trim()){showToast("Escribe tu defensa","⚠️");return}
    const all=DB.disputes().map(x=>x.id!==d.id?x:{...x,defense:def.trim(),defenseSent:true});
    DB.setDisputes(all);refresh();setSel(all.find(x=>x.id===d.id));setDef("");
    showToast("Defensa registrada","📎","Gemini la considerará en el veredicto.");
  };

  const runAI=async(d)=>{
    if(!apiKey){onNeedApi();return}
    setRun(true);setVerdict(null);setErr("");setProg(0);
    const steps=[[500,20,"Verificando evidencia del demandante…"],[1100,45,"Analizando defensa del acusado…"],[1800,70,"Evaluando nivel de cumplimiento…"],[2500,88,"Consultando a Gemini…"]];
    steps.forEach(([t,p,s])=>setTimeout(()=>{setProg(p);setSt(s)},t));
    try{
      const r=await callGemini(apiKey,{title:d.title,description:d.description,claimantEvidence:d.claimantEvidence,defense:d.defenseSent?d.defense:""});
      setProg(100);setSt("Veredicto emitido");
      const rel=Math.round(d.amount*r.verdict_pct/100);
      setVerdict({...r,released:rel,retained:d.amount-rel});
    }catch(e){setErr(e.message)}
    setRun(false);
  };

  const execute=(d)=>{
    const all=DB.disputes().map(x=>x.id!==d.id?x:{...x,status:"resolved",verdict:verdict.verdict_pct,resolvedAt:now()});
    DB.setDisputes(all);
    const cs=DB.contracts().map(c=>c.id!==d.contractId?c:{...c,milestones:c.milestones.map(m=>m.id===d.milestoneId?{...m,status:verdict.verdict_pct>=50?"approved":"rejected"}:m)});
    DB.setContracts(cs);
    refresh();setSel(null);setVerdict(null);
    showToast("Veredicto ejecutado","⚡",`${money(verdict.released)} liberados · ${money(verdict.retained)} devueltos.`);
  };

  if(sel){
    const d=disputes.find(x=>x.id===sel.id)||sel;
    return(
      <div>
        <Back onClick={()=>{setSel(null);setVerdict(null);setErr("")}}/>
        <div className="card mb12" style={{borderColor:"rgba(240,96,74,.22)"}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:11,marginBottom:12,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:10.5,fontWeight:700,color:"var(--err)",textTransform:"uppercase",letterSpacing:".6px",marginBottom:4}}>⚖️ Arbitraje {d.status==="resolved"?"· Resuelto":"· En curso"}</div>
              <h3 style={{fontSize:15.5,fontWeight:700,marginBottom:3,lineHeight:1.3}}>{d.title}</h3>
              <div style={{fontSize:12,color:"var(--muted)"}}>Abierta por: {d.openedByName}</div>
            </div>
            {d.status!=="resolved"&&<div style={{textAlign:"center",background:"var(--wbg)",border:"1px solid rgba(245,200,66,.2)",borderRadius:12,padding:"9px 14px",flexShrink:0}}>
              <div style={{fontFamily:"'Sora',sans-serif",fontSize:24,fontWeight:800,color:"var(--warn)",lineHeight:1}}>{d.daysLeft}</div>
              <div style={{fontSize:10,color:"var(--muted)"}}>días</div>
            </div>}
          </div>
          <div style={{background:"rgba(0,0,0,.2)",borderRadius:10,padding:12,fontSize:12.5,color:"var(--muted)",lineHeight:1.6,marginBottom:9}}>{d.description}</div>
          <div style={{fontSize:11.5,color:"var(--warn)",lineHeight:1.5}}>📎 {d.claimantEvidence}</div>
          {d.defenseSent&&<div style={{fontSize:11.5,color:"var(--ok)",marginTop:7,lineHeight:1.5}}>🛡️ Defensa: {d.defense}</div>}
        </div>

        {d.status!=="resolved"&&!d.defenseSent&&d.openedById!==user.id&&(
          <div className="card mb12" style={{borderColor:"var(--border)"}}>
            <div style={{fontWeight:700,fontSize:14.5,marginBottom:5}}>📅 Tu ventana de defensa — {d.daysLeft} días</div>
            <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:12,lineHeight:1.6}}>Presenta tu versión y evidencias. Gemini analizará ambas posiciones al cerrar el plazo.</div>
            <Bar v={(7-d.daysLeft)/7*100} c="var(--warn)"/>
            <textarea className="inp" style={{marginTop:13,marginBottom:10}} value={def} onChange={e=>setDef(e.target.value)} placeholder="Explica tu posición y aporta evidencias…"/>
            <button className="btn btn-g" style={{width:"100%"}} onClick={()=>sendDefense(d)}>📎 Enviar mi defensa</button>
          </div>
        )}
        {d.defenseSent&&d.status!=="resolved"&&<div style={{background:"var(--obg)",border:"1px solid rgba(40,207,122,.2)",borderRadius:11,padding:12,fontSize:12.5,color:"var(--ok)",marginBottom:12}}>✅ Defensa registrada. Lista para el arbitraje.</div>}

        {d.status!=="resolved"&&!verdict&&(
          <div className="card mb12" style={{borderColor:"rgba(124,58,237,.3)",background:"rgba(124,58,237,.04)"}}>
            <div style={{display:"flex",gap:11,alignItems:"center",marginBottom:11}}>
              <span style={{fontSize:22}}>🤖</span>
              <div><div style={{fontWeight:700,fontSize:14.5}}>Árbitro IA — Gemini</div><div style={{fontSize:11.5,color:"var(--muted)"}}>Veredicto en % · vinculante por contrato</div></div>
            </div>
            {run?(
              <div>
                <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:9}}>🔍 {st}</div>
                <div style={{height:9,background:"rgba(255,255,255,.06)",borderRadius:99,overflow:"hidden",marginBottom:6}}>
                  <div style={{width:prog+"%",height:"100%",background:"linear-gradient(90deg,#7c3aed,#a78bfa)",borderRadius:99,transition:"width .5s ease"}}/>
                </div>
                <div style={{fontSize:11.5,color:"var(--pur)"}}>{prog}%</div>
              </div>
            ):(
              <>
                {err&&<div style={{background:"var(--ebg)",border:"1px solid rgba(240,96,74,.2)",borderRadius:10,padding:"10px 12px",fontSize:12.5,color:"var(--err)",marginBottom:11,lineHeight:1.5}}>⚠️ {err}</div>}
                <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:13,lineHeight:1.6}}>Gemini analizará toda la evidencia y emitirá un veredicto con el % exacto a liberar (0, 25, 50, 75 o 100%).</div>
                <button className="btn btn-pur" style={{width:"100%"}} onClick={()=>runAI(d)}>🤖 Ejecutar arbitraje con Gemini</button>
              </>
            )}
          </div>
        )}

        {verdict&&(
          <div style={{background:"rgba(124,58,237,.07)",border:"1.5px solid rgba(124,58,237,.35)",borderRadius:16,padding:20,animation:"slideUp .4s ease"}}>
            <div style={{display:"flex",gap:11,alignItems:"center",marginBottom:15}}>
              <span style={{fontSize:25}}>🤖</span>
              <div><div style={{fontWeight:800,fontSize:17}}>Veredicto de Gemini</div><div style={{fontSize:11.5,color:"var(--pur)"}}>Vinculante por contrato</div></div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:15}}>
              <div style={{background:"var(--obg)",border:"1px solid rgba(40,207,122,.2)",borderRadius:12,padding:13,textAlign:"center"}}>
                <div style={{fontSize:10,color:"var(--muted)",marginBottom:4}}>AL PATROCINADO</div>
                <div style={{fontFamily:"'Sora',sans-serif",fontSize:23,fontWeight:800,color:"var(--ok)",lineHeight:1.1}}>{money(verdict.released)}</div>
                <div style={{fontSize:12.5,color:"var(--ok)",fontWeight:600}}>{verdict.verdict_pct}%</div>
              </div>
              <div style={{background:"var(--ebg)",border:"1px solid rgba(240,96,74,.2)",borderRadius:12,padding:13,textAlign:"center"}}>
                <div style={{fontSize:10,color:"var(--muted)",marginBottom:4}}>A LA MARCA</div>
                <div style={{fontFamily:"'Sora',sans-serif",fontSize:23,fontWeight:800,color:"var(--err)",lineHeight:1.1}}>{money(verdict.retained)}</div>
                <div style={{fontSize:12.5,color:"var(--err)",fontWeight:600}}>{100-verdict.verdict_pct}%</div>
              </div>
            </div>
            <div className="mb16">
              {(verdict.reasoning||[]).map((r,i)=>(
                <div key={i} style={{fontSize:12.5,color:"var(--muted)",lineHeight:1.6,marginBottom:6,paddingLeft:11,borderLeft:"2px solid rgba(124,58,237,.3)"}}>{r}</div>
              ))}
            </div>
            <button className="btn btn-pur" style={{width:"100%"}} onClick={()=>execute(d)}>✅ Ejecutar veredicto</button>
          </div>
        )}
      </div>
    );
  }

  return(
    <div>
      <div className="sh"><h2>Centro de disputas</h2><p>Arbitraje por Gemini IA · vinculante por contrato</p></div>
      <div style={{background:"var(--pbg)",border:"1px solid rgba(124,58,237,.18)",borderRadius:14,padding:15,marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:12.5,marginBottom:11}}>⚖️ Cómo funciona</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6}}>
          {[["📅","7 días"],["🔒","Congela"],["🤖","IA"],["📊","% justo"],["✅","Ejecuta"]].map(([i,t],k)=>(
            <div key={k} className="tc-c"><div style={{fontSize:18,marginBottom:3}}>{i}</div><div style={{fontSize:10,color:"var(--muted)",fontWeight:600}}>{t}</div></div>
          ))}
        </div>
      </div>
      {disputes.length===0?(
        <Empty icon="🕊️" title="Sin disputas activas" text="Cuando haya un desacuerdo sobre un hito, aparecerá aquí para que la IA lo resuelva de forma imparcial."/>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {disputes.map(d=>(
            <div key={d.id} className="card card-i" style={{borderLeft:`3px solid ${d.status==="resolved"?"var(--ok)":"var(--err)"}`}} onClick={()=>setSel(d)}>
              <div style={{display:"flex",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:14,marginBottom:3,lineHeight:1.3}}>{d.title}</div>
                  <div style={{fontSize:11.5,color:"var(--muted)",marginBottom:4}}>Por: {d.openedByName}</div>
                  {d.status!=="resolved"?<div style={{fontSize:11.5,color:"var(--warn)"}}>📅 {d.daysLeft} días · toca para gestionar</div>
                    :<div style={{fontSize:11.5,color:"var(--ok)"}}>✅ Resuelta — {d.verdict}% liberado</div>}

                <div style={{display:"flex",flexDirection:"column",gap:5,alignItems:"flex-end",flexShrink:0}}>

          ))}
        </div>
      )}
    </div>
  );
}

            {[["€1.967M","España 2024"],["€445M","Chile"],["54.5%","TIR base"],["Año 3","Break-even"]].map(([v,l],i)=>(

          </div>
          <div className="card">
            <div style={{fontSize:13,fontWeight:700,color:"var(--teal)",marginBottom:13}}>📊 Plan de 3 rondas</div>
            {[["🌱","Pre-seed","€80.000","Prototipo + validación Chile · Año 0-1"],["🚀","Seed","€200.000","Escalar Chile + lanzar España · Año 2-3"],["💎","Series A","€347.000","Expansión LATAM + equipo · Año 3-4"]].map(([i,t,a,d])=>(
              <div key={t} style={{display:"flex",gap:12,alignItems:"center",padding:"12px 13px",background:"rgba(255,255,255,.03)",borderRadius:12,marginBottom:9}}>

                <div style={{minWidth:0}}><div style={{fontWeight:700,fontSize:14}}>{t} · <span className="cte">{a}</span></div><div style={{fontSize:11.5,color:"var(--muted)",marginTop:2}}>{d}</div></div>
              </div>

        {tab==="financiero"&&(<div>
          <div className="sh"><h2>Modelo financiero</h2><p>Proyección a 5 años · escenario base</p></div>
          <div className="g2 mb16">
            {[["TIR Equity","54.5%","Retorno anual"],["VAN","€684K","Valor presente"],["WACC","26.57%","Tasa descuento"],["Break-even","Año 3","EBITDA+"],["Inversión","€627K","3 rondas"],["Ingresos Año 5","€2.025M","Base combinado"]].map(([l,v,s],i)=>(
              <div key={i} className="card" style={{padding:15}}>
                <div style={{fontSize:10.5,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".4px",marginBottom:5}}>{l}</div>
                <div style={{fontFamily:"'Sora',sans-serif",fontSize:21,fontWeight:800,color:"var(--teal)",marginBottom:3}}>{v}</div>

            ))}
          </div>
          <div className="card">
            <div style={{fontSize:13,fontWeight:700,marginBottom:13}}>Ingresos Año 5 por escenario</div>
            {[["🟡 Conservador","€692K","25%","rgba(245,200,66,.09)","var(--warn)"],["🟢 Base","€2.025M","50%","rgba(40,207,122,.09)","var(--ok)"],["🔵 Optimista","€9.471M","25%","rgba(59,130,246,.08)","#60a5fa"]].map(([s,v,p,bg,c])=>(
              <div key={s} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 13px",background:bg,borderRadius:11,marginBottom:8,gap:10}}>
                <div style={{minWidth:0}}><div style={{fontWeight:600,fontSize:13.5}}>{s}</div><div style={{fontSize:11.5,color:"var(--muted)"}}>{p} probabilidad</div></div>
                <div style={{fontFamily:"'Sora',sans-serif",fontSize:16,fontWeight:800,color:c,flexShrink:0}}>{v}</div>
              </div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",padding:"12px 13px",background:"rgba(23,212,160,.07)",borderRadius:11,alignItems:"center"}}>
              <span style={{fontWeight:700,fontSize:13.5}}>Esperado ponderado</span>
              <span style={{fontFamily:"'Sora',sans-serif",fontSize:16,fontWeight:800,color:"var(--teal)"}}>€3.55M</span>
            </div>
          </div>
        </div>)}

        {tab==="mercado"&&(<div>
          <div className="sh"><h2>El mercado</h2><p>Ventana de oportunidad ahora</p></div>
          <div className="g2 mb16">
            {[{f:"🇨🇱",n:"Chile — Lanzamiento",c:"var(--teal)",a:"~€445M",p:["Mercado virgen sin competidores","Red de contactos directos","Validación en 3 meses","PYMEs sin acceso a agencias"]},
              {f:"🇪🇸",n:"España — Fase 2",c:"var(--pur)",a:"€1.967M",p:["+19% interanual en 2024","El más rápido de Europa","Llegamos con casos de éxito","Sponsoo sin escrow ni IA"]}].map((m,i)=>(
              <div key={i} className="card" style={{borderColor:m.c+"33"}}>
                <div style={{display:"flex",gap:11,alignItems:"center",marginBottom:13}}>
                  <span style={{fontSize:28}}>{m.f}</span>
                  <div><div style={{fontWeight:700,fontSize:15}}>{m.n}</div><div style={{fontFamily:"'Sora',sans-serif",fontWeight:800,fontSize:20,color:m.c}}>{m.a}</div></div>
                </div>
                {m.p.map((p,j)=><div key={j} style={{fontSize:12.5,color:"var(--muted)",marginBottom:6,display:"flex",gap:7}}><span style={{color:m.c,flexShrink:0}}>✓</span>{p}</div>)}
              </div>
            ))}
          </div>
          <div className="card">
            <div style={{fontWeight:700,fontSize:14,marginBottom:13}}>🏆 Ventajas competitivas</div>
            {[["🔒","Escrow por hitos","El único marketplace con pago retenido hasta verificar el cumplimiento."],["🤖","Árbitro IA","Disputas resueltas en 7 días, vinculante, sin sesgos."],["⭐","Reputación","Trust score acumulativo imposible de falsear."],["🇨🇱","Chile primero","Mercado virgen = validación rápida y barata."]].map(([i,t,d],k)=>(
              <div key={k} style={{display:"flex",gap:12,marginBottom:13,alignItems:"flex-start"}}>

                <div><div style={{fontWeight:700,fontSize:14,marginBottom:2}}>{t}</div><div style={{fontSize:12.5,color:"var(--muted)",lineHeight:1.5}}>{d}</div></div>

        </div>)}

        {tab==="contacto"&&(<div>
          <div className="sh"><h2>Contactar al equipo</h2><p>Cristóbal responde personalmente</p></div>
          {sent?(
            <div className="empty"><div className="empty-i">🚀</div><h3>¡Solicitud enviada!</h3><p>Cristóbal te contactará en menos de 24 horas.</p></div>
          ):(
            <div className="card">
              <div style={{display:"flex",gap:13,alignItems:"center",marginBottom:18,padding:"13px 14px",background:"rgba(23,212,160,.05)",borderRadius:12}}>
                <Av t="CT" size={46}/>
                <div style={{minWidth:0}}><div style={{fontWeight:700,fontSize:15}}>Cristóbal Torretti</div><div style={{fontSize:12,color:"var(--teal)"}} className="ellip">Founder & CFO</div></div>

              <div className="iw"><label className="lbl">Monto potencial de inversión</label>
                <select className="inp" value={cf.amount} onChange={e=>setCf(p=>({...p,amount:e.target.value}))} style={{color:cf.amount?"var(--white)":"rgba(107,143,168,.5)"}}>

/* ══ MAIN DASHBOARD ══ */
function Dashboard({user,setUser,apiKey,showToast,onLogout,onChangeApi,onNeedApi}){
  const [tab,setTab]=useState("inicio");
  const [contractEvent,setContractEvent]=useState(null);
  const [chatPeer,setChatPeer]=useState(null);
  const isPat=user.role==="patrocinado";

  const tabs=isPat
    ?[["inicio","Inicio","🏠"],["eventos","Eventos","🎪"],["contratos","Contratos","📝"],["mensajes","Chat","💬"],["disputas","Disputas","⚖️"],["perfil","Perfil","⭐"]]
    :[["inicio","Inicio","🏠"],["explorar","Explorar","🔍"],["contratos","Contratos","📝"],["mensajes","Chat","💬"],["disputas","Disputas","⚖️"],["perfil","Perfil","⭐"]];

  const goTab=(t)=>{setTab(t);window.scrollTo(0,0)};

  const startContract=(ev)=>{setContractEvent(ev);goTab("contratos")};
  const startChat=(ev)=>{setChatPeer(ev);goTab("mensajes")};

  return(
    <div>
      <div className="container">
        <div className="play">
          <nav className="sbar">
            {tabs.map(([id,l,i])=><button key={id} className={tab===id?"on":""} onClick={()=>goTab(id)}><i>{i}</i>{l}</button>)}
          </nav>
          <div className="main">
            {tab==="inicio"&&<HomeView user={user} goTab={goTab}/>}
            {tab==="eventos"&&<EventsView user={user} showToast={showToast}/>}
            {tab==="explorar"&&<ExploreView user={user} showToast={showToast} onContract={startContract} onChat={startChat}/>}
            {tab==="contratos"&&<ContractsView user={user} showToast={showToast} initEvent={contractEvent} clearInit={()=>setContractEvent(null)} goTab={goTab}/>}
            {tab==="mensajes"&&<ChatView user={user} showToast={showToast} initPeer={chatPeer} clearInit={()=>setChatPeer(null)}/>}
            {tab==="disputas"&&<DisputesView user={user} apiKey={apiKey} showToast={showToast} onNeedApi={onNeedApi}/>}
            {tab==="perfil"&&<ProfileView user={user} setUser={setUser} showToast={showToast} onLogout={onLogout} apiKey={apiKey} onChangeApi={onChangeApi}/>}
          </div>
        </div>
      </div>
      <div className="bnav">{tabs.map(([id,l,i])=><button key={id} className={"bni"+(tab===id?" on":"")} onClick={()=>goTab(id)}><i>{i}</i>{l}</button>)}</div>
    </div>
  );
}

/* ══ APP ROOT ══ */
function App(){
  const [screen,setScreen]=useState("landing");
  const [user,setUser]=useState(()=>DB.sess());
  const [apiKey,setApiKey]=useState(()=>DB.api());
  const [toast,setToast]=useState(null);
  const [updating,setUpdating]=useState(false);

  const showToast=(m,i="✓",s="")=>{setToast({msg:m,icon:i,sub:s});setTimeout(()=>setToast(null),3200)};

  useEffect(()=>{seedIfEmpty();if(DB.sess())setScreen("app")},[]);

  const login=(u)=>{setUser(u);setScreen("app")};
  const logout=()=>{DB.clearSess();setUser(null);setScreen("landing")};
  const saveApi=(k)=>{DB.setApi(k);setApiKey(k);setScreen("app");showToast("Árbitro IA activado","🤖")};
  const doUpdate=()=>{setUpdating(true);showToast("Buscando actualización…","🔄");setTimeout(()=>window.location.reload(true),700)};

  return(
    <div style={{minHeight:"100vh",background:"var(--bg)"}}>
      {screen==="landing"&&<Landing onEnter={()=>setScreen("auth")}/>}
      {screen==="auth"&&<Auth onLogin={login} showToast={showToast} goBack={()=>setScreen("landing")}/>}
      {screen==="api"&&<ApiSetup onSave={saveApi} onSkip={()=>setScreen("app")}/>}
      {screen==="app"&&user&&(
        <>
          <nav className="tnav"><div className="container"><div className="tni">
            <div style={{display:"flex",alignItems:"center",gap:9,minWidth:0}}><Logo size={26} glow={false}/><Word s={17}/></div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
              <button onClick={doUpdate} title="Actualizar app" style={{width:38,height:38,borderRadius:10,background:"rgba(23,212,160,.08)",border:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,cursor:"pointer",animation:updating?"spin .7s linear infinite":"none"}}>🔄</button>
              <Av t={user.av} size={34}/>
            </div>
          </div></div></nav>
          {user.role==="inversor"
            ?<InvestorDash user={user} showToast={showToast}/>
            :<Dashboard user={user} setUser={setUser} apiKey={apiKey} showToast={showToast} onLogout={logout} onChangeApi={()=>setScreen("api")} onNeedApi={()=>{showToast("Configura tu API Key de Gemini","🔑");setScreen("api")}}/>}
        </>
      )}
      {toast&&<Toast {...toast}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
