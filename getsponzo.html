<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0"/>
<title>GetSponzo — Patrocinio protegido</title>
<meta name="description" content="Conecta marcas con eventos. Pago protegido por escrow. Árbitro IA en 7 días."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07101e;--bg2:#0b1828;--card:#0e2030;--card2:#112438;
  --teal:#17d4a0;--td:#0cb888;--tl:#3de8b5;
  --white:#f0f8fc;--muted:#8fa9bd;--muted2:#5f7d94;
  --border:rgba(23,212,160,.14);--bs:rgba(255,255,255,.06);
  --warn:#f5c842;--wbg:rgba(245,200,66,.09);
  --err:#f0604a;--ebg:rgba(240,96,74,.09);
  --ok:#28cf7a;--obg:rgba(40,207,122,.09);
  --pur:#a78bfa;--pbg:rgba(124,58,237,.1);
  --nav-h:56px;--bnav-h:64px;
}
html{scroll-behavior:smooth;font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--white);line-height:1.5;overflow-x:hidden;min-height:100vh;overscroll-behavior-y:none}
h1,h2,h3,h4{font-family:'Sora',sans-serif;letter-spacing:-.02em;line-height:1.2}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;background:none;-webkit-appearance:none}
input,textarea,select{font-family:'Inter',sans-serif;-webkit-appearance:none;appearance:none;font-size:16px}
input::placeholder,textarea::placeholder{color:rgba(107,143,168,.5)}
select option{background:#0e2030;color:#fff}
img{max-width:100%;height:auto;display:block}
a{color:var(--teal);text-decoration:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(23,212,160,.2);border-radius:99px}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.7)}}
@keyframes fill{from{width:0}to{width:var(--w)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(23,212,160,.3))}50%{filter:drop-shadow(0 0 12px rgba(23,212,160,.7))}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes gridMove{from{background-position:0 0}to{background-position:60px 60px}}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(23,212,160,.5)}50%{box-shadow:0 0 0 12px rgba(23,212,160,0)}}

.fu{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both}
.fu1{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) .06s both}
.fu2{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) .12s both}
.fu3{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) .18s both}

.container{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
@media(min-width:640px){.container{padding:0 24px}}

.card{background:var(--card);border:1px solid var(--bs);border-radius:16px;padding:18px}
@media(min-width:640px){.card{border-radius:18px;padding:22px}}
.card-i{cursor:pointer;transition:transform .22s,border-color .22s,box-shadow .22s}
.card-i:active{transform:scale(.985)}
@media(hover:hover){.card-i:hover{transform:translateY(-3px);border-color:var(--border);box-shadow:0 10px 30px rgba(0,0,0,.3)}}

.btn{font-weight:700;border-radius:12px;padding:13px 20px;font-size:15px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;font-family:'Inter',sans-serif;min-height:48px;width:100%;line-height:1.2}
.btn:active{transform:scale(.98)}
.btn-p{background:linear-gradient(135deg,var(--teal),var(--td));color:#07101e;box-shadow:0 4px 16px rgba(23,212,160,.2)}
.btn-g{background:rgba(255,255,255,.05);color:var(--white);border:1px solid var(--bs);font-weight:600}
.btn-d{background:var(--ebg);color:var(--err);border:1px solid rgba(240,96,74,.25)}
.btn-pur{background:rgba(124,58,237,.8);color:#fff;border:1px solid rgba(124,58,237,.4)}
.btn-sm{padding:9px 15px;font-size:13px;min-height:40px;border-radius:10px;width:auto}
.btn-auto{width:auto}
@media(min-width:640px){.btn{width:auto}}

.inp{width:100%;padding:13px 15px;border:1.5px solid var(--bs);border-radius:11px;background:rgba(255,255,255,.03);color:var(--white);font-size:16px;outline:none;transition:border .2s;min-height:48px}
.inp:focus{border-color:var(--teal)}
textarea.inp{min-height:80px;resize:vertical;line-height:1.5}
.iw{margin-bottom:15px}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:7px}

.tag{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:4px 9px;font-size:11px;font-weight:700;white-space:nowrap;line-height:1.3}

.bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(7,16,30,.97);backdrop-filter:blur(20px);border-top:1px solid var(--bs);padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:300;overflow-x:auto}
.bnav::-webkit-scrollbar{display:none}
.bni{flex:1 0 auto;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:9.5px;font-weight:600;cursor:pointer;color:var(--muted);background:none;border:none;font-family:'Inter',sans-serif;transition:color .2s;line-height:1.2}
.bni.on{color:var(--teal)}
.bni i{font-size:19px;font-style:normal;line-height:1}

.sbar{display:none}
@media(min-width:820px){
  .bnav{display:none}
  .sbar{display:flex;flex-direction:column;gap:2px;width:210px;position:sticky;top:calc(var(--nav-h) + 16px);height:fit-content;flex-shrink:0}
  .sbar button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted);background:transparent;border:1px solid transparent;transition:all .2s;text-align:left;font-family:'Inter',sans-serif}
  .sbar button.on{background:rgba(23,212,160,.1);color:var(--teal);border-color:var(--border)}
  .sbar button:hover:not(.on){background:rgba(255,255,255,.04)}
  .sbar i{font-size:17px;font-style:normal}
}

.play{display:flex;gap:22px;align-items:flex-start;padding-top:16px;padding-bottom:calc(var(--bnav-h) + 24px)}
@media(min-width:820px){.play{padding-bottom:32px}}
.main{flex:1;min-width:0;width:100%}

.g2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.g2{grid-template-columns:1fr 1fr}}
.g3{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:520px){.g3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:860px){.g3{grid-template-columns:repeat(3,1fr)}}
.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:680px){.g4{grid-template-columns:repeat(4,1fr)}}

.toast{position:fixed;bottom:calc(var(--bnav-h) + 14px);left:50%;transform:translateX(-50%);z-index:9999;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:13px 17px;display:flex;align-items:center;gap:11px;box-shadow:0 16px 50px rgba(0,0,0,.55);max-width:340px;width:calc(100% - 28px);animation:slideUp .3s ease}
@media(min-width:820px){.toast{bottom:24px}}

.bt{height:8px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.bf{height:100%;border-radius:99px;animation:fill .9s ease both}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .2s}
@media(min-width:640px){.ov{align-items:center;padding:16px}}

.tc{border:2px solid var(--bs);border-radius:15px;padding:16px;cursor:pointer;transition:all .22s;background:var(--card)}
.tc.on{border-color:var(--teal);background:rgba(23,212,160,.06)}

.sh{margin-bottom:18px}
.sh h2{font-size:21px;font-weight:700;margin-bottom:4px}
@media(min-width:640px){.sh h2{font-size:25px}}
.sh p{font-size:14px;color:var(--muted)}

.tnav{position:sticky;top:0;z-index:200;background:rgba(7,16,30,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--bs)}
.tni{display:flex;align-items:center;justify-content:space-between;height:var(--nav-h);gap:10px}

.st{background:rgba(255,255,255,.03);border-radius:13px;padding:13px 10px;text-align:center}
.stv{font-family:'Sora',sans-serif;font-size:21px;font-weight:800;color:var(--teal);margin-bottom:3px;line-height:1.1}
.stl{font-size:11px;color:var(--muted);line-height:1.3}

.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite;display:inline-block;flex-shrink:0}

.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-ms-overflow-style:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:'Inter',sans-serif;background:rgba(255,255,255,.06);color:var(--muted);white-space:nowrap;flex-shrink:0;transition:all .2s}
.chip.on{background:var(--teal);color:#07101e}

.empty{text-align:center;padding:44px 20px}
.empty-i{font-size:48px;margin-bottom:14px;opacity:.6}
.empty h3{font-size:17px;font-weight:700;margin-bottom:7px}
.empty p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.6;max-width:320px;margin-left:auto;margin-right:auto}

.row{display:flex;gap:12px;align-items:center}
.rowb{display:flex;gap:10px;flex-wrap:wrap}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - var(--nav-h) - var(--bnav-h) - 100px);min-height:400px;background:var(--card);border:1px solid var(--bs);border-radius:16px;overflow:hidden}
@media(min-width:820px){.chat-wrap{height:560px}}
.chat-head{padding:12px 15px;border-bottom:1px solid var(--bs);display:flex;align-items:center;gap:11px;flex-shrink:0}
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.chat-foot{padding:11px;border-top:1px solid var(--bs);display:flex;gap:9px;flex-shrink:0;align-items:flex-end}
.bub{padding:10px 14px;border-radius:15px;font-size:14.5px;line-height:1.45;max-width:82%;word-break:break-word}
.bub-me{align-self:flex-end;background:linear-gradient(135deg,var(--teal),var(--td));color:#07101e;font-weight:500;border-bottom-right-radius:5px}
.bub-them{align-self:flex-start;background:rgba(255,255,255,.06);color:var(--white);border-bottom-left-radius:5px}
.bub-time{font-size:10px;color:var(--muted2);margin-top:3px}

/* Video call */
.vcall{position:fixed;inset:0;background:#050b14;z-index:900;display:flex;flex-direction:column;animation:fadeIn .3s}
.vc-main{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vc-remote{width:100%;height:100%;background:linear-gradient(135deg,#0e2030,#112438);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.vc-self{position:absolute;bottom:16px;right:16px;width:100px;height:140px;background:linear-gradient(135deg,#112438,#1a3450);border-radius:14px;border:2px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;overflow:hidden}
@media(min-width:640px){.vc-self{width:140px;height:190px}}
.vc-bar{padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;gap:14px;justify-content:center;align-items:center;background:rgba(7,16,30,.9);flex-shrink:0}
.vc-btn{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:none;cursor:pointer;transition:all .2s}
.vc-btn:active{transform:scale(.92)}

/* Steps */
.steps{display:flex;gap:5px;margin-bottom:24px}
.step{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.1);transition:background .3s}
.step.on{background:var(--teal)}

/* Milestone row */
.ms{display:flex;align-items:center;gap:11px;padding:12px 13px;background:rgba(255,255,255,.02);border-radius:12px;margin-bottom:8px}
.ms-ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

/* Utility */
.mb0{margin-bottom:0}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.fx1{flex:1}.fsh0{flex-shrink:0}.tc-c{text-align:center}
.txs{font-size:12px}.tsm{font-size:13px}.tmd{font-size:14px}
.cmu{color:var(--muted)}.cte{color:var(--teal)}.cwh{color:var(--white)}
.fw6{font-weight:600}.fw7{font-weight:700}
.mod{background:var(--bg2);border:1px solid var(--border);border-radius:22px 22px 0 0;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .3s ease}
@media(min-width:640px){.mod{border-radius:20px;max-width:540px;max-height:88vh}}
.mod-h{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--bs);flex-shrink:0}
.mod-h h3{flex:1;font-size:17px;font-weight:700;min-width:0}
.mod-x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--white);flex-shrink:0}
.mod-b{padding:18px;overflow-y:auto;flex:1}
.mod-f{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--bs);display:flex;gap:10px;flex-shrink:0;background:var(--bg2)}
.mod-f .btn{flex:1}
.grab{width:40px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:8px auto 0}
@media(min-width:640px){.grab{display:none}}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.3}
.task{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--bs);cursor:pointer;width:100%;text-align:left;color:var(--white);margin-bottom:9px;transition:border-color .2s}
@media(hover:hover){.task:hover{border-color:var(--border)}}
.task:active{transform:scale(.99)}
.ti{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.seg{display:flex;background:rgba(255,255,255,.04);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--white);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.stepper{display:flex;align-items:flex-start;margin:4px 0 16px}
.stp{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center;font-size:10.5px;color:var(--muted);font-weight:600;line-height:1.25;padding:0 2px}
.stp::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:rgba(255,255,255,.1)}
.stp:first-child::before{display:none}
.stp.done::before,.stp.cur::before{background:var(--teal)}
.stp b{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card2);border:2px solid rgba(255,255,255,.14);font-size:12px;z-index:1;position:relative;color:var(--muted)}
.stp.done b{background:var(--teal);border-color:var(--teal);color:#07101e}
.stp.cur b{border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 4px rgba(23,212,160,.12)}
.stp.cur{color:var(--white)}
.nb{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:99px;background:var(--err);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;font-style:normal}
.bni{position:relative}
.sbar button{position:relative}
.sbar .nb{position:static;margin-left:auto}
.ibtn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(255,255,255,.05);border:1px solid var(--bs);color:var(--white);flex-shrink:0}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:680px){.qa{grid-template-columns:repeat(4,1fr)}}
.qa button{background:var(--card);border:1px solid var(--bs);border-radius:14px;padding:16px 10px;color:var(--white);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13.5px;font-weight:600;text-align:center;transition:border-color .2s}
@media(hover:hover){.qa button:hover{border-color:var(--border)}}
.qa i{font-style:normal;font-size:26px}
.sec-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.icg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.icg button{padding:11px 4px;border-radius:12px;background:rgba(255,255,255,.04);border:2px solid transparent;color:var(--white);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.icg button.on{border-color:var(--teal);background:rgba(23,212,160,.08)}
.icg i{font-style:normal;font-size:22px}
.hint{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(23,212,160,.06);border:1px solid var(--border);font-size:13px;color:var(--white);line-height:1.5}
.hint.w{background:var(--wbg);border-color:rgba(245,200,66,.25)}
.hint.e{background:var(--ebg);border-color:rgba(240,96,74,.25)}
.hint.p{background:var(--pbg);border-color:rgba(167,139,250,.25)}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--bs);cursor:pointer;width:100%;text-align:left;color:var(--white);background:none}
.lrow:last-child{border-bottom:none}
.pbtn{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;color:var(--white);border-bottom:1px solid var(--bs);font-size:14.5px;font-weight:600}
.pbtn:last-child{border-bottom:none}
.pbtn i{font-style:normal;font-size:19px;width:26px;text-align:center}
.pbtn span.ar{margin-left:auto;color:var(--muted)}
.mcard{border:1px solid var(--bs);border-radius:14px;padding:14px;margin-bottom:10px;background:rgba(255,255,255,.02)}
.mcard.act{border-color:var(--border);background:rgba(23,212,160,.04)}
.qr{display:flex;gap:7px;overflow-x:auto;padding:8px 11px 0;scrollbar-width:none}
.qr::-webkit-scrollbar{display:none}
.qr button{padding:7px 12px;border-radius:99px;font-size:12.5px;background:rgba(23,212,160,.08);border:1px solid var(--border);color:var(--teal);white-space:nowrap;font-weight:600}
.sysmsg{align-self:center;font-size:12px;color:var(--muted);background:rgba(255,255,255,.04);padding:6px 12px;border-radius:99px;text-align:center;max-width:90%}
.chat-wrap{height:calc(100dvh - var(--nav-h) - var(--bnav-h) - 40px)}
@media(min-width:820px){.chat-wrap{height:calc(100vh - var(--nav-h) - 60px);max-height:680px}}
.greet{font-size:clamp(22px,5vw,28px);font-weight:800;margin-bottom:4px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.money-big{font-family:'Sora',sans-serif;font-weight:800;font-size:26px;color:var(--teal)}
</style>
</head>

const MODELS=["gemini-2.5-flash","gemini-2.0-flash","gemini-flash-latest"];
async function gemini(key,prompt,json){
  let last=null;
  for(const m of MODELS){
    let r,j;
    try{
      r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:Object.assign({temperature:.3,maxOutputTokens:2048},json?{responseMimeType:"application/json"}:{})})
      });
      j=await r.json().catch(()=>({}));
    }catch(e){last=new Error("Sin conexión a internet");continue}
    if(!r.ok){
      const msg=j.error?.message||("Error "+r.status);
      if(r.status===400&&/API key/i.test(msg))throw new Error("La clave de Gemini no es válida. Revísala en Perfil.");
      if(r.status===403)throw new Error("La clave de Gemini no tiene permiso. Crea una nueva en aistudio.google.com");
      last=new Error(msg);continue;
    }
    const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
    if(t)return {text:t,model:m};
    last=new Error("La IA no respondió");
  }
  throw last||new Error("No se pudo conectar con Gemini");
}
const snap=n=>[0,25,50,75,100].reduce((a,b)=>Math.abs(b-Number(n))<Math.abs(a-Number(n))?b:a,50);
async function aiVerdict(key,d){
  const prompt=`Eres el árbitro imparcial de GetSponzo, una plataforma de patrocinio donde el pago de la marca queda protegido hasta que se verifica cada entrega.
Debes decidir qué porcentaje del pago de esta entrega se libera AL PATROCINADO (evento/creador). El resto se devuelve a la MARCA.
ENTREGA EN DISPUTA: ${d.title} (monto €${d.amount})
QUIÉN RECLAMA: ${d.openedByName} (${d.openerRole})
MOTIVO: ${d.reason}
RECLAMO: ${d.description}
PRUEBAS DEL RECLAMO: ${d.claimantEvidence||"Sin pruebas adicionales"}
EVIDENCIA ENTREGADA ANTES DE LA DISPUTA: ${d.priorEvidence||"Ninguna"}
DEFENSA DE ${d.againstName}: ${d.defense||"No presentó defensa dentro del plazo de 7 días."}
Solo puedes elegir 0, 25, 50, 75 o 100.
Responde SOLO con este JSON, en español muy simple: {"verdict_pct":NUMERO,"reasoning":["punto 1","punto 2","punto 3","decisión final"]}`;
  const {text,model}=await gemini(key,prompt,true);
  const mm=text.match(/\{[\s\S]*\}/);
  if(!mm)throw new Error("La IA respondió en un formato raro. Intenta de nuevo.");
  const o=JSON.parse(mm[0]);
  return {pct:snap(o.verdict_pct),reasoning:Array.isArray(o.reasoning)?o.reasoning:[String(o.reasoning||"")],model,demo:false};
}
function demoVerdict(d){
  const brandOpened=d.openerRole==="patrocinador";
  const pct=brandOpened?(d.defense?50:25):(d.defense?50:75);
  return {pct,demo:true,model:"demo",reasoning:[
    `${d.openedByName} reclamó: "${d.reason}".`,
    d.defense?`${d.againstName} presentó su defensa, por lo que ambas partes tienen parte de razón.`:`${d.againstName} no presentó defensa dentro de los 7 días.`,
    d.priorEvidence?"Existe evidencia parcial de la entrega.":"No hay evidencia suficiente de que la entrega se haya completado.",
    `Decisión: se libera el ${pct}% al patrocinado y el ${100-pct}% vuelve a la marca.`]};
}

function writeCol(col,arr){
  if(!REAL){save("gs_"+col,arr);return}
  const prev=CACHE[col];CACHE[col]=arr;
  const pm=new Map(prev.map(x=>[x.id,JSON.stringify(x)]));const ids=new Set();
  arr.forEach(x=>{ids.add(x.id);const s=JSON.stringify(x);if(pm.get(x.id)!==s)FS.collection(col).doc(x.id).set(JSON.parse(s)).catch(e=>console.error(e))});
  prev.forEach(x=>{if(!ids.has(x.id))FS.collection(col).doc(x.id).delete().catch(e=>console.error(e))});
}
const readCol=col=>REAL?CACHE[col]:load("gs_"+col,[]);
let unsubs=[];
function stopSync(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];COLS.forEach(c=>CACHE[c]=[])}
function startSync(me){
  stopSync();
  const Q={users:FS.collection("users"),events:FS.collection("events"),
    contracts:FS.collection("contracts").where("parties","array-contains",me),
    chats:FS.collection("chats").where("participants","array-contains",me),
    disputes:FS.collection("disputes").where("parties","array-contains",me)};
  return new Promise(res=>{
    const pending=new Set(COLS);const done=c=>{if(pending.has(c)){pending.delete(c);if(!pending.size)res()}};
    COLS.forEach(col=>unsubs.push(Q[col].onSnapshot(snap=>{CACHE[col]=snap.docs.map(d=>d.data());done(col);onData()},err=>{console.error(err);done(col)})));
    setTimeout(res,12000);
  });
}
function fbErr(e){
  const c=(e&&e.code)||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return "El correo o la contraseña no son correctos.";
  if(/email-already-in-use/.test(c))return "Ya existe una cuenta con ese correo. Prueba entrando.";
  if(/weak-password/.test(c))return "La contraseña debe tener al menos 6 caracteres.";
  if(/invalid-email/.test(c))return "Ese correo no parece válido.";
  if(/network/.test(c))return "Sin conexión a internet. Revisa tu señal.";
  if(/too-many/.test(c))return "Demasiados intentos. Espera unos minutos.";
  if(/operation-not-allowed/.test(c))return "El inicio con correo no está activado en Firebase (Authentication → Correo/contraseña).";
  return "Ocurrió un error: "+((e&&e.message)||c);
}

/* ══════════ ENTRAR / CREAR CUENTA ══════════ */
function Auth({mode,setMode,onLogin,onBack,onDemo}){
  const [f,setF]=useState({email:"",pass:"",name:"",company:""});
  const [role,setRole]=useState(null);
  const [step,setStep]=useState(0);
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const set=(k,v)=>{setF(p=>({...p,[k]:v}));setErr("")};
  const login=async()=>{
    if(REAL){
      if(!f.email.trim()||!f.pass)return setErr("Escribe tu correo y tu contraseña.");
      setBusy(true);try{await AUTH.signInWithEmailAndPassword(f.email.trim(),f.pass)}catch(e){setErr(fbErr(e));setBusy(false)}
      return;
    }
    const u=DB.users().find(x=>x.email.toLowerCase()===f.email.trim().toLowerCase());
    if(!u)return setErr("No encontramos una cuenta con ese correo. ¿Quieres crear una?");
    if(u.pass!==f.pass)return setErr("La contraseña no es correcta.");
    onLogin(u);
  };
  const register=async()=>{
    if(!f.name.trim())return setErr("Escribe tu nombre.");
    if(role==="patrocinador"&&!f.company.trim())return setErr("Escribe el nombre de tu marca o empresa.");
    if(!/^\S+@\S+\.\S+$/.test(f.email.trim()))return setErr("Ese correo no parece válido.");
    if(f.pass.length<6)return setErr("La contraseña debe tener al menos 6 caracteres.");
    if(REAL){
      setBusy(true);PENDING={name:f.name.trim(),role,company:f.company.trim()};
      try{await AUTH.createUserWithEmailAndPassword(f.email.trim(),f.pass)}catch(e){PENDING=null;setErr(fbErr(e));setBusy(false)}
      return;
    }
    const users=DB.users();
    if(users.some(x=>x.email.toLowerCase()===f.email.trim().toLowerCase()))return setErr("Ya existe una cuenta con ese correo. Prueba entrando.");
    const u={id:uid("u"),name:f.name.trim(),email:f.email.trim(),pass:f.pass,role,company:f.company.trim(),bio:"",loc:"",created:new Date().toISOString()};
    DB.setUsers([...users,u]);onLogin(u);
  };
  const demo=id=>onDemo(id);
  const tabBtn=(m,l)=><button className={mode===m?"on":""} onClick={()=>{setMode(m);setErr("");setStep(0)}}>{l}</button>;
  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <nav className="tnav"><div className="container"><div className="tni">
        <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:9,color:"var(--white)"}}><Logo size={26} glow={false}/><Word s={17}/></button>
        <button className="btn btn-g btn-sm" onClick={onBack}>← Volver</button>
      </div></div></nav>
      <div className="container" style={{maxWidth:460,padding:"26px 16px 40px",flex:1}}>
        <div className="seg">{tabBtn("login","Entrar")}{tabBtn("register","Crear cuenta")}</div>

        {mode==="login"&&<div className="fu">
          <h2 style={{fontSize:24,fontWeight:800,marginBottom:4}}>¡Hola de nuevo! 👋</h2>
          <p className="cmu tmd mb20">Entra con tu correo y contraseña.</p>
          <Field label="Correo"><input className="inp" type="email" autoComplete="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="tu@correo.com"/></Field>
          <Field label="Contraseña"><input className="inp" type="password" autoComplete="current-password" value={f.pass} onChange={e=>set("pass",e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="••••••"/></Field>
          {err&&<div className="hint e mb12">⚠️ {err}</div>}
          <button className="btn btn-p" style={{width:"100%"}} disabled={busy} onClick={login}>{busy?"Entrando…":"Entrar"}</button>
          <div className="card mt20" style={{background:"rgba(245,200,66,.05)",borderColor:"rgba(245,200,66,.3)"}}>
            <div className="fw7 mb8">👀 ¿Solo quieres mirar? Prueba la demo sin cuenta</div>
            <div className="tsm cmu mb12" style={{lineHeight:1.5}}>Es un <b className="cwh">mundo de prueba</b> con datos de ejemplo. Nada de lo que hagas ahí afecta la plataforma real. Elige cómo quieres verla:</div>
            <div style={{display:"grid",gap:8}}>
              {[["u1","🎯","Soy un evento","Cristóbal · Club Deportivo Andes"],["u2","🏢","Soy una marca","María · Marca Deportiva Chile"],["u3","💼","Soy inversor","Pablo · VC Chile Capital"]].map(([id,i,t,s])=>(
                <button key={id} className="task" style={{marginBottom:0}} onClick={()=>demo(id)}>
                  <div className="ti" style={{background:"rgba(255,255,255,.05)"}}>{i}</div>
                  <div style={{flex:1,minWidth:0}}><div className="fw7 tmd">{t}</div><div className="txs cmu ellip">{s}</div></div><span className="cte">→</span>
                </button>))}
            </div>
          </div>
        </div>}

        {mode==="register"&&step===0&&<div className="fu">
          <div className="steps"><div className="step on"/><div className="step"/></div>
          <h2 style={{fontSize:24,fontWeight:800,marginBottom:4}}>¿Quién eres?</h2>
          <p className="cmu tmd mb20">Elige una opción. Así te mostramos solo lo que necesitas.</p>
          {Object.entries(ROLE).map(([k,r])=>(
            <button key={k} className={"tc"+(role===k?" on":"")} style={{width:"100%",display:"flex",gap:14,alignItems:"center",marginBottom:10,textAlign:"left",color:"var(--white)"}} onClick={()=>{setRole(k);setErr("")}}>
              <span style={{fontSize:30}}>{r.i}</span>
              <div style={{flex:1}}><div className="fw7" style={{fontSize:16}}>{r.l}</div><div className="tsm cmu">{k==="patrocinado"?"Tengo un evento, club o soy creador y busco marcas":k==="patrocinador"?"Soy una marca y quiero patrocinar":"Quiero conocer la oportunidad de inversión"}</div></div>
              <span style={{width:22,height:22,borderRadius:"50%",border:"2px solid "+(role===k?"var(--teal)":"rgba(255,255,255,.2)"),background:role===k?"var(--teal)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"#07101e",fontSize:12,fontWeight:800}}>{role===k?"✓":""}</span>
            </button>))}
          <button className="btn btn-p mt8" style={{width:"100%"}} disabled={!role} onClick={()=>role&&setStep(1)}>{role?"Continuar →":"Elige una opción"}</button>
        </div>}

        {mode==="register"&&step===1&&<div className="fu">
          <div className="steps"><div className="step on"/><div className="step on"/></div>
          <Back onClick={()=>setStep(0)} label="Cambiar tipo de cuenta"/>
          <h2 style={{fontSize:24,fontWeight:800,marginBottom:4}}>Tus datos {ROLE[role].i}</h2>
          <p className="cmu tmd mb20">Solo lo básico. Tus eventos y detalles los agregas después.</p>
          <Field label="Tu nombre"><input className="inp" value={f.name} onChange={e=>set("name",e.target.value)} placeholder="Nombre y apellido"/></Field>
          {role==="patrocinador"&&<Field label="Nombre de tu marca o empresa"><input className="inp" value={f.company} onChange={e=>set("company",e.target.value)} placeholder="Ej: Café del Sur"/></Field>}
          {role==="inversor"&&<Field label="Fondo o empresa (opcional)"><input className="inp" value={f.company} onChange={e=>set("company",e.target.value)} placeholder="Ej: Ángel inversor"/></Field>}
          <Field label="Correo"><input className="inp" type="email" autoComplete="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="tu@correo.com"/></Field>
          <Field label="Crea una contraseña" hint="Mínimo 6 caracteres"><input className="inp" type="password" autoComplete="new-password" value={f.pass} onChange={e=>set("pass",e.target.value)} onKeyDown={e=>e.key==="Enter"&&register()} placeholder="••••••"/></Field>
          {err&&<div className="hint e mb12">⚠️ {err}</div>}
          <button className="btn btn-p" style={{width:"100%"}} disabled={busy} onClick={register}>{busy?"Creando tu cuenta…":"Crear mi cuenta ✓"}</button>
          <p className="txs cmu tc-c mt12">Gratis. Sin tarjeta de crédito.</p>
        </div>}
      </div>
    </div>
  );
}

function firstSteps(u){
  const chats=DB.chats().filter(c=>c.participants.includes(u.id));
  const wrote=chats.some(c=>c.messages.some(m=>m.from===u.id));
  const deals=myContracts(u.id).length>0;
  if(u.role==="patrocinado")return [
    {t:"Completa tu perfil",s:"Cuéntale a las marcas quién eres",ok:!!(u.bio&&u.loc),go:["perfil",{edit:1}]},
    {t:"Crea tu primer evento",s:"Lo que quieres que patrocinen",ok:DB.events().some(e=>e.ownerId===u.id),go:["eventos",{nuevo:1}]},
    {t:"Escríbele a una marca",s:"Preséntate y propón una idea",ok:wrote,go:["marcas",{}]},
    {t:"Cierra tu primer acuerdo",s:"Con entregas y pago protegido",ok:deals,go:["nuevo",{}]},
  ];
  return [
    {t:"Completa tu perfil",s:"Tu marca, sector y presupuesto",ok:!!(u.company&&u.bio),go:["perfil",{edit:1}]},
    {t:"Explora eventos",s:"Encuentra audiencias para tu marca",ok:DB.flag("explored_"+u.id),go:["buscar",{}]},
    {t:"Escríbele a un organizador",s:"Haz preguntas o agenda una videollamada",ok:wrote,go:["buscar",{}]},
    {t:"Crea tu primer acuerdo",s:"Tu dinero queda protegido",ok:deals,go:["nuevo",{}]},
  ];
}

  const stats=isP?[[money(pendingAmt),"Por cobrar","💰"],[money(paid),"Ya cobrado","✅"],[DB.events().filter(e=>e.ownerId===user.id).length,"Eventos","🎪"]]

        <span style={{color:t.c,fontSize:20,fontWeight:700}}>›</span>

  </div>;
}

function DisputeDetail({id}){
  const {user,go,toast,bump,apiKey,confirm}=useApp();
  const d=DB.disputes().find(x=>x.id===id);
  const [def,setDef]=useState("");
  const [loading,setLoading]=useState(false),[err,setErr]=useState("");
  if(!d)return <div><Back onClick={()=>go("acuerdos",{})}/><Empty icon="🤷" title="No encontramos esta disputa" text=""/></div>;
  const iAmAgainst=d.againstId===user.id,iOpened=d.openedById===user.id;
  const left=daysLeft(d),ready=d.defenseSent||left<=0;
  const cur=d.status==="executed"?4:ready?2:1;
  const upd=p=>DB.setDisputes(DB.disputes().map(x=>x.id===d.id?{...x,...p}:x));
  const sendDef=()=>{
    if(!def.trim()){toast("Escribe tu defensa","⚠️");return}
    upd({defense:def.trim(),defenseSent:true,defenseAt:new Date().toISOString()});
    sysMsg(user.id,d.openedById,`🛡️ ${first(user.name)} envió su defensa en la disputa “${d.title}”.`);
    toast("Defensa enviada","🛡️","Ahora la IA puede decidir");bump();
  };
  const run=async()=>{
    setErr("");setLoading(true);

    try{v=apiKey?await aiVerdict(apiKey,d):demoVerdict(d)}
    catch(e){setErr(e.message+" — Usamos el modo demo para mostrarte el resultado.");v=demoVerdict(d)}
    await new Promise(r=>setTimeout(r,apiKey?200:1600));
    upd({status:"executed",verdict:v,resolvedAt:new Date().toISOString()});
    DB.setContracts(DB.contracts().map(x=>x.id!==d.contractId?x:{...x,milestones:x.milestones.map(y=>y.id===d.milestoneId?{...y,status:"resolved",paidPct:v.pct}:y)}));
    sysMsg(user.id,user.id===d.openedById?d.againstId:d.openedById,`🤖 La IA resolvió la disputa “${d.title}”: ${v.pct}% para el patrocinado.`);
    setLoading(false);toast("La IA tomó una decisión","🤖",`${v.pct}% al patrocinado`);bump();
  };
  const skip=()=>confirm({title:"Saltar la espera (solo demo)",text:"En la vida real hay que esperar 7 días. Esto es solo para mostrar cómo funciona.",ok:"Saltar espera",onOk:()=>{upd({deadline:new Date(Date.now()-1000).toISOString()});bump()}});
  const v=d.verdict;
  return <div>
    <Back onClick={()=>go("acuerdos",{cid:d.contractId})} label="Volver al acuerdo"/>
    <div className="card mb12" style={{borderColor:"rgba(240,96,74,.3)"}}>
      <div className="txs fw7 mb8" style={{color:"var(--err)"}}>⚖️ DISPUTA</div>
      <div style={{fontSize:19,fontWeight:800,fontFamily:"'Sora',sans-serif",marginBottom:4}}>{d.title}</div>
      <div className="tsm cmu mb16">{money(d.amount)} en juego · abierta el {fdate(d.created)}</div>
      <Stepper steps={["Disputa abierta","Defensa (7 días)","Decisión IA","Pago hecho"]} cur={cur}/>
      {d.status==="open"&&<div className={"hint "+(ready?"p":"w")}>{ready?"🤖 Todo listo. Cualquiera de las partes puede pedir la decisión de la IA.":`⏳ Quedan ${left} días para que ${iAmAgainst?"tú presentes":d.againstName+" presente"} la defensa.`}</div>}
    </div>

    {v&&<div className="card mb12" style={{borderColor:"rgba(167,139,250,.35)",background:"var(--pbg)"}}>
      <div className="fw7 mb12" style={{color:"var(--pur)"}}>🤖 Decisión de la IA {v.demo&&<span className="pill" style={{background:"rgba(255,255,255,.08)",color:"var(--muted)",marginLeft:6}}>Modo demo</span>}</div>
      <div className="g2" style={{gap:8,marginBottom:14}}>
        <div className="st"><div className="stv">{money(d.amount*v.pct/100)}</div><div className="stl">{v.pct}% para el evento</div></div>
        <div className="st"><div className="stv" style={{color:"var(--pur)"}}>{money(d.amount*(100-v.pct)/100)}</div><div className="stl">{100-v.pct}% vuelve a la marca</div></div>
      </div>
      {v.reasoning.map((r,i)=><div key={i} className="tsm mb8" style={{display:"flex",gap:8,lineHeight:1.5}}><span style={{color:"var(--pur)"}}>{i+1}.</span><span>{r}</span></div>)}
      <div className="txs cmu mt8">✅ El pago ya se ejecutó automáticamente.</div>
    </div>}

    <div className="mcard"><div className="txs fw7 cmu mb8">📣 RECLAMO DE {d.openedByName.toUpperCase()}{iOpened?" (TÚ)":""}</div>
      <span className="pill mb8" style={{background:"var(--ebg)",color:"var(--err)"}}>{d.reason}</span>
      <div className="tmd mt8" style={{lineHeight:1.55}}>{d.description}</div>
      {d.claimantEvidence&&<div className="tsm cmu mt8">📎 {d.claimantEvidence}</div>}</div>

    <div className="mcard"><div className="txs fw7 cmu mb8">🛡️ DEFENSA DE {d.againstName.toUpperCase()}{iAmAgainst?" (TÚ)":""}</div>
      {d.defenseSent?<div className="tmd" style={{lineHeight:1.55}}>{d.defense}</div>
      :iAmAgainst&&d.status==="open"&&left>0?<div>
        <div className="tsm cmu mb8">Explica tu versión. Si tienes pruebas, descríbelas. Tienes {left} días.</div>
        <textarea className="inp mb12" value={def} onChange={e=>setDef(e.target.value)} placeholder="Ej: Se instalaron las 4 vallas el 14 de marzo; adjunto fotos con fecha…"/>
        <button className="btn btn-p" style={{width:"100%"}} onClick={sendDef}>🛡️ Enviar mi defensa</button>
      </div>:<div className="tsm cmu">{left>0?"Todavía no ha respondido.":"No presentó defensa dentro del plazo."}</div>}
    </div>

    {d.status==="open"&&<div className="mt16">
      {err&&<div className="hint w mb12">⚠️ {err}</div>}
      {ready?<button className="btn btn-pur" style={{width:"100%"}} disabled={loading} onClick={run}>{loading?<><span style={{width:16,height:16,border:"2px solid rgba(255,255,255,.3)",borderTopColor:"#fff",borderRadius:"50%",animation:"spin 1s linear infinite"}}/> La IA está analizando…</>:"🤖 Pedir la decisión de la IA"}</button>
      :<button className="btn btn-g" style={{width:"100%"}} onClick={skip}>⏩ Saltar la espera de 7 días (solo demo)</button>}
      {!apiKey&&<div className="txs cmu tc-c mt8">Sin clave de Gemini se usa el modo demo. Puedes agregarla en <button className="cte" style={{textDecoration:"underline",fontSize:12}} onClick={()=>go("perfil",{ai:1})}>Perfil → Árbitro IA</button>.</div>}
    </div>}
  </div>;
}

function NewDeal(){
  const {user,route,go,toast,bump}=useApp();
  const isS=user.role==="patrocinador";
  const myEvents=DB.events().filter(e=>e.ownerId===user.id);
  const others=isS?DB.events().filter(e=>e.ownerId!==user.id):DB.users().filter(u=>u.role==="patrocinador");

  const [ai,setAi]=useState(true);
  const ev=DB.events().find(e=>e.id===evId);
  const brand=userById(brandId);
  const total=ms.reduce((s,m)=>s+(Number(m.amount)||0),0);
  const setM=(i,k,v)=>setMs(p=>p.map((m,j)=>j===i?{...m,[k]:v}:m));
  const ok0=isS?!!ev:!!(ev&&brand);
  const ok1=ms.length>0&&ms.every(m=>m.title.trim()&&Number(m.amount)>0);
  if(!isS&&myEvents.length===0)return <div><Back onClick={()=>go("acuerdos",{})}/><Empty icon="🎪" title="Primero crea un evento" text="Para proponer un acuerdo necesitas tener al menos un evento." action="➕ Crear evento" onAction={()=>go("eventos",{nuevo:1})}/></div>;

    toast("¡Acuerdo creado!","🤝",isS?"Tu dinero queda protegido":"La marca fue notificada");bump();go("acuerdos",{cid:c.id});

const QUICK={patrocinado:["¡Hola! Gracias por escribir 😊","Te envío una propuesta con entregas","¿Hacemos una videollamada?","Ya subí la evidencia, ¿la puedes revisar?"],patrocinador:["¡Hola! Nos interesa tu evento","¿Cuál es el público exacto?","¿Hacemos una videollamada?","Te envío la propuesta de acuerdo"]};
function ChatView(){
  const {user,route,go,toast,bump,startCall}=useApp();
  const [txt,setTxt]=useState("");
  const endRef=useRef(null);
  const chats=DB.chats().filter(c=>c.participants.includes(user.id)).sort((a,b)=>{const am=a.messages||[],bm=b.messages||[];const la=am[am.length-1],lb=bm[bm.length-1];return (lb?lb.ts:"").localeCompare(la?la.ts:"")});
  const ch=route.chat&&chats.find(c=>c.id===route.chat);
  useEffect(()=>{
    if(ch&&(ch.unread||{})[user.id]){markRead(ch.id,user.id);bump()}
    if(endRef.current)endRef.current.scrollIntoView({block:"end"});
  },[route.chat,ch&&(ch.messages||[]).length]);
  if(!ch)return <div>
    <Head title="Mensajes" sub="Conversa con marcas y eventos dentro de GetSponzo"/>
    {chats.length===0?<Empty icon="💬" title="Aún no tienes conversaciones" text={user.role==="patrocinador"?"Busca un evento y toca “💬 Escribir”.":"Ve a las marcas y escríbeles para presentar tu evento."} action={user.role==="patrocinador"?"🔍 Buscar eventos":"🏢 Ver marcas"} onAction={()=>go(user.role==="patrocinador"?"buscar":"marcas",{})}/>
    :<div className="card" style={{padding:"4px 14px"}}>{chats.map(c=>{
      const oid=c.participants.find(p=>p!==user.id),o=userById(oid),last=(c.messages||[])[(c.messages||[]).length-1],n=(c.unread||{})[user.id]||0;
      return <button key={c.id} className="lrow" onClick={()=>go("mensajes",{chat:c.id})}>
        <Av u={o} size={46}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:8}}><span className={"tmd ellip "+(n?"fw7":"fw6")}>{c.names[oid]||dispName(o)}</span><span className="txs cmu" style={{flexShrink:0}}>{last?hhmm(last.ts):""}</span></div>
          {c.eventName&&<div className="txs cte ellip">{c.eventName}</div>}
          <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"center"}}><span className="tsm ellip" style={{color:n?"var(--white)":"var(--muted)"}}>{last?(last.from===user.id?"Tú: ":"")+last.text:"Sin mensajes"}</span>{n>0&&<span className="pill" style={{background:"var(--teal)",color:"#07101e",padding:"2px 8px"}}>{n}</span>}</div>
        </div>
      </button>})}</div>}
  </div>;
  const oid=ch.participants.find(p=>p!==user.id),other=userById(oid);
  const send=t=>{
    const text=(t||txt).trim();if(!text)return;
    if(/[\w.+-]+@[\w-]+\.[\w.]+/.test(text)||/(\+?\d[\d\s-]{7,}\d)/.test(text)){toast("Por tu seguridad no compartas correos ni teléfonos","🛡️","Todo dentro de GetSponzo queda protegido");return}
    pushMsg(ch.id,{id:msgId(),from:user.id,text,ts:new Date().toISOString()},oid);
    setTxt("");bump();
  };
  return <div>
    <div className="chat-wrap">
      <div className="chat-head">
        <button className="ibtn" onClick={()=>go("mensajes",{})} aria-label="Volver">←</button>
        <Av u={other} size={38}/>
        <div style={{flex:1,minWidth:0}}><div className="fw7 tmd ellip">{ch.names[oid]||dispName(other)}</div><div className="txs cmu ellip">{ch.eventName||ROLE[(other||{}).role||"patrocinado"].l}</div></div>
        <button className="ibtn" onClick={()=>startCall(other)} title="Videollamada" style={{background:"rgba(23,212,160,.12)",borderColor:"var(--border)"}}>📹</button>
      </div>
      <div className="chat-body">
        <div className="sysmsg">🔒 Conversación protegida por GetSponzo</div>
        {(ch.messages||[]).map(m=>m.from==="sys"?<div key={m.id} className="sysmsg">{m.text}{m.call&&/^https:\/\/meet\.jit\.si\/[\w-]+$/.test(m.call)&&<div><a href={m.call} target="_blank" rel="noopener" className="btn btn-p btn-sm" style={{marginTop:8,textDecoration:"none"}}>📹 Unirme a la llamada</a></div>}</div>:
          <div key={m.id} style={{display:"flex",flexDirection:"column",alignItems:m.from===user.id?"flex-end":"flex-start"}}>
            <div className={"bub "+(m.from===user.id?"bub-me":"bub-them")}>{m.text}</div>
            <div className="bub-time">{hhmm(m.ts)}</div>
          </div>)}
        <div ref={endRef}/>
      </div>
      <div className="qr">{(QUICK[user.role]||QUICK.patrocinado).map(q=><button key={q} onClick={()=>send(q)}>{q}</button>)}</div>
      <div className="chat-foot">
        <input className="inp" value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Escribe un mensaje…" style={{flex:1}}/>
        <button className="btn btn-p" style={{width:52,padding:0,flexShrink:0}} onClick={()=>send()} aria-label="Enviar">➤</button>
      </div>
    </div>
  </div>;
}

      <div className="fw7 mb12">Ingresos del año 5 según escenario</div>
      {[["🟡 Conservador",692,"25%","var(--warn)"],["🟢 Base",2025,"50%","var(--ok)"],["🔵 Optimista",9471,"25%","#60a5fa"]].map(([s,v,p,c])=>(
        <div key={s} className="mb12"><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span className="tsm fw6">{s} <span className="cmu">· {p} prob.</span></span><b style={{color:c}}>€{v>=1000?(v/1000).toFixed(1).replace(".",",")+"M":v+"K"}</b></div><Bar v={v/9471*100} c={c}/></div>))}
      <div className="hint mt8">📈 <div>Resultado esperado ponderado: <b>€3,55M</b> de ingresos en el año 5.</div></div>
    </div>
    <div className="card mt12">
      <div className="fw7 mb8">💶 ¿Cómo gana dinero GetSponzo?</div>
      {[["Comisión por acuerdo","Un % de cada patrocinio que pasa por la plataforma."],["Suscripción para marcas","Plan mensual con búsqueda avanzada y métricas."],["Servicios extra","Verificación destacada y reportes de impacto."]].map(([t,d])=><div key={t} className="tsm mb8"><b>• {t}:</b> <span className="cmu">{d}</span></div>)}
    </div>
  </div>;
}

      {[{f:"🇨🇱",n:"Chile — Partimos aquí",c:"var(--teal)",a:"~€445M",p:["Mercado sin competidores directos","Red de contactos del fundador","Validación rápida y barata","PYMEs sin acceso a agencias"]},
        {f:"🇪🇸",n:"España — Fase 2",c:"var(--pur)",a:"€1.967M",p:["+19% de crecimiento en 2024","El más rápido de Europa","Llegamos con casos de éxito","Competidores sin pago protegido ni IA"]}].map(m=>(
        <div key={m.n} className="card" style={{borderColor:m.c}}>

          {m.p.map(p=><div key={p} className="tsm cmu mb8">✓ {p}</div>)}

    </div>
    <div className="card">
      <div className="fw7 mb12">🏆 Ventajas frente a la competencia</div>
      {[["🔒","Pago protegido por entregas","Nadie paga por algo que no recibió."],["🤖","Árbitro IA","Disputas resueltas en 7 días, sin abogados."],["⭐","Reputación verificada","Historial de cumplimiento imposible de falsear."],["🇨🇱","Chile primero","Mercado virgen = aprendemos rápido y barato."]].map(([i,t,d])=>(
        <div key={t} className="row mb12" style={{alignItems:"flex-start"}}><div className="ti" style={{background:"rgba(23,212,160,.1)",width:36,height:36,fontSize:16}}>{i}</div><div><div className="fw7 tmd">{t}</div><div className="tsm cmu">{d}</div></div></div>))}
    </div>
  </div>;
}
function InvContacto(){
  const {user,toast}=useApp();
  const [sent,setSent]=useState(false),[amt,setAmt]=useState(""),[msg,setMsg]=useState("");
  return <div>
    <Head title="Contacto" sub="El fundador responde personalmente"/>
    <div className="card mb12"><div className="row"><Av t="founder" size={56}/><div><div className="fw7" style={{fontSize:16}}>Cristóbal Torretti</div><div className="tsm cte fw6">Founder & CFO · Chile 🇨🇱</div></div></div>
      <p className="tsm cmu mt12" style={{lineHeight:1.65,fontStyle:"italic"}}>“Las oportunidades no deberían depender de a quién conoces, sino del valor que eres capaz de crear.”</p></div>
    {sent?<Empty icon="🚀" title="¡Mensaje enviado!" text="Cristóbal te contactará en menos de 24 horas."/>
    :<div className="card">
      <Field label="¿Cuánto te interesaría invertir?"><div className="chips" style={{flexWrap:"wrap"}}>{["€10K – €50K","€50K – €200K","€200K+","Solo quiero saber más"].map(r=><button key={r} className={"chip"+(amt===r?" on":"")} onClick={()=>setAmt(r)}>{r}</button>)}</div></Field>
      <Field label="Tu mensaje"><textarea className="inp" style={{minHeight:100}} value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Cuéntanos tu interés o tus preguntas…"/></Field>
      <button className="btn btn-p" style={{width:"100%"}} onClick={()=>{if(!msg.trim()){toast("Escribe un mensaje","⚠️");return}
        const lead={from:user.id,name:user.name,email:(REAL&&AUTH&&AUTH.currentUser&&AUTH.currentUser.email)||user.email||"",amt,msg,ts:new Date().toISOString()};if(REAL)FS.collection("leads").add(lead).catch(()=>{});else{const l=load("gs_leads",[]);l.push(lead);save("gs_leads",l)}setSent(true);toast("Mensaje enviado","🚀")}}>📩 Enviar</button>
    </div>}
  </div>;
}

/* ══════════ ESTRUCTURA DE LA APP ══════════ */
const TABS={
  patrocinado:[["inicio","Inicio","🏠"],["eventos","Mis eventos","🎪"],["acuerdos","Acuerdos","🤝"],["mensajes","Mensajes","💬"],["perfil","Perfil","👤"]],
  patrocinador:[["inicio","Inicio","🏠"],["buscar","Buscar","🔍"],["acuerdos","Acuerdos","🤝"],["mensajes","Mensajes","💬"],["perfil","Perfil","👤"]],
  inversor:[["resumen","Resumen","📈"],["numeros","Números","💰"],["mercado","Mercado","🌎"],["contacto","Contacto","📩"],["perfil","Perfil","👤"]],
};
const homeTab=u=>u&&u.role==="inversor"?"resumen":"inicio";
function View(){
  const {user,route}=useApp();
  const V={inicio:HomeView,eventos:EventsView,buscar:ExploreView,marcas:BrandsView,acuerdos:DealsView,nuevo:NewDeal,mensajes:ChatView,perfil:ProfileView,resumen:InvResumen,numeros:InvNumeros,mercado:InvMercado,contacto:InvContacto}[route.tab];
  const allowed=TABS[user.role].map(t=>t[0]).concat(user.role==="patrocinado"?["marcas","nuevo"]:user.role==="patrocinador"?["nuevo"]:[]);
  if(!V||!allowed.includes(route.tab)){const H=user.role==="inversor"?InvResumen:HomeView;return <H/>}
  return <V/>;
}
function Shell(){
  const A=useApp();const {user,route,go,openHelp}=A;
  const tabs=TABS[user.role];
  const tasks=getTasks(user);
  const badge={acuerdos:tasks.filter(t=>t.go[0]==="acuerdos").length,mensajes:unreadCount(user.id),inicio:0};
  const active=route.tab==="nuevo"?"acuerdos":route.tab==="marcas"?"inicio":route.tab;
  const nb=n=>n>0?<i className="nb">{n>9?"9+":n}</i>:null;
  return <div>
    <nav className="tnav"><div className="container"><div className="tni">
      <button onClick={()=>go(homeTab(user),{})} style={{display:"flex",alignItems:"center",gap:8,color:"var(--white)",minWidth:0}}><Logo size={26} glow={false}/><Word s={17}/></button>
      <div style={{display:"flex",gap:7,alignItems:"center"}}>
        <button className="ibtn" onClick={openHelp} title="Ayuda" aria-label="Ayuda">❓</button>
        <button className="ibtn" onClick={()=>{A.toast("Buscando la versión más nueva…","🔄");setTimeout(()=>location.replace(location.pathname+"?v="+Date.now()),500)}} title="Actualizar" aria-label="Actualizar">🔄</button>
        <button onClick={()=>go("perfil",{})} aria-label="Perfil" style={{borderRadius:"50%"}}><Av u={user} size={38}/></button>
      </div>
    </div></div></nav>
    {!REAL&&HAS_FB&&<div style={{background:"rgba(245,200,66,.12)",borderBottom:"1px solid rgba(245,200,66,.3)"}}><div className="container" style={{display:"flex",alignItems:"center",gap:10,padding:"8px 16px"}}>
      <span style={{fontSize:13,flex:1,lineHeight:1.35}}>👀 <b>Estás en la DEMO.</b> <span className="cmu">Nada de lo que hagas aquí afecta la plataforma real.</span></span>
      <button className="btn btn-g btn-sm" style={{flexShrink:0,minHeight:34,padding:"6px 12px"}} onClick={A.logout}>Salir</button></div></div>}
    <div className="container play">
      <aside className="sbar">
        <div style={{padding:"4px 13px 12px"}}><div className="txs cmu">Conectado como</div><div className="fw7 tsm ellip">{ROLE[user.role].i} {ROLE[user.role].l}</div></div>
        {tabs.map(([id,l,i])=><button key={id} className={active===id?"on":""} onClick={()=>go(id,{})}><i>{i}</i>{l}{nb(badge[id])}</button>)}
        {user.role!=="inversor"&&<button className="btn btn-p btn-sm mt16" style={{width:"100%",color:"#07101e",justifyContent:"center",background:"linear-gradient(135deg,var(--teal),var(--td))"}} onClick={()=>go(user.role==="patrocinado"?"eventos":"nuevo",user.role==="patrocinado"?{nuevo:1}:{})}>{user.role==="patrocinado"?"➕ Crear evento":"➕ Nuevo acuerdo"}</button>}
      </aside>
      <main className="main" style={{animation:"fadeIn .25s ease"}} key={route.tab+(route.cid||"")+(route.did||"")+(route.chat||"")}><View/></main>
    </div>
    <div className="bnav">{tabs.map(([id,l,i])=><button key={id} className={"bni"+(active===id?" on":"")} onClick={()=>go(id,{})}><i>{i}</i>{l}{nb(badge[id])}</button>)}</div>
  </div>;
}

function App(){
  const [user,setUserS]=useState(()=>{if(REAL)return null;initData();const id=DB.sess();return id?userById(id)||null:null});
  const [screen,setScreen]=useState(()=>REAL?"loading":(DB.sess()&&userById(DB.sess())?"app":"landing"));
  const [authMode,setAuthMode]=useState("login");
  const [route,setRoute]=useState(()=>({tab:homeTab(user)}));
  const [,setRev]=useState(0);
  const [toastS,setToastS]=useState(null);
  const [call,setCall]=useState(null);
  const [conf,setConf]=useState(null);
  const [help,setHelp]=useState(false);
  const [welcome,setWelcome]=useState(false);
  const [apiKey,setApiKeyS]=useState(DB.api());
  const tRef=useRef(null);
  const userRef=useRef(user);userRef.current=user;

  useEffect(()=>{
    history.replaceState({screen:screen==="loading"?"landing":screen,...route},"");
    const onPop=e=>{
      const s=e.state;if(!s||s.screen==="loading")return;
      if(s.screen==="app"&&!userRef.current){setScreen("landing");return}
      setScreen(s.screen);
      if(s.screen==="auth")setAuthMode(s.mode||"login");
      if(s.screen==="app"){const {screen:_x,...r}=s;setRoute(r.tab?r:{tab:homeTab(userRef.current)})}
      setConf(null);
    };
    window.addEventListener("popstate",onPop);return()=>window.removeEventListener("popstate",onPop);
  },[]);

  const toast=(msg,icon="✅",sub)=>{setToastS({msg,icon,sub});clearTimeout(tRef.current);tRef.current=setTimeout(()=>setToastS(null),3000)};
  const bump=()=>{if(userRef.current){const u=userById(userRef.current.id);if(u)setUserS(u)}setRev(r=>r+1)};
  const go=(tab,extra={})=>{const r={tab,...extra};history.pushState({screen:"app",...r},"");setRoute(r);setScreen("app");window.scrollTo(0,0)};
  const nav=(s,extra={})=>{history.pushState({screen:s,...extra},"");setScreen(s);window.scrollTo(0,0)};
  useEffect(()=>{
    if(!HAS_FB||!AUTH)return;
    onData=()=>{if(userRef.current){const u=userById(userRef.current.id);if(u)setUserS(u)}setRev(r=>r+1)};
    return AUTH.onAuthStateChanged(async fu=>{
      if(!REAL)return;
      if(!fu){stopSync();userRef.current=null;setUserS(null);setScreen(s=>s==="auth"?"auth":"landing");return}
      setScreen(s=>s==="auth"?"auth":"loading");
      await startSync(fu.uid);
      let u=userById(fu.uid);
      if(!u){const p=PENDING||{};PENDING=null;u={id:fu.uid,name:p.name||(fu.email||"").split("@")[0],role:p.role||"patrocinado",company:p.company||"",bio:"",loc:"",created:new Date().toISOString()};DB.setUsers([...DB.users(),u])}
      login(u);
    });
  },[]);
  const login=u=>{
    if(!REAL)DB.setSess(u.id);setUserS(u);userRef.current=u;const r={tab:homeTab(u)};
    history.pushState({screen:"app",...r},"");setRoute(r);setScreen("app");window.scrollTo(0,0);
    if(!DB.flag("welcome_"+u.id)){DB.setFlag("welcome_"+u.id);setWelcome(true)}
  };
  const wasDemo=()=>HAS_FB&&!REAL;
  const logout=()=>{const d=wasDemo();if(REAL)AUTH.signOut();else DB.clearSess();if(d)setDemo(false);userRef.current=null;setUserS(null);nav("landing");toast(d?"Saliste de la demo":"Sesión cerrada","👋",d?"Volviste a la plataforma real":undefined)};
  const enterDemo=id=>{
    if(HAS_FB&&AUTH&&AUTH.currentUser){REAL=false;AUTH.signOut().catch(()=>{})}
    stopSync();setDemo(true);initData();const u=userById(id);
    if(u){login(u);toast("Estás en la demo","👀","Nada de lo que hagas aquí afecta la plataforma real")}
  };
  const setUser=u=>{DB.setUsers(DB.users().map(x=>x.id===u.id?u:x));setUserS(u)};
  const setApiKey=k=>{DB.setApi(k);setApiKeyS(k)};
  const switchUser=id=>{const u=userById(id);if(u){login(u);toast("Ahora ves la app como "+ROLE[u.role].l,ROLE[u.role].i)}};
  const chatWith=(otherId,eventName)=>{
    const me=userRef.current;
    const ch=findChat(me.id,otherId)||createChat(me.id,otherId,eventName);
    go("mensajes",{chat:ch.id});
  };
  const ctx={user,setUser,route,go,toast,bump,apiKey,setApiKey,logout,switchUser,chatWith,enterDemo,
    startCall:peer=>setCall(peer||{id:"x",name:"Usuario"}),confirm:o=>setConf(o),openHelp:()=>setHelp(true)};

  return <Ctx.Provider value={ctx}>
    {screen==="loading"&&<div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}><Logo size={56}/><Word s={22}/><div className="tsm cmu">Conectando…</div></div>}
    {screen==="landing"&&<Landing user={user} onPanel={()=>go(homeTab(user),{})} onLogin={()=>{setAuthMode("login");nav("auth",{mode:"login"})}} onRegister={()=>{setAuthMode("register");nav("auth",{mode:"register"})}}/>}
    {screen==="auth"&&<Auth mode={authMode} setMode={setAuthMode} onLogin={login} onDemo={enterDemo} onBack={()=>nav("landing")}/>}
    {screen==="app"&&user&&<Shell/>}
    {screen==="app"&&!user&&<Landing user={null} onPanel={()=>{}} onLogin={()=>{setAuthMode("login");nav("auth",{mode:"login"})}} onRegister={()=>{setAuthMode("register");nav("auth",{mode:"register"})}}/>}
    {welcome&&user&&<WelcomeSheet onClose={()=>setWelcome(false)}/>}
    {help&&user&&<HelpSheet onClose={()=>setHelp(false)}/>}
    {conf&&<Sheet title={conf.title} icon={conf.danger?"⚠️":"✋"} onClose={()=>setConf(null)} footer={<><button className="btn btn-g" onClick={()=>setConf(null)}>Cancelar</button><button className={"btn "+(conf.danger?"btn-d":"btn-p")} onClick={()=>{const f=conf.onOk;setConf(null);f&&f()}}>{conf.ok||"Confirmar"}</button></>}><p className="tmd" style={{lineHeight:1.6}}>{conf.text}</p></Sheet>}
    {call&&user&&<CallSheet peer={call} onClose={()=>setCall(null)}/>}
    {toastS&&<div className="toast"><span style={{fontSize:19,flexShrink:0}}>{toastS.icon}</span><div style={{minWidth:0}}><div style={{fontWeight:700,fontSize:14}}>{toastS.msg}</div>{toastS.sub&&<div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>{toastS.sub}</div>}</div></div>}
  </Ctx.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
