<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0"/>
<title>GetSponzo — Patrocinio protegido</title>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#07101e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GetSponzo"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<meta name="description" content="Conecta marcas con eventos. Pago protegido por escrow. Árbitro IA en 7 días."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07101e;--bg2:#0b1828;--card:#0e2030;--card2:#112438;
  --teal:#17d4a0;--td:#0cb888;--tl:#3de8b5;
  --white:#f0f8fc;--muted:#8fa9bd;--muted2:#5f7d94;
  --border:rgba(23,212,160,.14);--bs:rgba(255,255,255,.06);
  --warn:#f5c842;--wbg:rgba(245,200,66,.09);
  --err:#f0604a;--ebg:rgba(240,96,74,.09);
  --ok:#28cf7a;--obg:rgba(40,207,122,.09);
  --pur:#a78bfa;--pbg:rgba(124,58,237,.1);
  --nav-h:56px;--bnav-h:64px;
}
html{scroll-behavior:smooth;font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--white);line-height:1.5;overflow-x:hidden;min-height:100vh;overscroll-behavior-y:none}
h1,h2,h3,h4{font-family:'Sora',sans-serif;letter-spacing:-.02em;line-height:1.2}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;background:none;-webkit-appearance:none}
input,textarea,select{font-family:'Inter',sans-serif;-webkit-appearance:none;appearance:none;font-size:16px}
input::placeholder,textarea::placeholder{color:rgba(107,143,168,.5)}
select option{background:#0e2030;color:#fff}
img{max-width:100%;height:auto;display:block}
a{color:var(--teal);text-decoration:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(23,212,160,.2);border-radius:99px}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.7)}}
@keyframes fill{from{width:0}to{width:var(--w)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(23,212,160,.3))}50%{filter:drop-shadow(0 0 12px rgba(23,212,160,.7))}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes gridMove{from{background-position:0 0}to{background-position:60px 60px}}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(23,212,160,.5)}50%{box-shadow:0 0 0 12px rgba(23,212,160,0)}}

.fu{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both}
.fu1{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) .06s both}
.fu2{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) .12s both}
.fu3{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) .18s both}

.container{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
@media(min-width:640px){.container{padding:0 24px}}

.card{background:var(--card);border:1px solid var(--bs);border-radius:16px;padding:18px}
@media(min-width:640px){.card{border-radius:18px;padding:22px}}
.card-i{cursor:pointer;transition:transform .22s,border-color .22s,box-shadow .22s}
.card-i:active{transform:scale(.985)}
@media(hover:hover){.card-i:hover{transform:translateY(-3px);border-color:var(--border);box-shadow:0 10px 30px rgba(0,0,0,.3)}}

.btn{font-weight:700;border-radius:12px;padding:13px 20px;font-size:15px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;font-family:'Inter',sans-serif;min-height:48px;width:100%;line-height:1.2}
.btn:active{transform:scale(.98)}
.btn-p{background:linear-gradient(135deg,var(--teal),var(--td));color:#07101e;box-shadow:0 4px 16px rgba(23,212,160,.2)}
.btn-g{background:rgba(255,255,255,.05);color:var(--white);border:1px solid var(--bs);font-weight:600}
.btn-d{background:var(--ebg);color:var(--err);border:1px solid rgba(240,96,74,.25)}
.btn-pur{background:rgba(124,58,237,.8);color:#fff;border:1px solid rgba(124,58,237,.4)}
.btn-sm{white-space:nowrap;padding:9px 15px;font-size:13px;min-height:40px;border-radius:10px;width:auto}
.btn-auto{width:auto}
@media(min-width:640px){.btn{width:auto}}

.inp{width:100%;padding:13px 15px;border:1.5px solid var(--bs);border-radius:11px;background:rgba(255,255,255,.03);color:var(--white);font-size:16px;outline:none;transition:border .2s;min-height:48px}
.inp:focus{border-color:var(--teal)}
textarea.inp{min-height:80px;resize:vertical;line-height:1.5}
.iw{margin-bottom:15px}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:7px}

.tag{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:4px 9px;font-size:11px;font-weight:700;white-space:nowrap;line-height:1.3}

.bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(7,16,30,.97);backdrop-filter:blur(20px);border-top:1px solid var(--bs);padding:6px 2px calc(6px + env(safe-area-inset-bottom));z-index:300;overflow-x:auto}
.bnav::-webkit-scrollbar{display:none}
.bni{flex:1 0 auto;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:9.5px;font-weight:600;cursor:pointer;color:var(--muted);background:none;border:none;font-family:'Inter',sans-serif;transition:color .2s;line-height:1.2}
.bni.on{color:var(--teal)}
.bni i{font-size:19px;font-style:normal;line-height:1}

.sbar{display:none}
@media(min-width:820px){
  .bnav{display:none}
  .sbar{display:flex;flex-direction:column;gap:2px;width:210px;position:sticky;top:calc(var(--nav-h) + 16px);height:fit-content;flex-shrink:0}
  .sbar button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted);background:transparent;border:1px solid transparent;transition:all .2s;text-align:left;font-family:'Inter',sans-serif}
  .sbar button.on{background:rgba(23,212,160,.1);color:var(--teal);border-color:var(--border)}
  .sbar button:hover:not(.on){background:rgba(255,255,255,.04)}
  .sbar i{font-size:17px;font-style:normal}
}

.play{display:flex;gap:22px;align-items:flex-start;padding-top:16px;padding-bottom:calc(var(--bnav-h) + 24px)}
@media(min-width:820px){.play{padding-bottom:32px}}
.main{flex:1;min-width:0;width:100%}

.g2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.g2{grid-template-columns:1fr 1fr}}
.g3{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:520px){.g3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:860px){.g3{grid-template-columns:repeat(3,1fr)}}
.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:680px){.g4{grid-template-columns:repeat(4,1fr)}}

.toast{position:fixed;bottom:calc(var(--bnav-h) + 14px);left:50%;transform:translateX(-50%);z-index:9999;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:13px 17px;display:flex;align-items:center;gap:11px;box-shadow:0 16px 50px rgba(0,0,0,.55);max-width:340px;width:calc(100% - 28px);animation:slideUp .3s ease}
@media(min-width:820px){.toast{bottom:24px}}

.bt{height:8px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.bf{height:100%;border-radius:99px;animation:fill .9s ease both}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .2s}
@media(min-width:640px){.ov{align-items:center;padding:16px}}

.tc{border:2px solid var(--bs);border-radius:15px;padding:16px;cursor:pointer;transition:all .22s;background:var(--card)}
.tc.on{border-color:var(--teal);background:rgba(23,212,160,.06)}

.sh{margin-bottom:18px}
.sh h2{font-size:21px;font-weight:700;margin-bottom:4px}
@media(min-width:640px){.sh h2{font-size:25px}}
.sh p{font-size:14px;color:var(--muted)}

.tnav{position:sticky;top:0;z-index:200;background:rgba(7,16,30,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--bs)}
.tni{display:flex;align-items:center;justify-content:space-between;height:var(--nav-h);gap:10px}

.st{background:rgba(255,255,255,.03);border-radius:13px;padding:13px 10px;text-align:center}
.stv{font-family:'Sora',sans-serif;font-size:21px;font-weight:800;color:var(--teal);margin-bottom:3px;line-height:1.1}
.stl{font-size:11px;color:var(--muted);line-height:1.3}

.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite;display:inline-block;flex-shrink:0}

.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-ms-overflow-style:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:'Inter',sans-serif;background:rgba(255,255,255,.06);color:var(--muted);white-space:nowrap;flex-shrink:0;transition:all .2s}
.chip.on{background:var(--teal);color:#07101e}

.empty{text-align:center;padding:44px 20px}
.empty-i{font-size:48px;margin-bottom:14px;opacity:.6}
.empty h3{font-size:17px;font-weight:700;margin-bottom:7px}
.empty p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.6;max-width:320px;margin-left:auto;margin-right:auto}

.row{display:flex;gap:12px;align-items:center}
.rowb{display:flex;gap:10px;flex-wrap:wrap}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - var(--nav-h) - var(--bnav-h) - 100px);min-height:400px;background:var(--card);border:1px solid var(--bs);border-radius:16px;overflow:hidden}
@media(min-width:820px){.chat-wrap{height:560px}}
.chat-head{padding:12px 15px;border-bottom:1px solid var(--bs);display:flex;align-items:center;gap:11px;flex-shrink:0}
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.chat-foot{padding:11px;border-top:1px solid var(--bs);display:flex;gap:9px;flex-shrink:0;align-items:flex-end}
.bub{padding:10px 14px;border-radius:15px;font-size:14.5px;line-height:1.45;max-width:82%;word-break:break-word}
.bub-me{align-self:flex-end;background:linear-gradient(135deg,var(--teal),var(--td));color:#07101e;font-weight:500;border-bottom-right-radius:5px}
.bub-them{align-self:flex-start;background:rgba(255,255,255,.06);color:var(--white);border-bottom-left-radius:5px}
.bub-time{font-size:10px;color:var(--muted2);margin-top:3px}

/* Video call */
.vcall{position:fixed;inset:0;background:#050b14;z-index:900;display:flex;flex-direction:column;animation:fadeIn .3s}
.vc-main{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vc-remote{width:100%;height:100%;background:linear-gradient(135deg,#0e2030,#112438);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.vc-self{position:absolute;bottom:16px;right:16px;width:100px;height:140px;background:linear-gradient(135deg,#112438,#1a3450);border-radius:14px;border:2px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;overflow:hidden}
@media(min-width:640px){.vc-self{width:140px;height:190px}}
.vc-bar{padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;gap:14px;justify-content:center;align-items:center;background:rgba(7,16,30,.9);flex-shrink:0}
.vc-btn{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:none;cursor:pointer;transition:all .2s}
.vc-btn:active{transform:scale(.92)}

/* Steps */
.steps{display:flex;gap:5px;margin-bottom:24px}
.step{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.1);transition:background .3s}
.step.on{background:var(--teal)}

/* Milestone row */
.ms{display:flex;align-items:center;gap:11px;padding:12px 13px;background:rgba(255,255,255,.02);border-radius:12px;margin-bottom:8px}
.ms-ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

/* Utility */
.mb0{margin-bottom:0}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.fx1{flex:1}.fsh0{flex-shrink:0}.tc-c{text-align:center}
.txs{font-size:12px}.tsm{font-size:13px}.tmd{font-size:14px}
.cmu{color:var(--muted)}.cte{color:var(--teal)}.cwh{color:var(--white)}
.fw6{font-weight:600}.fw7{font-weight:700}
.mod{background:var(--bg2);border:1px solid var(--border);border-radius:22px 22px 0 0;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .3s ease}
@media(min-width:640px){.mod{border-radius:20px;max-width:540px;max-height:88vh}}
.mod-h{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--bs);flex-shrink:0}
.mod-h h3{flex:1;font-size:17px;font-weight:700;min-width:0}
.mod-x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--white);flex-shrink:0}
.mod-b{padding:18px;overflow-y:auto;flex:1}
.mod-f{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--bs);display:flex;gap:10px;flex-shrink:0;background:var(--bg2)}
.mod-f .btn{flex:1}
.grab{width:40px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:8px auto 0}
@media(min-width:640px){.grab{display:none}}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.3}
.task{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--bs);cursor:pointer;width:100%;text-align:left;color:var(--white);margin-bottom:9px;transition:border-color .2s}
@media(hover:hover){.task:hover{border-color:var(--border)}}
.task:active{transform:scale(.99)}
.ti{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.seg{display:flex;background:rgba(255,255,255,.04);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.lseg{display:inline-flex;background:rgba(255,255,255,.05);border-radius:10px;padding:2px;gap:2px;flex-shrink:0}
.lseg button{padding:5px 9px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted)}
.lseg button.on{background:var(--card2);color:var(--white)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--white);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.stepper{display:flex;align-items:flex-start;margin:4px 0 16px}
.stp{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center;font-size:10.5px;color:var(--muted);font-weight:600;line-height:1.25;padding:0 2px}
.stp::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:rgba(255,255,255,.1)}
.stp:first-child::before{display:none}
.stp.done::before,.stp.cur::before{background:var(--teal)}
.stp b{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card2);border:2px solid rgba(255,255,255,.14);font-size:12px;z-index:1;position:relative;color:var(--muted)}
.stp.done b{background:var(--teal);border-color:var(--teal);color:#07101e}
.stp.cur b{border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 4px rgba(23,212,160,.12)}
.stp.cur{color:var(--white)}
.nb{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:99px;background:var(--err);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;font-style:normal}
.bni{position:relative}
.sbar button{position:relative}
.sbar .nb{position:static;margin-left:auto}
.ibtn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(255,255,255,.05);border:1px solid var(--bs);color:var(--white);flex-shrink:0}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:680px){.qa{grid-template-columns:repeat(4,1fr)}}
.qa button{background:var(--card);border:1px solid var(--bs);border-radius:14px;padding:16px 10px;color:var(--white);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13.5px;font-weight:600;text-align:center;transition:border-color .2s}
@media(hover:hover){.qa button:hover{border-color:var(--border)}}
.qa i{font-style:normal;font-size:26px}
.sec-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.icg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.icg button{padding:11px 4px;border-radius:12px;background:rgba(255,255,255,.04);border:2px solid transparent;color:var(--white);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.icg button.on{border-color:var(--teal);background:rgba(23,212,160,.08)}
.icg i{font-style:normal;font-size:22px}
.hint{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(23,212,160,.06);border:1px solid var(--border);font-size:13px;color:var(--white);line-height:1.5}
.hint.w{background:var(--wbg);border-color:rgba(245,200,66,.25)}
.hint.e{background:var(--ebg);border-color:rgba(240,96,74,.25)}
.hint.p{background:var(--pbg);border-color:rgba(167,139,250,.25)}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--bs);cursor:pointer;width:100%;text-align:left;color:var(--white);background:none}
.lrow:last-child{border-bottom:none}
.pbtn{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;color:var(--white);border-bottom:1px solid var(--bs);font-size:14.5px;font-weight:600}
.pbtn:last-child{border-bottom:none}
.pbtn i{font-style:normal;font-size:19px;width:26px;text-align:center}
.pbtn span.ar{margin-left:auto;color:var(--muted)}
.mcard{border:1px solid var(--bs);border-radius:14px;padding:14px;margin-bottom:10px;background:rgba(255,255,255,.02)}
.mcard.act{border-color:var(--border);background:rgba(23,212,160,.04)}
.qr{display:flex;gap:7px;overflow-x:auto;padding:8px 11px 0;scrollbar-width:none}
.qr::-webkit-scrollbar{display:none}
.qr button{padding:7px 12px;border-radius:99px;font-size:12.5px;background:rgba(23,212,160,.08);border:1px solid var(--border);color:var(--teal);white-space:nowrap;font-weight:600}
.sysmsg{align-self:center;font-size:12px;color:var(--muted);background:rgba(255,255,255,.04);padding:6px 12px;border-radius:99px;text-align:center;max-width:90%}
.chat-wrap{height:calc(100dvh - var(--nav-h) - var(--bnav-h) - 40px)}
@media(min-width:820px){.chat-wrap{height:calc(100vh - var(--nav-h) - 60px);max-height:680px}}
.greet{font-size:clamp(22px,5vw,28px);font-weight:800;margin-bottom:4px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.money-big{font-family:'Sora',sans-serif;font-weight:800;font-size:26px;color:var(--teal)}
</style>

const MODELS=["gemini-2.5-flash","gemini-2.0-flash","gemini-flash-latest"];
async function gemini(key,prompt,json){
  let last=null;
  for(const m of MODELS){
    let r,j;
    try{
      r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text:LANG==="en"?prompt+"\n\nIMPORTANT: write every text of your answer in simple English (not Spanish).":prompt}]}],generationConfig:Object.assign({temperature:.3,maxOutputTokens:2048},json?{responseMimeType:"application/json"}:{})})
      });
      j=await r.json().catch(()=>({}));
    }catch(e){last=new Error("Sin conexión a internet");continue}
    if(!r.ok){
      const msg=j.error?.message||("Error "+r.status);
      if(r.status===400&&/API key/i.test(msg))throw new Error("La clave de Gemini no es válida. Revísala en Perfil.");
      if(r.status===403)throw new Error("La clave de Gemini no tiene permiso. Crea una nueva en aistudio.google.com");
      last=new Error(msg);continue;
    }
    const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
    if(t)return {text:t,model:m};
    last=new Error("La IA no respondió");
  }
  throw last||new Error("No se pudo conectar con Gemini");
}
const snap=n=>[0,25,50,75,100].reduce((a,b)=>Math.abs(b-Number(n))<Math.abs(a-Number(n))?b:a,50);
async function aiVerdict(key,d){
  const prompt=`Eres el árbitro imparcial de GetSponzo, una plataforma de patrocinio donde el pago de la marca queda protegido hasta que se verifica cada entrega.
Debes decidir qué porcentaje del pago de esta entrega se libera AL PATROCINADO (evento/creador). El resto se devuelve a la MARCA.
ENTREGA EN DISPUTA: ${d.title} (monto €${d.amount})
QUIÉN RECLAMA: ${d.openedByName} (${d.openerRole})
MOTIVO: ${d.reason}
RECLAMO: ${d.description}
PRUEBAS DEL RECLAMO: ${d.claimantEvidence||"Sin pruebas adicionales"}
EVIDENCIA ENTREGADA ANTES DE LA DISPUTA: ${d.priorEvidence||"Ninguna"}
DEFENSA DE ${d.againstName}: ${d.defense||"No presentó defensa dentro del plazo de 7 días."}
Solo puedes elegir 0, 25, 50, 75 o 100.
Responde SOLO con este JSON, en español muy simple: {"verdict_pct":NUMERO,"reasoning":["punto 1","punto 2","punto 3","decisión final"]}`;
  const {text,model}=await gemini(key,prompt,true);
  const mm=text.match(/\{[\s\S]*\}/);
  if(!mm)throw new Error("La IA respondió en un formato raro. Intenta de nuevo.");
  const o=JSON.parse(mm[0]);
  return {pct:snap(o.verdict_pct),reasoning:Array.isArray(o.reasoning)?o.reasoning:[String(o.reasoning||"")],model,demo:false};
}
function demoVerdict(d){
  const brandOpened=d.openerRole==="patrocinador";
  const pct=brandOpened?(d.defense?50:25):(d.defense?50:75);
  return {pct,demo:true,model:"demo",reasoning:[
    `${d.openedByName} reclamó: "${d.reason}".`,
    d.defense?`${d.againstName} presentó su defensa, por lo que ambas partes tienen parte de razón.`:`${d.againstName} no presentó defensa dentro de los 7 días.`,
    d.priorEvidence?"Existe evidencia parcial de la entrega.":"No hay evidencia suficiente de que la entrega se haya completado.",
    `Decisión: se libera el ${pct}% al patrocinado y el ${100-pct}% vuelve a la marca.`]};
}

function writeCol(col,arr){
  if(!REAL){save("gs_"+col,arr);return}
  const prev=CACHE[col];CACHE[col]=arr;
  const pm=new Map(prev.map(x=>[x.id,JSON.stringify(x)]));const ids=new Set();
  arr.forEach(x=>{ids.add(x.id);const s=JSON.stringify(x);if(pm.get(x.id)!==s)FS.collection(col).doc(x.id).set(JSON.parse(s)).catch(e=>console.error(e))});
  prev.forEach(x=>{if(!ids.has(x.id))FS.collection(col).doc(x.id).delete().catch(e=>console.error(e))});
}

let unsubs=[];
function stopSync(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];COLS.forEach(c=>CACHE[c]=[])}
function startSync(me){
  stopSync();
  const Q={users:FS.collection("users"),events:FS.collection("events"),
    contracts:FS.collection("contracts").where("parties","array-contains",me),
    chats:FS.collection("chats").where("participants","array-contains",me),
    disputes:FS.collection("disputes").where("parties","array-contains",me),
    reviews:FS.collection("reviews"),
    photos:FS.collection("photos").where("parties","array-contains",me)};
  return new Promise(res=>{
    const pending=new Set(COLS);const done=c=>{if(pending.has(c)){pending.delete(c);if(!pending.size)res()}};
    COLS.forEach(col=>unsubs.push(Q[col].onSnapshot(snap=>{CACHE[col]=snap.docs.map(d=>d.data());done(col);onData()},err=>{console.error(err);done(col)})));
    setTimeout(res,12000);
  });
}
function fbErr(e){
  const c=(e&&e.code)||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return "El correo o la contraseña no son correctos.";
  if(/email-already-in-use/.test(c))return "Ya existe una cuenta con ese correo. Prueba entrando.";
  if(/weak-password/.test(c))return "La contraseña debe tener al menos 6 caracteres.";
  if(/invalid-email/.test(c))return "Ese correo no parece válido.";
  if(/network/.test(c))return "Sin conexión a internet. Revisa tu señal.";
  if(/too-many/.test(c))return "Demasiados intentos. Espera unos minutos.";
  if(/popup-closed|cancelled-popup/.test(c))return "Cerraste la ventana de Google antes de terminar. Intenta de nuevo.";
  if(/unauthorized-domain/.test(c))return "Este dominio no está autorizado en Firebase (Authentication → Configuración → Dominios autorizados).";
  if(/account-exists-with-different-credential/.test(c))return "Ya existe una cuenta con ese correo. Entra con tu correo y contraseña.";
  if(/operation-not-allowed/.test(c)&&e&&/google/i.test(e.message||""))return "El inicio con Google no está activado en Firebase (Authentication → Método de acceso → Google).";
  if(/operation-not-allowed/.test(c))return "El inicio con correo no está activado en Firebase (Authentication → Correo/contraseña).";
  return "Ocurrió un error: "+((e&&e.message)||c);
}

function pushMsg(chatId,msg,toId){
  if(REAL){

const TRC=new Map();
function trCore(c){
  if(!c)return null;
  if(TRC.has(c))return TRC.get(c);
  let r=null;
  if(Object.prototype.hasOwnProperty.call(DICT,c))r=DICT[c];
  else{
    {const m=c.match(/^([^A-Za-zÁÉÍÓÚáéíóúÑñ¿¡“"«(0-9€$]+)([\s\S]+)$/);if(m){const t=trCore(m[2]);if(t!=null)r=m[1]+t}}
    if(r==null)for(const [re,fn] of RULES){const m=c.match(re);if(m){const x=fn(m);if(x!=null){r=x;break}}}
    if(r==null){const m=c.match(/^([\s\S]+?)(\s*(?:→|›|✓|…|:|\.|,|!|\s\(|\(\d*\)?|\(\d+\)))$/);if(m&&m[1].length>1){const t=trCore(m[1]);if(t!=null)r=t+m[2]}}
    if(r==null){for(const sep of [" · "," → ",", "," | "]){if(c.includes(sep)){const ps=c.split(sep);let ch=false;const out=ps.map(p=>{const t=trCore(p.trim());if(t!=null){ch=true;return p.replace(p.trim(),t)}return p});if(ch){r=out.join(sep);break}}}}
  }
  TRC.set(c,r);return r;
}
function T(s){
  if(LANG!=="en"||s==null)return s;s=String(s);
  const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);const core=m[2];
  if(!core||!/[A-Za-zÁÉÍÓÚáéíóúñÑ]/.test(core))return s;
  const t=trCore(core);return t==null?s:m[1]+t+m[3];
}
function trDocHtml(html){
  if(LANG!=="en")return html;
  try{const d=new DOMParser().parseFromString(html,"text/html");
    const w=d.createTreeWalker(d.documentElement,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);
    ns.forEach(n=>{if(n.parentNode&&/^(STYLE|SCRIPT)$/.test(n.parentNode.nodeName))return;const t=T(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t});
    d.documentElement.lang="en";return "<!doctype html>"+d.documentElement.outerHTML}catch(e){return html}
}

(function initI18n(){
  try{document.documentElement.lang=LANG}catch(e){}
  if(LANG!=="en")return;
  const _al=window.alert.bind(window),_cf=window.confirm.bind(window),_pr=window.prompt.bind(window);
  window.alert=m=>_al(T(m));window.confirm=m=>_cf(T(m));window.prompt=(m,d)=>_pr(T(m),d);
  const SKIP=/^(SCRIPT|STYLE|TEXTAREA|INPUT|CODE|PRE)$/;
  const LAST=new WeakMap();
  const doText=n=>{const p=n.parentNode;if(!p||SKIP.test(p.nodeName)||(p.closest&&p.closest("[data-notr]")))return;
    const v=n.nodeValue;if(LAST.get(n)===v)return;const t=T(v);LAST.set(n,t);if(t!==v)n.nodeValue=t};
  const ATTR=["placeholder","title","aria-label"];
  const doEl=el=>{if(el.closest&&el.closest("[data-notr]"))return;ATTR.forEach(a=>{const v=el.getAttribute(a);if(v){const t=T(v);if(t!==v)el.setAttribute(a,t)}})};
  const walk=n=>{if(n.nodeType===3){doText(n);return}if(n.nodeType!==1||/^(SCRIPT|STYLE)$/.test(n.nodeName))return;doEl(n);
    if(n.nodeName==="SELECT"||n.nodeName==="OPTION"||!SKIP.test(n.nodeName))n.childNodes.forEach(walk)};
  const start=()=>{walk(document.body);
    new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")doText(m.target);else if(m.type==="attributes")doEl(m.target);else m.addedNodes.forEach(walk)}})
      .observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTR});};
  if(document.body)start();else document.addEventListener("DOMContentLoaded",start);
})();

/* ══════════ RUT CHILENO ══════════ */
function rutClean(r){return String(r||"").replace(/[^0-9kK]/g,"").toUpperCase()}
function rutValid(r){
  const c=rutClean(r);if(c.length<8||c.length>9)return false;
  const body=c.slice(0,-1),dv=c.slice(-1);let s=0,m=2;
  for(let i=body.length-1;i>=0;i--){s+=Number(body[i])*m;m=m===7?2:m+1}
  const r11=11-(s%11),exp=r11===11?"0":r11===10?"K":String(r11);
  return exp===dv;
}
function rutFormat(r){const c=rutClean(r);if(c.length<2)return c;const b=c.slice(0,-1).replace(/\B(?=(\d{3})+(?!\d))/g,".");return b+"-"+c.slice(-1)}

function compressImage(file,maxW=900,q=0.6){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej(new Error("El archivo no es una imagen"));
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{
      const sc=Math.min(1,maxW/Math.max(img.width,img.height));const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
      let d=cv.toDataURL("image/jpeg",q);if(d.length>380000)d=cv.toDataURL("image/jpeg",0.4);
      if(d.length>380000)return rej(new Error("La imagen es muy grande"));res(d)};img.onerror=()=>rej(new Error("No se pudo leer la imagen"));img.src=fr.result};
    fr.onerror=()=>rej(new Error("No se pudo leer el archivo"));fr.readAsDataURL(file);
  });
}

function Auth({mode,setMode,onLogin,onBack,onDemo}){
  const [f,setF]=useState({email:"",pass:"",name:"",company:""});
  const [role,setRole]=useState(null);
  const [step,setStep]=useState(0);
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const [terms,setTerms]=useState(false),[showTerms,setShowTerms]=useState(false),[info,setInfo]=useState("");
  const forgot=async()=>{
    setErr("");setInfo("");
    if(!/^\S+@\S+\.\S+$/.test(f.email.trim()))return setErr("Escribe tu correo arriba y vuelve a tocar “¿Olvidaste tu contraseña?”.");
    if(!REAL)return setInfo("En la demo no se envían correos. En la plataforma real te llegará un enlace para crear una contraseña nueva.");
    try{await AUTH.sendPasswordResetEmail(f.email.trim());setInfo("Listo. Si ese correo tiene cuenta, te llegará un enlace para crear una contraseña nueva. Revisa también la carpeta de spam.")}catch(e){setErr(fbErr(e))}
  };
  const set=(k,v)=>{setF(p=>({...p,[k]:v}));setErr("")};
  const login=async()=>{
    if(REAL){
      if(!f.email.trim()||!f.pass)return setErr("Escribe tu correo y tu contraseña.");
      setBusy(true);try{await AUTH.signInWithEmailAndPassword(f.email.trim(),f.pass)}catch(e){setErr(fbErr(e));setBusy(false)}
      return;
    }
    const u=DB.users().find(x=>x.email.toLowerCase()===f.email.trim().toLowerCase());
    if(!u)return setErr("No encontramos una cuenta con ese correo. ¿Quieres crear una?");
    if(u.pass!==f.pass)return setErr("La contraseña no es correcta.");
    onLogin(u);
  };
  const register=async()=>{
    if(!f.name.trim())return setErr("Escribe tu nombre.");
    if(role==="patrocinador"&&!f.company.trim())return setErr("Escribe el nombre de tu marca o empresa.");
    if(!/^\S+@\S+\.\S+$/.test(f.email.trim()))return setErr("Ese correo no parece válido.");
    if(f.pass.length<8||!/\d/.test(f.pass)||!/[a-zA-Z]/.test(f.pass))return setErr("La contraseña debe tener al menos 8 caracteres, con letras y números.");
    if(!terms)return setErr("Debes aceptar los términos y la política de privacidad.");
    if(REAL){
      setBusy(true);PENDING={name:f.name.trim(),role,company:f.company.trim(),cur:"CLP"};
      try{const cr=await AUTH.createUserWithEmailAndPassword(f.email.trim(),f.pass);try{await cr.user.sendEmailVerification()}catch(e){}}catch(e){PENDING=null;setErr(fbErr(e));setBusy(false)}
      return;
    }
    const users=DB.users();
    if(users.some(x=>x.email.toLowerCase()===f.email.trim().toLowerCase()))return setErr("Ya existe una cuenta con ese correo. Prueba entrando.");
    const u={id:uid("u"),name:f.name.trim(),email:f.email.trim(),pass:f.pass,role,company:f.company.trim(),cur:"CLP",bio:"",loc:"",created:new Date().toISOString()};
    DB.setUsers([...users,u]);onLogin(u);
  };
  const demo=id=>onDemo(id);
  const tabBtn=(m,l)=><button className={mode===m?"on":""} onClick={()=>{setMode(m);setErr("");setStep(0)}}>{l}</button>;
  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <nav className="tnav"><div className="container"><div className="tni">
        <button onClick={onBack} style={{display:"flex",alignItems:"center",gap:9,color:"var(--white)"}}><Logo size={26} glow={false}/><Word s={17}/></button>
        <div style={{display:"flex",gap:7,alignItems:"center"}}><LangToggle/><button className="btn btn-g btn-sm" onClick={onBack}>← Volver</button></div>
      </div></div></nav>
      <div className="container" style={{maxWidth:460,padding:"26px 16px 40px",flex:1}}>
        <div className="seg">{tabBtn("login","Entrar")}{tabBtn("register","Crear cuenta")}</div>

        {mode==="login"&&<div className="fu">
          <h2 style={{fontSize:24,fontWeight:800,marginBottom:4}}>¡Hola de nuevo! 👋</h2>
          <p className="cmu tmd mb20">Entra con tu correo y contraseña.</p>
          <Field label="Correo"><input className="inp" type="email" autoComplete="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="tu@correo.com"/></Field>
          <Field label="Contraseña"><input className="inp" type="password" autoComplete="current-password" value={f.pass} onChange={e=>set("pass",e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="••••••"/></Field>
          {err&&<div className="hint e mb12">⚠️ {err}</div>}
          {info&&<div className="hint mb12">✉️ {info}</div>}
          <button className="tsm cte mb12" style={{textDecoration:"underline"}} onClick={forgot}>¿Olvidaste tu contraseña?</button>
          <GoogleBtn onError={setErr}/>
          <OrLine/>
          <button className="btn btn-p" style={{width:"100%"}} disabled={busy} onClick={login}>{busy?"Entrando…":"Entrar"}</button>
          <div className="card mt20" style={{background:"rgba(245,200,66,.05)",borderColor:"rgba(245,200,66,.3)"}}>
            <div className="fw7 mb8">👀 ¿Solo quieres mirar? Prueba la demo sin cuenta</div>
            <div className="tsm cmu mb12" style={{lineHeight:1.5}}>Es un <b className="cwh">mundo de prueba</b> con datos de ejemplo. Nada de lo que hagas ahí afecta la plataforma real. Elige cómo quieres verla:</div>
            <div style={{display:"grid",gap:8}}>
              {[["u1","🎯","Soy un evento","Cristóbal · Club Deportivo Andes"],["u2","🏢","Soy una marca","María · Marca Deportiva Chile"],["u3","💼","Soy inversor","Pablo · VC Chile Capital"]].map(([id,i,t,s])=>(
                <button key={id} className="task" style={{marginBottom:0}} onClick={()=>demo(id)}>
                  <div className="ti" style={{background:"rgba(255,255,255,.05)"}}>{i}</div>
                  <div style={{flex:1,minWidth:0}}><div className="fw7 tmd">{t}</div><div className="txs cmu ellip">{s}</div></div><span className="cte">→</span>
                </button>))}
            </div>
          </div>
        </div>}

        {mode==="register"&&step===0&&<div className="fu">
          <div className="steps"><div className="step on"/><div className="step"/></div>
          <h2 style={{fontSize:24,fontWeight:800,marginBottom:4}}>¿Quién eres?</h2>
          <p className="cmu tmd mb20">Elige una opción. Así te mostramos solo lo que necesitas.</p>
          {Object.entries(ROLE).map(([k,r])=>(
            <button key={k} className={"tc"+(role===k?" on":"")} style={{width:"100%",display:"flex",gap:14,alignItems:"center",marginBottom:10,textAlign:"left",color:"var(--white)"}} onClick={()=>{setRole(k);setErr("")}}>
              <span style={{fontSize:30}}>{r.i}</span>
              <div style={{flex:1}}><div className="fw7" style={{fontSize:16}}>{r.l}</div><div className="tsm cmu">{k==="patrocinado"?"Tengo un evento, club o soy creador y busco marcas":k==="patrocinador"?"Soy una marca y quiero patrocinar":"Quiero conocer la oportunidad de inversión"}</div></div>
              <span style={{width:22,height:22,borderRadius:"50%",border:"2px solid "+(role===k?"var(--teal)":"rgba(255,255,255,.2)"),background:role===k?"var(--teal)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"#07101e",fontSize:12,fontWeight:800}}>{role===k?"✓":""}</span>
            </button>))}

          <Field label="Correo"><input className="inp" type="email" autoComplete="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="tu@correo.com"/></Field>
          <Field label="Crea una contraseña" hint="Mínimo 8 caracteres, con letras y números"><input className="inp" type="password" autoComplete="new-password" value={f.pass} onChange={e=>set("pass",e.target.value)} onKeyDown={e=>e.key==="Enter"&&register()} placeholder="••••••"/></Field>
          <label className="row mb12" style={{cursor:"pointer",gap:10,alignItems:"flex-start"}}><input type="checkbox" checked={terms} onChange={e=>{setTerms(e.target.checked);setErr("")}} style={{width:20,height:20,accentColor:"#17d4a0",appearance:"auto",flexShrink:0,marginTop:2}}/><span className="tsm">Acepto los <button className="cte" style={{textDecoration:"underline"}} onClick={e=>{e.preventDefault();setShowTerms(true)}}>términos y la política de privacidad</button>, incluida la cláusula de arbitraje con IA.</span></label>
          {err&&<div className="hint e mb12">⚠️ {err}</div>}
          <button className="btn btn-p" style={{width:"100%"}} disabled={busy} onClick={register}>{busy?"Creando tu cuenta…":"Crear mi cuenta ✓"}</button>

        </div>}

      </div>
    </div>
  );
}

function firstSteps(u){
  const chats=DB.chats().filter(c=>c.participants.includes(u.id));
  const wrote=chats.some(c=>c.messages.some(m=>m.from===u.id));
  const deals=myContracts(u.id).length>0;
  if(u.role==="patrocinado")return [
    {t:"Completa tu perfil",s:"Cuéntale a las marcas quién eres",ok:!!(u.bio&&u.loc),go:["perfil",{edit:1}]},
    {t:"Crea tu primer evento",s:"Lo que quieres que patrocinen",ok:DB.events().some(e=>e.ownerId===u.id),go:["eventos",{nuevo:1}]},
    {t:"Escríbele a una marca",s:"Preséntate y propón una idea",ok:wrote,go:["marcas",{}]},
    {t:"Cierra tu primer acuerdo",s:"Con entregas y pago protegido",ok:deals,go:["nuevo",{}]},
  ];
  return [
    {t:"Completa tu perfil",s:"Tu marca, sector y presupuesto",ok:!!(u.company&&u.bio),go:["perfil",{edit:1}]},
    {t:"Explora eventos",s:"Encuentra audiencias para tu marca",ok:DB.flag("explored_"+u.id),go:["buscar",{}]},
    {t:"Escríbele a un organizador",s:"Haz preguntas o agenda una videollamada",ok:wrote,go:["buscar",{}]},
    {t:"Crea tu primer acuerdo",s:"Tu dinero queda protegido",ok:deals,go:["nuevo",{}]},
  ];
}

      <div className="mt12">{steps.map((s,i)=>(

          <span style={{width:26,height:26,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,flexShrink:0,background:s.ok?"var(--teal)":"transparent",border:s.ok?"none":"2px solid rgba(255,255,255,.2)",color:"#07101e"}}>{s.ok?"✓":""}</span>
          <div style={{flex:1,minWidth:0}}><div className="tmd fw6" style={{textDecoration:s.ok?"line-through":"none",color:s.ok?"var(--muted)":"var(--white)"}}>{s.t}</div>{!s.ok&&<div className="txs cmu">{s.s}</div>}</div>
          {!s.ok&&<span className="cte fw7 tsm">Hacer →</span>}

/* ══════════ MIS EVENTOS (patrocinado) ══════════ */
const BUDGETS=[[1000,3000],[3000,6000],[6000,12000],[12000,25000]];
function EventSheet({ev,onClose,onSaved}){
  const {user,toast,apiKey}=useApp();
  const [shot,setShot]=useState([]),[aiBusy,setAiBusy]=useState(false);
  const [f,setF]=useState(()=>{const uc=user.cur||"EUR";const b={name:"",cat:"Deporte",icon:"⚽",loc:user.loc||"",date:"",cur:uc,cover:"",budgetMin:BUDGETS_BY[uc][1][0],budgetMax:BUDGETS_BY[uc][1][1],audience:"",desc:"",social:{ig:"",tt:"",web:"",attendees:""},confirm:{date:false,venue:false,happens:false},packages:[]};return ev?{...b,...ev,social:{...b.social,...(ev.social||{})},confirm:{...b.confirm,...(ev.confirm||{})},packages:ev.packages||[]}:b});
  const [err,setErr]=useState("");
  const set=(k,v)=>{setF(p=>({...p,[k]:v}));setErr("")};
  const setS=(k,v)=>setF(p=>({...p,social:{...p.social,[k]:v}}));
  const setP=(i,k,v)=>setF(p=>({...p,packages:p.packages.map((x,j)=>j===i?{...x,[k]:v}:x)}));
  const r100=n=>Math.max(100,Math.round(n/100)*100);
  const suggest=()=>set("packages",[{name:"Bronce",price:r100(f.budgetMin*0.5),items:["Logo en redes sociales del evento","2 posts dedicados"]},{name:"Plata",price:r100((f.budgetMin+f.budgetMax)/2),items:["Logo en el material del evento","Stand o espacio de marca","5 posts dedicados"]},{name:"Oro",price:r100(f.budgetMax),items:["Marca principal del evento","Stand premium","10 posts dedicados","Informe de resultados"]}]);
  const aiPk=async()=>{
    if(!apiKey)return suggest();
    setAiBusy(true);
    try{
      const {text}=await gemini(apiKey,`Eres experto en patrocinio. Propón 3 paquetes de patrocinio (Bronce, Plata, Oro) para este evento. Evento: ${f.name||"sin nombre"}, tipo ${f.cat}, en ${f.loc}. Público: ${f.audience||"no indicado"}. Presupuesto buscado: ${f.budgetMin} a ${f.budgetMax} ${f.cur}. Precios en ${f.cur}, redondeados. Responde SOLO JSON: {"packages":[{"name":"Bronce","price":NUMERO,"items":["...","..."]}]} con 2 a 4 items cortos en español por paquete.`,true);
      const o=JSON.parse((text.match(/\{[\s\S]*\}/)||["{}"])[0]);
      if(Array.isArray(o.packages)&&o.packages.length){set("packages",o.packages.slice(0,4).map(p=>({name:String(p.name||""),price:Math.round(Number(p.price)||0),items:(p.items||[]).map(String).slice(0,6)})));toast("Paquetes sugeridos por IA","✨","Revísalos y ajústalos")}else suggest();
    }catch(e){suggest();toast("Usamos paquetes sugeridos","✨")}
    setAiBusy(false);
  };
  const saveEv=()=>{
    const bad=m=>{setErr(m);toast(m,"⚠️")};
    if(!f.name.trim())return bad("Ponle un nombre a tu evento.");
    if(!f.loc.trim())return bad("Escribe dónde es (ciudad u 'Online').");
    const pk=f.packages.map(p=>({name:(p.name||"").trim(),price:Number(p.price)||0,items:(p.items||[]).map(x=>x.trim()).filter(Boolean)})).filter(p=>p.name||p.items.length);
    if(pk.some(p=>!p.name||!p.price||!p.items.length))return bad("Cada paquete necesita nombre, precio y al menos una cosa incluida.");
    f.packages=pk;
    const all=DB.events(),eid=ev?ev.id:uid("e");
    if(shot.length){f.audPhotoId=savePhoto({kind:"audience",data:shot[0],parties:[user.id],eventId:eid});f.audReq="pending"}
    if(ev){DB.setEvents(all.map(e=>e.id===ev.id?{...e,...f}:e));toast("Evento actualizado","✏️")}
    else{DB.setEvents([...all,{...f,id:eid,ownerId:user.id,badge:"new",created:new Date().toISOString()}]);toast("¡Evento creado!","🎉","Ya aparece para las marcas")}
    onSaved();
  };
  return <Sheet title={ev?"Editar evento":"Nuevo evento"} icon="🎪" onClose={onClose} footer={<><button className="btn btn-g" onClick={onClose}>Cancelar</button><button className="btn btn-p" onClick={saveEv}>{ev?"Guardar":"Crear evento"}</button></>}>
    <Field label="1. Nombre del evento"><input className="inp" value={f.name} onChange={e=>set("name",e.target.value)} placeholder="Ej: Corrida Familiar Ñuñoa"/></Field>
    <Field label="2. ¿De qué tipo es?"><div className="icg">{CATS.map(c=><button key={c.v} className={f.cat===c.v?"on":""} onClick={()=>{set("cat",c.v);set("icon",c.i)}}><i>{c.i}</i>{c.v}</button>)}</div></Field>
    <div className="g2" style={{gap:10}}>
      <Field label="3. ¿Dónde?"><input className="inp" value={f.loc} onChange={e=>set("loc",e.target.value)} placeholder="Ciudad, país u Online"/></Field>
      <Field label="4. ¿Cuándo? (opcional)"><input className="inp" type="date" value={f.date||""} onChange={e=>set("date",e.target.value)} style={{colorScheme:"dark"}}/></Field>
    </div>
    <Field label="5. ¿Cuánto buscas de patrocinio?">
      <div className="seg" style={{maxWidth:380}}>{CURS.map(([k,l])=><button key={k} className={f.cur===k?"on":""} onClick={()=>setF(p=>({...p,cur:k,budgetMin:BUDGETS_BY[k][1][0],budgetMax:BUDGETS_BY[k][1][1],packages:p.packages.map(x=>({...x,price:Math.round(conv(x.price,p.cur,k)/100)*100}))}))}>{l}</button>)}</div>

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function openDoc(c,kind){
  const $m=n=>money(n,c.cur);
  const fee=c.feePct||FEE,feeAmt=Math.round(c.amount*fee/100),sg=c.signed||{};
  const dt=x=>x?new Date(x).toLocaleString(LOC,{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"}):"Pendiente";
  const ds=DB.disputes().filter(d=>d.contractId===c.id);
  const rows=c.milestones.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.title)}</td><td>${esc(m.due?fdate(m.due):"—")}</td><td style="text-align:right">${$m(m.amount)}</td>${kind==="report"?`<td>${esc(MS[m.status].l)}${m.status==="resolved"?" ("+m.paidPct+"%)":""}</td><td style="text-align:right">${$m(msPaid(m))}</td><td>${esc(m.evidence||"—")}</td>`:""}</tr>`).join("");
  const head=kind==="report"?"<th>#</th><th>Entrega</th><th>Fecha límite</th><th>Monto</th><th>Estado</th><th>Pagado</th><th>Evidencia</th>":"<th>#</th><th>Entrega</th><th>Fecha límite</th><th>Monto</th>";
  const revs=DB.reviews().filter(r=>r.contractId===c.id);
  const body=kind==="report"?`
<h1>Informe de resultados</h1><p class="sub">${esc(c.eventName)} · generado el ${dt(new Date())}</p>
<div class="kpis"><div><b>${$m(c.amount)}</b><span>Monto del acuerdo</span></div><div><b>${$m(cPaid(c))}</b><span>Pagado al evento</span></div><div><b>${c.milestones.filter(msDone).length} de ${c.milestones.length}</b><span>Entregas cumplidas</span></div><div><b>${ds.length}</b><span>Disputas</span></div></div>
<h2>Partes</h2><p>Marca: <b>${esc(c.sponsorName)}</b> · Evento: <b>${esc(c.sponsoredName)}</b></p>
<h2>Detalle de entregas</h2><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>
${ds.length?`<h2>Disputas</h2>${ds.map(d=>`<p><b>${esc(d.title)}</b>: ${esc(d.reason)}. ${d.verdict?`Decisión IA: ${d.verdict.pct}% al evento.`:"En curso."}</p>`).join("")}`:""}
${revs.length?`<h2>Reseñas</h2>${revs.map(r=>`<p>${"★".repeat(r.stars)}${"☆".repeat(5-r.stars)} — ${esc(r.text||"")} <i>(${esc(dispName(userById(r.fromId)))})</i></p>`).join("")}`:""}`:`
<h1>Acuerdo de patrocinio</h1><p class="sub">N° ${esc(c.id)} · creado el ${dt(c.created)}</p>
<h2>1. Partes</h2><p><b>Patrocinador:</b> ${esc(c.sponsorName)}.<br><b>Patrocinado:</b> ${esc(c.sponsoredName)}, organizador de “${esc(c.eventName)}”.</p>
<h2>2. Objeto</h2><p>El Patrocinador apoya económicamente “${esc(c.eventName)}” y el Patrocinado se compromete a cumplir las entregas indicadas en la cláusula 3.</p>
<h2>3. Entregas y pagos</h2><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody><tfoot><tr><td></td><td><b>Total</b></td><td></td><td style="text-align:right"><b>${$m(c.amount)}</b></td></tr></tfoot></table>
<h2>4. Pago protegido</h2><p>${c.funded===false?"Estado: pendiente de depósito.":"Estado: depositado"+(c.fundedAt?" el "+dt(c.fundedAt):"")+"."} El Patrocinador deposita el monto total en GetSponzo. Cada pago se libera al Patrocinado solo cuando el Patrocinador aprueba la evidencia de la entrega correspondiente.</p>
<h2>5. Comisión</h2><p>GetSponzo cobra una comisión de ${fee}% (${$m(feeAmt)}), pagada por el Patrocinador además del monto del acuerdo. El Patrocinado recibe el 100% de cada entrega aprobada.</p>
${c.aiClause?`<h2>6. Resolución de disputas con IA</h2><p>Si una parte no está conforme con una entrega, puede abrir una disputa en GetSponzo. La otra parte tiene 7 días corridos para presentar su defensa. Vencido ese plazo, un árbitro de inteligencia artificial analiza las pruebas de ambas partes y decide qué porcentaje del pago de esa entrega se libera al Patrocinado: 0%, 25%, 50%, 75% o 100%. Las partes aceptan esta decisión como definitiva para esa entrega.</p>`:""}
<h2>${c.aiClause?7:6}. Datos de contacto</h2><p>Las partes se comunican a través de GetSponzo. Compartir datos de contacto para cerrar el acuerdo fuera de la plataforma deja sin efecto el pago protegido.</p>

function DealsView(){

  if(route.did)return <DisputeDetail id={route.did}/>;
  if(route.cid)return <DealDetail id={route.cid}/>;
  return <DealsList/>;

function DealsList(){
  const {user,go,route}=useApp();
  const [f,setF]=useState(route.f||"todos");
  const all=myContracts(user.id);
  const ds=DB.disputes().filter(d=>d.status==="open"&&(d.openedById===user.id||d.againstId===user.id));
  const list=all.filter(c=>f==="todos"||(f==="firmar"&&cStatus(c)==="pending")||(f==="activos"&&cStatus(c)==="active")||(f==="disputa"&&cStatus(c)==="disputed")||(f==="terminados"&&(cStatus(c)==="done"||cStatus(c)==="rejected")));
  const cnt=k=>all.filter(c=>cStatus(c)===k).length;
  return <div>
    <Head title="Mis acuerdos" sub="Cada acuerdo se paga por entregas" right={<button className="btn btn-p btn-sm" onClick={()=>go("nuevo",{})}>➕ Nuevo</button>}/>
    {ds.map(d=><button key={d.id} className="task" style={{borderColor:"rgba(240,96,74,.3)"}} onClick={()=>go("acuerdos",{did:d.id})}>
      <div className="ti" style={{background:"var(--ebg)"}}>⚖️</div>
      <div style={{flex:1,minWidth:0}}><div className="fw7 tmd">Disputa abierta</div><div className="tsm cmu ellip">{d.title} · {d.defenseSent||daysLeft(d)<=0?"lista para la IA":`quedan ${daysLeft(d)} días`}</div></div>
      <span className="fw7" style={{color:"var(--err)",fontSize:20}}>›</span></button>)}
    <div className="seg">{[["todos","Todos",all.length],["firmar","Por firmar",cnt("pending")],["activos","Activos",cnt("active")],["disputa","En disputa",cnt("disputed")],["terminados","Terminados",cnt("done")+cnt("rejected")]].map(([k,l,n])=><button key={k} className={f===k?"on":""} onClick={()=>setF(k)}>{l} ({n})</button>)}</div>
    {all.length===0?<Empty icon="🤝" title="Aún no tienes acuerdos" text={user.role==="patrocinador"?"Busca un evento que te guste y propón un acuerdo. Tu dinero queda protegido.":"Cuando cierres un acuerdo con una marca aparecerá aquí."} action="➕ Crear acuerdo" onAction={()=>go("nuevo",{})}/>
    :list.length===0?<div className="hint">No tienes acuerdos en esta sección.</div>
    :<div style={{display:"grid",gap:10}}>{list.map(c=>{
      const isS=c.sponsorId===user.id,ns=nextStep(c,user),paid=cPaid(c);
      return <div key={c.id} className="card card-i" onClick={()=>go("acuerdos",{cid:c.id})} style={ns.me?{borderColor:"var(--border)"}:{}}>
        <div style={{display:"flex",justifyContent:"space-between",gap:10,marginBottom:8}}>
          <div style={{minWidth:0}}><div className="fw7" style={{fontSize:15.5}}>{c.eventName}</div><div className="txs cmu">{isS?"Con "+c.sponsoredName:"Con "+c.sponsorName}</div></div>

        </div>

  const updC=patch=>DB.setContracts(DB.contracts().map(x=>x.id!==c.id?x:{...x,...patch}));
  const sign=()=>confirm({title:"¿Firmar este acuerdo?",text:`Aceptas ${c.milestones.length} entrega${c.milestones.length>1?"s":""} por un total de ${$m(c.amount)}${c.aiClause?" y la cláusula de arbitraje con IA":""}. Desde ahora el acuerdo queda activo.`,ok:"✍️ Sí, firmar",onOk:()=>{
    updC({status:"active",signed:{...(c.signed||{}),[user.id]:new Date().toISOString()}});sysMsg(user.id,otherId,`✍️ ${dispName(user)} firmó el acuerdo de “${c.eventName}”. ¡Está activo!`,c.eventName);toast("¡Acuerdo firmado!","✍️","Ya está activo");bump()}});
  const reject=()=>confirm({title:"¿Rechazar la propuesta?",text:"La otra parte verá que la rechazaste. Pueden conversar por chat y hacer una nueva propuesta.",ok:"Rechazar",danger:true,onOk:()=>{
    updC({status:"rejected",rejectedBy:user.id});sysMsg(user.id,otherId,`✖ ${dispName(user)} rechazó la propuesta para “${c.eventName}”. Conversemos para ajustarla.`,c.eventName);toast("Propuesta rechazada","✖");bump()}});
  const myRev=DB.reviews().find(r=>r.id===c.id+"_"+user.id);
  const sendRev=()=>{if(!rv.stars){toast("Elige de 1 a 5 estrellas","⭐");return}
    DB.setReviews([...DB.reviews(),{id:c.id+"_"+user.id,contractId:c.id,fromId:user.id,toId:otherId,stars:rv.stars,text:rv.text.trim().slice(0,400),ts:new Date().toISOString()}]);toast("¡Gracias por tu reseña!","⭐");bump()};
  return <div>
    <Back onClick={()=>go("acuerdos",{})} label="Mis acuerdos"/>

        <div className="fw7 mb8">✍️ {isS?c.sponsoredName:c.sponsorName} te envió esta propuesta</div>
        <div className="tsm cmu mb12" style={{lineHeight:1.5}}>Revisa las entregas y montos de abajo. Si estás de acuerdo, fírmala y queda activa. Si no, recházala y conversen por chat.</div>

        <button className="btn btn-p" style={{width:"100%"}} onClick={deposit}>💳 Depositar {$m(c.amount+Math.round(c.amount*(c.feePct||FEE)/100))}</button>
        <div className="txs cmu mt8">Modo piloto: todavía no se cobra dinero real.</div>
      </div>:<div className="hint w mb12">⏳ <div><b>Acuerdo firmado.</b> Esperando que {c.sponsorName} deposite el pago protegido. Cuando lo haga, podrás empezar las entregas.</div></div>)}
    {st==="rejected"&&<div className="hint e mb12">✖ <div>Esta propuesta fue rechazada. Conversen por chat y creen una nueva si llegan a acuerdo.</div></div>}
    {st==="done"&&(myRev?<div className="hint mb12">⭐ <div>Calificaste a {isS?c.sponsoredName:c.sponsorName} con {myRev.stars} estrella{myRev.stars>1?"s":""}. ¡Gracias!</div></div>
      :<div className="card mb12" style={{borderColor:"rgba(245,200,66,.4)"}}>
        <div className="fw7 mb8">⭐ ¿Cómo te fue con {isS?c.sponsoredName:c.sponsorName}?</div>

function EvidenceSheet({c,m,onClose}){
  const $m=n=>money(n,c.cur);
  const {user,toast,bump}=useApp();
  const [txt,setTxt]=useState(""),[pics,setPics]=useState([]);
  if(!m)return null;
  const send=()=>{
    if(!txt.trim()&&!pics.length){toast("Describe lo que hiciste o adjunta una foto","⚠️");return}
    const photoIds=pics.map(d=>savePhoto({kind:"evidence",data:d,parties:[c.sponsorId,c.sponsoredId],contractId:c.id,milestoneId:m.id}));
    DB.setContracts(DB.contracts().map(x=>x.id!==c.id?x:{...x,milestones:x.milestones.map(y=>y.id===m.id?{...y,status:"submitted",evidence:txt.trim()||"Fotos adjuntas",photoIds,submittedAt:new Date().toISOString()}:y)}));
    sysMsg(user.id,c.sponsorId,`📤 ${first(user.name)} subió la evidencia de “${m.title}”. ¡Revísala!`,c.eventName);
    toast("¡Evidencia enviada!","📤","La marca la revisará y aprobará el pago");onClose();bump();
  };
  return <Sheet title="Subir evidencia" icon="📤" onClose={onClose} footer={<><button className="btn btn-g" onClick={onClose}>Cancelar</button><button className="btn btn-p" onClick={send}>Enviar a la marca</button></>}>
    <div className="mcard act"><div className="fw7 tmd">{m.title}</div><div className="txs cmu">Al aprobarse recibes {$m(m.amount)}</div></div>
    <Field label="1. Cuenta qué hiciste" hint="Ej: Se instaló el logo en las 200 camisetas del equipo."><textarea className="inp" value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Describe la entrega…"/></Field>
    <Field label="2. Adjunta fotos o capturas (recomendado)"><PhotoPicker max={3} value={pics} onChange={setPics}/></Field>
    <div className="hint">💡 Mientras más clara la evidencia, más rápido te pagan y mejor queda tu reputación.</div>
  </Sheet>;
}

const REASONS={patrocinador:["No se entregó","Entrega incompleta","Fuera de plazo","No es lo acordado"],patrocinado:["La marca no responde","La marca no aprueba sin motivo","Me piden algo extra","Otro"]};
function OpenDisputeSheet({c,m,onClose}){
  const $m=n=>money(n,c.cur);
  const {user,toast,bump,go}=useApp();
  const [reason,setReason]=useState(""),[desc,setDesc]=useState(""),[evi,setEvi]=useState("");
  const isS=c.sponsorId===user.id,againstId=isS?c.sponsoredId:c.sponsorId;
  const open=()=>{
    if(!reason){toast("Elige el motivo","⚠️");return}
    if(!desc.trim()){toast("Explica brevemente qué pasó","⚠️");return}
    const d={id:uid("d"),parties:[user.id,againstId],contractId:c.id,milestoneId:m.id,title:m.title,amount:m.amount,openedById:user.id,openedByName:isS?c.sponsorName:c.sponsoredName,openerRole:user.role,againstId,againstName:isS?c.sponsoredName:c.sponsorName,
      cur:c.cur,reason,description:desc.trim(),claimantEvidence:evi.trim(),priorEvidence:m.evidence||"",defense:"",defenseSent:false,status:"open",created:new Date().toISOString(),deadline:new Date(Date.now()+7*DAY).toISOString()};
    DB.setDisputes([...DB.disputes(),d]);
    DB.setContracts(DB.contracts().map(x=>x.id!==c.id?x:{...x,milestones:x.milestones.map(y=>y.id===m.id?{...y,status:"disputed"}:y)}));
    sysMsg(user.id,againstId,`⚖️ Se abrió una disputa por “${m.title}”. Tienes 7 días para responder.`,c.eventName);
    toast("Disputa abierta","⚖️","La otra parte tiene 7 días para responder");onClose();go("acuerdos",{did:d.id});bump();
  };
  return <Sheet title="Abrir una disputa" icon="⚖️" onClose={onClose} footer={<><button className="btn btn-g" onClick={onClose}>Cancelar</button><button className="btn btn-d" onClick={open}>Abrir disputa</button></>}>
    <div className="hint w mb16">💡 <div>Antes de abrir una disputa, intenta conversarlo por chat. Si no se resuelve, la otra parte tendrá <b>7 días</b> para responder y después <b>la IA decide</b>.</div></div>
    <div className="mcard"><div className="fw7 tmd">{m.title}</div><div className="txs cmu">{$m(m.amount)} en juego</div></div>
    <Field label="1. ¿Cuál es el problema?"><div className="chips" style={{flexWrap:"wrap"}}>{REASONS[user.role].map(r=><button key={r} className={"chip"+(reason===r?" on":"")} onClick={()=>setReason(r)}>{r}</button>)}</div></Field>
    <Field label="2. Explica qué pasó"><textarea className="inp" value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Cuenta los hechos de forma simple…"/></Field>
    <Field label="3. ¿Tienes pruebas? (opcional)"><textarea className="inp" style={{minHeight:60}} value={evi} onChange={e=>setEvi(e.target.value)} placeholder="Ej: fotos del 16 de marzo, capturas de mensajes…"/></Field>
  </Sheet>;
}

function DisputeDetail({id}){
  const {user,go,toast,bump,apiKey,confirm}=useApp();
  const d=DB.disputes().find(x=>x.id===id);
  const $m=n=>money(n,d?(d.cur||curOf(DB.contracts().find(x=>x.id===d.contractId))):undefined);
  const [def,setDef]=useState("");
  const [loading,setLoading]=useState(false),[err,setErr]=useState("");
  const [aiSum,setAiSum]=useState(""),[sumBusy,setSumBusy]=useState(false);
  if(!d)return <div><Back onClick={()=>go("acuerdos",{})}/><Empty icon="🤷" title="No encontramos esta disputa" text=""/></div>;
  const iAmAgainst=d.againstId===user.id,iOpened=d.openedById===user.id;
  const left=daysLeft(d),ready=d.defenseSent||left<=0;
  const cur=d.status==="executed"?4:ready?2:1;
  const upd=p=>DB.setDisputes(DB.disputes().map(x=>x.id===d.id?{...x,...p}:x));
  const sendDef=()=>{
    if(!def.trim()){toast("Escribe tu defensa","⚠️");return}
    upd({defense:def.trim(),defenseSent:true,defenseAt:new Date().toISOString()});
    sysMsg(user.id,d.openedById,`🛡️ ${first(user.name)} envió su defensa en la disputa “${d.title}”.`);
    toast("Defensa enviada","🛡️","Ahora la IA puede decidir");bump();
  };
  const run=async()=>{
    setErr("");setLoading(true);
    let v;
    try{v=apiKey?await aiVerdict(apiKey,d):demoVerdict(d)}
    catch(e){setErr(e.message+" — Usamos el modo demo para mostrarte el resultado.");v=demoVerdict(d)}
    await new Promise(r=>setTimeout(r,apiKey?200:1600));
    upd({status:"executed",verdict:v,resolvedAt:new Date().toISOString()});
    DB.setContracts(DB.contracts().map(x=>x.id!==d.contractId?x:{...x,milestones:x.milestones.map(y=>y.id===d.milestoneId?{...y,status:"resolved",paidPct:v.pct}:y)}));
    sysMsg(user.id,user.id===d.openedById?d.againstId:d.openedById,`🤖 La IA resolvió la disputa “${d.title}”: ${v.pct}% para el patrocinado.`);
    setLoading(false);toast("La IA tomó una decisión","🤖",`${v.pct}% al patrocinado`);bump();
  };
  const skip=()=>confirm({title:"Saltar la espera (solo demo)",text:"En la vida real hay que esperar 7 días. Esto es solo para mostrar cómo funciona.",ok:"Saltar espera",onOk:()=>{upd({deadline:new Date(Date.now()-1000).toISOString()});bump()}});
  const v=d.verdict;
  return <div>
    <Back onClick={()=>go("acuerdos",{cid:d.contractId})} label="Volver al acuerdo"/>
    <div className="card mb12" style={{borderColor:"rgba(240,96,74,.3)"}}>
      <div className="txs fw7 mb8" style={{color:"var(--err)"}}>⚖️ DISPUTA</div>
      <div style={{fontSize:19,fontWeight:800,fontFamily:"'Sora',sans-serif",marginBottom:4}}>{d.title}</div>
      <div className="tsm cmu mb16">{$m(d.amount)} en juego · abierta el {fdate(d.created)}</div>
      <Stepper steps={["Disputa abierta","Defensa (7 días)","Decisión IA","Pago hecho"]} cur={cur}/>
      {d.status==="open"&&<div className={"hint "+(ready?"p":"w")}>{ready?"🤖 Todo listo. Cualquiera de las partes puede pedir la decisión de la IA.":`⏳ Quedan ${left} días para que ${iAmAgainst?"tú presentes":d.againstName+" presente"} la defensa.`}</div>}
    </div>

    {v&&<div className="card mb12" style={{borderColor:"rgba(167,139,250,.35)",background:"var(--pbg)"}}>
      <div className="fw7 mb12" style={{color:"var(--pur)"}}>🤖 Decisión de la IA {v.demo&&<span className="pill" style={{background:"rgba(255,255,255,.08)",color:"var(--muted)",marginLeft:6}}>Modo demo</span>}</div>
      <div className="g2" style={{gap:8,marginBottom:14}}>
        <div className="st"><div className="stv">{$m(d.amount*v.pct/100)}</div><div className="stl">{v.pct}% para el evento</div></div>
        <div className="st"><div className="stv" style={{color:"var(--pur)"}}>{$m(d.amount*(100-v.pct)/100)}</div><div className="stl">{100-v.pct}% vuelve a la marca</div></div>
      </div>
      {v.reasoning.map((r,i)=><div key={i} className="tsm mb8" style={{display:"flex",gap:8,lineHeight:1.5}}><span style={{color:"var(--pur)"}}>{i+1}.</span><span>{r}</span></div>)}
      <div className="txs cmu mt8">✅ El pago ya se ejecutó automáticamente.</div>
    </div>}

    <div className="mcard"><div className="txs fw7 cmu mb8">📣 RECLAMO DE {d.openedByName.toUpperCase()}{iOpened?" (TÚ)":""}</div>
      <span className="pill mb8" style={{background:"var(--ebg)",color:"var(--err)"}}>{d.reason}</span>
      <div className="tmd mt8" style={{lineHeight:1.55}}>{d.description}</div>
      {d.claimantEvidence&&<div className="tsm cmu mt8">📎 {d.claimantEvidence}</div>}</div>

    <div className="mcard"><div className="txs fw7 cmu mb8">🛡️ DEFENSA DE {d.againstName.toUpperCase()}{iAmAgainst?" (TÚ)":""}</div>
      {d.defenseSent?<div className="tmd" style={{lineHeight:1.55}}>{d.defense}</div>
      :iAmAgainst&&d.status==="open"&&left>0?<div>
        <div className="tsm cmu mb8">Explica tu versión. Si tienes pruebas, descríbelas. Tienes {left} días.</div>
        <textarea className="inp mb12" value={def} onChange={e=>setDef(e.target.value)} placeholder="Ej: Se instalaron las 4 vallas el 14 de marzo; adjunto fotos con fecha…"/>
        <button className="btn btn-p" style={{width:"100%"}} onClick={sendDef}>🛡️ Enviar mi defensa</button>
      </div>:<div className="tsm cmu">{left>0?"Todavía no ha respondido.":"No presentó defensa dentro del plazo."}</div>}
    </div>

    {d.status==="open"&&<div className="mcard" style={{borderColor:"rgba(167,139,250,.3)"}}><div className="txs fw7 mb8" style={{color:"var(--pur)"}}>🤖 QUÉ VA A REVISAR LA IA</div>
      {aiSum?<div className="tsm" style={{whiteSpace:"pre-wrap",lineHeight:1.6}}>{aiSum}</div>
      :<div className="tsm cmu" style={{lineHeight:1.7}}>• Lo que prometía la entrega: “{d.title}”.<br/>• El reclamo de {d.openedByName} y sus pruebas.<br/>• {d.defenseSent?`La defensa de ${d.againstName}.`:`La defensa de ${d.againstName}, si la presenta (si no, decide sin ella).`}<br/>• La evidencia subida antes de la disputa.<br/>Solo puede decidir 0, 25, 50, 75 o 100% del pago. Consejo: sé concreto y aporta fechas y fotos.</div>}
      {apiKey&&!aiSum&&<button className="btn btn-g btn-sm mt8" disabled={sumBusy} onClick={async()=>{setSumBusy(true);const r=await aiText(apiKey,`Resume en español muy simple y NEUTRAL, en 4 viñetas cortas, esta disputa de patrocinio para que ambas partes entiendan qué se discute y qué pruebas faltan. No des un veredicto. Entrega: ${d.title}. Reclamo de ${d.openedByName}: ${d.reason}. ${d.description}. Pruebas: ${d.claimantEvidence||"ninguna"}. Defensa de ${d.againstName}: ${d.defense||"aún no presentada"}.`,"");setAiSum(r.text||"No se pudo generar el resumen.");setSumBusy(false)}}>{sumBusy?"Pensando…":"✨ Resumen neutral con IA"}</button>}
    </div>}
    {d.status==="open"&&<div className="mt16">
      {err&&<div className="hint w mb12">⚠️ {err}</div>}
      {ready?<button className="btn btn-pur" style={{width:"100%"}} disabled={loading} onClick={run}>{loading?<><span style={{width:16,height:16,border:"2px solid rgba(255,255,255,.3)",borderTopColor:"#fff",borderRadius:"50%",animation:"spin 1s linear infinite"}}/> La IA está analizando…</>:"🤖 Pedir la decisión de la IA"}</button>
      :<button className="btn btn-g" style={{width:"100%"}} onClick={skip}>⏩ Saltar la espera de 7 días (solo demo)</button>}
      {!apiKey&&<div className="txs cmu tc-c mt8">Sin clave de Gemini se usa el modo demo. Puedes agregarla en <button className="cte" style={{textDecoration:"underline",fontSize:12}} onClick={()=>go("perfil",{ai:1})}>Perfil → Árbitro IA</button>.</div>}
    </div>}
  </div>;
}

/* ══════════ NUEVO ACUERDO (asistente de 3 pasos) ══════════ */
function NewDeal(){
  const {user,route,go,toast,bump}=useApp();
  const isS=user.role==="patrocinador";
  const myEvents=DB.events().filter(e=>e.ownerId===user.id);
  const others=isS?DB.events().filter(e=>e.ownerId!==user.id):DB.users().filter(u=>u.role==="patrocinador");
  const [step,setStep]=useState(0);
  const [evId,setEvId]=useState(route.ev||(!isS&&myEvents.length===1?myEvents[0].id:""));
  const [brandId,setBrandId]=useState(route.to||"");
  const [ms,setMs]=useState(()=>{
    const e0=DB.events().find(e=>e.id===route.ev),p=e0&&e0.packages&&route.pkg!=null?e0.packages[route.pkg]:null;
    if(!p)return [{title:"",amount:"",due:""}];
    const n=p.items.length,base=Math.floor(p.price/n/100)*100;
    return p.items.map((t,i)=>({title:t,amount:String(i===n-1?p.price-base*(n-1):base),due:""}));
  });
  useEffect(()=>{if(route.pkg!=null&&route.ev)setStep(1)},[]);
  const [ai,setAi]=useState(true);
  const ev=DB.events().find(e=>e.id===evId);
  const $m=n=>money(n,ev?curOf(ev):user.cur);
  const brand=userById(brandId);
  const total=ms.reduce((s,m)=>s+(Number(m.amount)||0),0);
  const setM=(i,k,v)=>setMs(p=>p.map((m,j)=>j===i?{...m,[k]:v}:m));
  const ok0=isS?!!ev:!!(ev&&brand);
  const ok1=ms.length>0&&ms.every(m=>m.title.trim()&&Number(m.amount)>0);
  if(!isS&&myEvents.length===0)return <div><Back onClick={()=>go("acuerdos",{})}/><Empty icon="🎪" title="Primero crea un evento" text="Para proponer un acuerdo necesitas tener al menos un evento." action="➕ Crear evento" onAction={()=>go("eventos",{nuevo:1})}/></div>;
  const create=()=>{
    const owner=userById(ev.ownerId);
    const sponsor=isS?user:brand,sponsored=isS?owner:user;
    const c={id:uid("c"),parties:[sponsor.id,sponsored.id],status:"pending",funded:false,cur:curOf(ev),feePct:FEE,createdBy:user.id,signed:{[user.id]:new Date().toISOString()},eventId:ev.id,eventName:ev.name,sponsorId:sponsor.id,sponsorName:dispName(sponsor),sponsoredId:sponsored.id,sponsoredName:sponsored.name,amount:total,aiClause:ai,created:new Date().toISOString(),
      milestones:ms.map((m,i)=>({id:i+1,title:m.title.trim(),amount:Number(m.amount),due:m.due,status:"pending",evidence:""}))};
    DB.setContracts([...DB.contracts(),c]);
    sysMsg(user.id,isS?sponsored.id:sponsor.id,`🤝 ${dispName(user)} te envió una propuesta de ${$m(total)} para “${ev.name}” con ${ms.length} entrega${ms.length>1?"s":""}. Revísala y fírmala en Acuerdos.`,ev.name);
    toast("¡Propuesta enviada!","✍️","Falta la firma de "+(isS?sponsored.name:dispName(sponsor)));bump();go("acuerdos",{cid:c.id});
  };
  return <div>
    <Back onClick={()=>step?setStep(step-1):go("acuerdos",{})} label={step?"Paso anterior":"Cancelar"}/>
    <Head title="Nuevo acuerdo" sub={`Paso ${step+1} de 3 · ${["Con quién","Qué se entrega","Revisar y firmar"][step]}`}/>
    <div className="steps">{[0,1,2].map(i=><div key={i} className={"step"+(i<=step?" on":"")}/>)}</div>

    {step===0&&<div className="fu">
      {isS?<>
        <div className="lbl">¿Qué evento quieres patrocinar?</div>
        {others.map(e=><button key={e.id} className={"task"+(evId===e.id?" ":"")} style={evId===e.id?{borderColor:"var(--teal)",background:"rgba(23,212,160,.06)"}:{}} onClick={()=>setEvId(e.id)}>
          <div className="ti" style={{background:"rgba(255,255,255,.05)"}}>{e.icon}</div>
          <div style={{flex:1,minWidth:0}}><div className="fw7 tmd">{e.name}</div><div className="txs cmu">{e.loc} · busca {$m(e.budgetMin)}–{$m(e.budgetMax)}</div></div>
          {evId===e.id&&<span className="cte fw7">✓</span>}</button>)}
      </>:<>
        <div className="lbl">1. ¿Para cuál de tus eventos?</div>
        {myEvents.map(e=><button key={e.id} className="task" style={evId===e.id?{borderColor:"var(--teal)",background:"rgba(23,212,160,.06)"}:{}} onClick={()=>setEvId(e.id)}>
          <div className="ti" style={{background:"rgba(255,255,255,.05)"}}>{e.icon}</div><div style={{flex:1}} className="fw7 tmd">{e.name}</div>{evId===e.id&&<span className="cte fw7">✓</span>}</button>)}
        <div className="lbl mt16">2. ¿Con qué marca?</div>
        {others.map(b=><button key={b.id} className="task" style={brandId===b.id?{borderColor:"var(--teal)",background:"rgba(23,212,160,.06)"}:{}} onClick={()=>setBrandId(b.id)}>
          <Av u={b} size={40}/><div style={{flex:1,minWidth:0}}><div className="fw7 tmd">{dispName(b)}</div><div className="txs cmu">{b.sector||"Marca"}</div></div>{brandId===b.id&&<span className="cte fw7">✓</span>}</button>)}
      </>}
      <button className="btn btn-p mt16" style={{width:"100%"}} disabled={!ok0} onClick={()=>setStep(1)}>{ok0?"Continuar →":"Elige para continuar"}</button>
    </div>}

    {step===1&&<div className="fu">
      <div className="hint mb16">💡 <div>Divide el acuerdo en <b>entregas</b>. Cada una tiene su pago, que se libera cuando la marca la aprueba.</div></div>
      {ms.map((m,i)=><div key={i} className="mcard">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><span className="fw7 tsm cte">Entrega {i+1}</span>{ms.length>1&&<button className="tsm" style={{color:"var(--err)"}} onClick={()=>setMs(p=>p.filter((_,j)=>j!==i))}>🗑️ Quitar</button>}</div>
        {!m.title&&<div className="chips" style={{flexWrap:"wrap",marginBottom:8}}>{TEMPLATES.map(t=><button key={t} className="chip" style={{fontSize:12,padding:"6px 11px"}} onClick={()=>setM(i,"title",t)}>+ {t}</button>)}</div>}
        <input className="inp mb8" value={m.title} onChange={e=>setM(i,"title",e.target.value)} placeholder="¿Qué se entrega? (o toca una idea de arriba)"/>
        <div style={{display:"flex",gap:8}}>
          <input className="inp" type="number" inputMode="numeric" min="0" value={m.amount} onChange={e=>setM(i,"amount",e.target.value)} placeholder={"Monto "+(curOf(ev)==="CLP"?"$":"€")} style={{flex:1}}/>
          <input className="inp" type="date" value={m.due} onChange={e=>setM(i,"due",e.target.value)} style={{flex:1,colorScheme:"dark"}} title="Fecha límite (opcional)"/>
        </div>
      </div>)}
      <button className="btn btn-g" style={{width:"100%"}} onClick={()=>setMs(p=>[...p,{title:"",amount:"",due:""}])}>➕ Agregar otra entrega</button>
      <div className="card mt16" style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span className="fw7">Total del acuerdo</span><span className="money-big">{$m(total)}</span></div>
      <button className="btn btn-p mt16" style={{width:"100%"}} disabled={!ok1} onClick={()=>setStep(2)}>{ok1?"Revisar →":"Completa nombre y monto de cada entrega"}</button>
    </div>}

    {step===2&&<div className="fu">
      <div className="card mb12">
        <div className="txs cmu fw7 mb8">RESUMEN</div>
        <div className="fw7" style={{fontSize:17}}>{ev.icon} {ev.name}</div>
        <div className="tsm cmu mb12">{isS?"Organiza: "+(userById(ev.ownerId)||{}).name:"Marca: "+dispName(brand)}</div>
        {ms.map((m,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"9px 0",borderBottom:"1px solid var(--bs)",gap:10}}><span className="tmd">{i+1}. {m.title}</span><b className="tmd" style={{flexShrink:0}}>{$m(m.amount)}</b></div>)}
        <div style={{display:"flex",justifyContent:"space-between",paddingTop:12}}><span className="fw7">Total</span><span className="money-big" style={{fontSize:22}}>{$m(total)}</span></div>
      </div>
      <div className="card mb12">
        <div style={{display:"flex",justifyContent:"space-between"}} className="tsm mb8"><span className="cmu">Monto del acuerdo (lo recibe el evento)</span><b>{$m(total)}</b></div>
        <div style={{display:"flex",justifyContent:"space-between"}} className="tsm mb8"><span className="cmu">Comisión GetSponzo ({FEE}%, la paga la marca)</span><b>{$m(Math.round(total*FEE/100))}</b></div>
        <div style={{display:"flex",justifyContent:"space-between",borderTop:"1px solid var(--bs)",paddingTop:8}} className="tsm"><span className="fw7">Total que paga la marca</span><b className="cte">{$m(total+Math.round(total*FEE/100))}</b></div>
      </div>
      <div className="hint mb12">🔒 <div><b>Pago protegido:</b> {isS?"depositas el total y GetSponzo lo guarda. Solo se paga cada entrega cuando tú la apruebas.":"la marca deposita el total y GetSponzo lo guarda. Recibes cada pago cuando la marca aprueba tu entrega."} <b>El acuerdo se activa cuando {isS?"el evento":"la marca"} también lo firma.</b></div></div>
      <label className="mcard" style={{display:"flex",gap:12,alignItems:"flex-start",cursor:"pointer"}}>
        <input type="checkbox" checked={ai} onChange={e=>setAi(e.target.checked)} style={{width:22,height:22,accentColor:"#17d4a0",flexShrink:0,marginTop:2,appearance:"auto"}}/>
        <div><div className="fw7 tmd">🤖 Acepto la cláusula de arbitraje con IA</div><div className="tsm cmu" style={{lineHeight:1.5}}>Si hay un desacuerdo, la otra parte tiene 7 días para defenderse y luego la IA decide qué % se paga (0, 25, 50, 75 o 100%).</div></div>
      </label>
      <button className="btn btn-p mt8" style={{width:"100%"}} disabled={!ai} onClick={create}>{ai?"✍️ Firmar y enviar propuesta":"Debes aceptar la cláusula"}</button>
    </div>}
  </div>;
}

      </div>}
    </div>
