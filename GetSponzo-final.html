// ─── GEMINI ARBITRATION ────────────────────────────────────────
async function callGemini(apiKey,dispute){
  const prompt=`Eres el árbitro imparcial de GetSponzo, marketplace de patrocinio deportivo y cultural.

Analiza esta disputa y decide qué porcentaje del pago debe liberarse al patrocinado.

DISPUTA: ${dispute.title}
DESCRIPCIÓN: ${dispute.description}
EVIDENCIA DEL DEMANDANTE: ${dispute.claimantEvidence}
DEFENSA DEL ACUSADO: ${dispute.defense||"El acusado no presentó defensa dentro del plazo de 7 días."}

REGLAS:
- Solo puedes usar: 0, 25, 50, 75 o 100
- 0%=incumplimiento total · 25%=incumplimiento mayoritario · 50%=responsabilidad compartida · 75%=cumplimiento mayoritario con falla menor · 100%=cumplió correctamente
- Responde SOLO con este JSON exacto, sin texto adicional:
{"verdict_pct":NÚMERO,"reasoning":["punto 1","punto 2","punto 3","resolución final con montos"]}`;

  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.3,maxOutputTokens:800}})
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||"Error Gemini")}
  const d=await res.json();
  const text=d.candidates?.[0]?.content?.parts?.[0]?.text||"";
  const m=text.match(/\{[\s\S]*\}/);
  if(!m)throw new Error("Formato inválido de la IA");
  return JSON.parse(m[0]);
}

            <div key={m.id} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",background:"rgba(255,255,255,.02)",borderRadius:13,marginBottom:10,borderLeft:`3px solid ${m.status==="approved"?C.success:m.status==="disputed"?C.danger:C.muted2}`}}>
              <div style={{width:36,height:36,borderRadius:"50%",background:m.status==="approved"?C.successbg:m.status==="disputed"?C.dangerbg:"rgba(255,255,255,.05)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
                {m.status==="approved"?"✓":m.status==="disputed"?"⚖️":"⏳"}
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:14}}>{m.title}</div>
                <div style={{fontSize:12,color:C.muted}}>€{m.amount.toLocaleString()} · {m.status==="approved"?"Liberado ✓":m.status==="disputed"?"En disputa — IA arbitrando":"Pendiente de verificación"}</div>
              </div>
              {m.status==="pending"&&<button onClick={()=>approveMs(c.id,m.id)} style={S.btnP({padding:"8px 14px",fontSize:12})}>Aprobar</button>}
              {m.status==="disputed"&&<button onClick={()=>goTo("disputes")} style={S.btnD({fontSize:12})}>Ver disputa</button>}
            </div>
          ))}
        </div>
      </div>
    );
  }

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:22,flexWrap:"wrap",gap:12}}>
        <TH title="Contratos" sub="Gestiona tus acuerdos con pago protegido por hitos."/>
        <button onClick={()=>setShowNew(true)} style={S.btnP({padding:"11px 20px"})}>+ Nuevo contrato</button>
      </div>
      {contracts.map(c=>(
        <div key={c.id} onClick={()=>setSel(c.id)} style={S.card({cursor:"pointer",marginBottom:12,transition:"transform .3s,border-color .3s,box-shadow .3s"})}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:8}}>
            <div><div style={{fontWeight:700,fontSize:16,marginBottom:3}}>{c.n}</div><div style={{fontSize:13,color:C.muted}}>{c.party}</div></div>
            <span style={S.tag(c.status==="completed"?C.successbg:c.milestones.some(m=>m.status==="disputed")?C.dangerbg:"rgba(23,212,160,.1)",c.status==="completed"?C.success:c.milestones.some(m=>m.status==="disputed")?C.danger:C.teal)}>
              {c.status==="completed"?"✅ Completado":c.milestones.some(m=>m.status==="disputed")?"⚖️ Con disputa":"🟢 Activo"}
            </span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:7}}><span style={{color:C.muted}}>Escrow liberado</span><span style={{fontWeight:700}}>€{c.paid.toLocaleString()} / €{c.amount.toLocaleString()}</span></div>
          <Bar v={c.paid/c.amount*100} h={8}/>
          <div style={{fontSize:12,color:C.muted,marginTop:10}}>{c.milestones.filter(m=>m.status==="approved").length}/{c.milestones.length} hitos verificados{c.milestones.some(m=>m.status==="disputed")?" · 1 en disputa ⚖️":""}</div>
        </div>
      ))}
      {showNew&&<NewContractModal close={()=>setShowNew(false)} showToast={showToast} onCreate={c=>{setContracts(cs=>[...cs,c]);setShowNew(false);}}/>}
    </div>
  );
}

function NewContractModal({close,showToast,onCreate}){
  const [f,setF]=useState({sponsor:"",event:"Club Deportivo Andes",amount:"6000",hitos:"Hito 1: Logo en camisetas (€2.000)\nHito 2: Posts en redes (€2.000)\nHito 3: Vallas en estadio (€2.000)"});
  const [accepted,setAccepted]=useState(false);
  const [done,setDone]=useState(false);
  const create=()=>{
    if(!f.sponsor){showToast("Indica el patrocinador","ℹ️");return;}
    if(!accepted){showToast("Acepta la cláusula IA","⚖️");return;}
    const newC={id:"c"+Date.now(),n:`Patrocinio ${f.event}`,party:`${f.sponsor} ↔ ${f.event}`,amount:Number(f.amount),paid:0,status:"active",
      milestones:f.hitos.split("\n").filter(Boolean).map((h,i)=>{const m=h.match(/€([\d.]+)/);const amt=m?Number(m[1].replace(".","")): Math.round(Number(f.amount)/3);return{id:i+1,title:h.replace(/\(€[\d.]+\)/,"").replace(/Hito \d+:\s*/,"").trim(),amount:amt,status:"pending"};})};
    onCreate(newC);setDone(true);
    showToast("Contrato creado","🔒",`€${Number(f.amount).toLocaleString()} retenidos en escrow.`);
  };
  return(
    <div onClick={e=>{if(e.target===e.currentTarget)close();}} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:18,overflowY:"auto"}}>
      <div style={{background:"rgba(8,17,31,.95)",backdropFilter:"blur(20px)",border:`1px solid ${C.border}`,borderRadius:20,padding:28,maxWidth:520,width:"100%",maxHeight:"92vh",overflowY:"auto",position:"relative"}}>
        <button onClick={close} style={{position:"absolute",top:16,right:18,fontSize:20,color:C.muted,background:"none",border:"none",cursor:"pointer"}}>✕</button>
        {!done?(
          <>
            <h3 style={{fontSize:21,fontWeight:700,marginBottom:6}}>Nuevo contrato con escrow</h3>
            <p style={{fontSize:13,color:C.muted,marginBottom:20}}>El dinero queda protegido hasta verificar cada hito.</p>
            <div style={{marginBottom:13}}><label style={S.lbl}>Patrocinador (marca)</label><input style={S.inp()} placeholder="Nombre de la marca" value={f.sponsor} onChange={e=>setF({...f,sponsor:e.target.value})}/></div>
            <div style={{marginBottom:13}}><label style={S.lbl}>Patrocinado</label><input style={S.inp()} value={f.event} onChange={e=>setF({...f,event:e.target.value})}/></div>
            <div style={{marginBottom:13}}><label style={S.lbl}>Importe total (€)</label><input style={S.inp()} type="number" value={f.amount} onChange={e=>setF({...f,amount:e.target.value})}/></div>
            <div style={{marginBottom:18}}><label style={S.lbl}>Hitos (uno por línea)</label><textarea style={{...S.inp(),minHeight:90,resize:"vertical"}} value={f.hitos} onChange={e=>setF({...f,hitos:e.target.value})}/></div>
            <div onClick={()=>setAccepted(!accepted)} style={{display:"flex",gap:12,alignItems:"flex-start",padding:"14px 16px",background:C.purplebg,border:`1px solid ${accepted?"rgba(124,58,237,.5)":"rgba(124,58,237,.2)"}`,borderRadius:13,marginBottom:18,cursor:"pointer"}}>
              <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${C.purple}`,background:accepted?C.purple:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{accepted&&<span style={{color:"#fff",fontSize:13,fontWeight:700}}>✓</span>}</div>
              <div style={{fontSize:13,color:C.purple,lineHeight:1.5}}><strong>Acepto la Cláusula de Arbitraje IA.</strong> Si hay disputa, ambas partes tienen 7 días para presentar evidencia y la IA (Gemini) decide qué % del pago se libera. El veredicto es vinculante.</div>
            </div>
            <button onClick={create} style={S.btnP({width:"100%",justifyContent:"center",padding:13})}>🔒 Generar contrato con escrow</button>
          </>
        ):(
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:48,marginBottom:14}}>✅</div>
            <h3 style={{fontSize:20,fontWeight:700,marginBottom:10}}>¡Contrato activado!</h3>
            <p style={{fontSize:14,color:C.muted,marginBottom:20}}>€{Number(f.amount).toLocaleString()} retenidos en escrow. Se liberarán hito a hito.</p>
            <button onClick={close} style={S.btnP({width:"100%",justifyContent:"center",padding:13})}>Ver mis contratos</button>
          </div>
        )}
      </div>
    </div>
  );
}

function DisputesView({apiKey,showToast}){
  const [dispute,setDispute]=useState({id:"d1",title:"Hito 3 — Vallas publicitarias no instaladas en fecha",openedBy:"Marca Patrocinadora",status:"under_review",amount:2000,description:"El hito 3 establecía la instalación de 4 vallas publicitarias antes del 15 de marzo. A la fecha solo se instalaron 2, y sin la visibilidad acordada en el contrato.",claimantEvidence:"Fotos del estadio del 16 de marzo mostrando solo 2 vallas instaladas de las 4 acordadas.",daysLeft:5});
  const [sel,setSel]=useState(false);
  const [defense,setDefense]=useState("");
  const [defenseSent,setDefenseSent]=useState(false);
  const [aiRunning,setAiRunning]=useState(false);
  const [aiProgress,setAiProgress]=useState(0);
  const [aiStatus,setAiStatus]=useState("");
  const [verdict,setVerdict]=useState(null);
  const [error,setError]=useState("");

  const runAI=async()=>{
    setAiRunning(true);setVerdict(null);setError("");setAiProgress(0);
    const steps=[[600,20,"Verificando evidencia del demandante..."],[1200,45,"Analizando defensa del acusado..."],[1900,68,"Evaluando nivel de cumplimiento del hito..."],[2600,85,"Consultando árbitro IA (Gemini)..."]];
    steps.forEach(([t,p,s])=>setTimeout(()=>{setAiProgress(p);setAiStatus(s);},t));
    try{
      const result=await callGemini(apiKey,{title:dispute.title,description:dispute.description,claimantEvidence:dispute.claimantEvidence,defense:defenseSent?defense:""});
      setAiProgress(100);setAiStatus("Veredicto emitido.");
      const released=Math.round(dispute.amount*result.verdict_pct/100);
      setVerdict({...result,released,retained:dispute.amount-released});
    }catch(err){setError("Error Gemini: "+err.message);}
    setAiRunning(false);
  };

  const executeVerdict=()=>{
    setDispute(d=>({...d,status:"resolved"}));
    showToast("Veredicto ejecutado","⚡",`€${verdict.released.toLocaleString()} liberados · €${verdict.retained.toLocaleString()} devueltos.`);
    setSel(false);setVerdict(null);setDefenseSent(false);setDefense("");
  };

  if(sel){return(
    <div>
      <button onClick={()=>setSel(false)} style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:C.muted,marginBottom:16,background:"none",border:"none",cursor:"pointer"}}>← Volver</button>
      {/* Header */}
      <div style={S.card({border:"1px solid rgba(240,101,74,.2)",padding:24,marginBottom:14})}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:C.danger,textTransform:"uppercase",letterSpacing:".6px",marginBottom:5}}>⚖️ ARBITRAJE IA {verdict?"· RESUELTO":"· EN PROCESO"}</div>
            <h2 style={{fontSize:18,fontWeight:700,marginBottom:4}}>{dispute.title}</h2>
            <div style={{fontSize:13,color:C.muted}}>Abierta por: {dispute.openedBy}</div>
          </div>
          {!verdict&&<div style={{textAlign:"center",background:C.warnbg,border:"1px solid rgba(240,198,74,.25)",borderRadius:13,padding:"10px 18px"}}>
            <div style={{fontFamily:"'Sora',sans-serif",fontSize:28,fontWeight:800,color:C.warn}}>{dispute.daysLeft}</div>
            <div style={{fontSize:11,color:C.muted}}>días restantes</div>
          </div>}
        </div>
        <div style={{background:"rgba(0,0,0,.2)",borderRadius:11,padding:14,fontSize:13,color:C.muted,lineHeight:1.6,marginBottom:10}}>{dispute.description}</div>
        <div style={{fontSize:12,color:C.warn}}>📎 Evidencia del demandante: {dispute.claimantEvidence}</div>
      </div>

      {/* Defense */}
      {!verdict&&(
        <div style={S.card({border:`1px solid ${C.border}`,marginBottom:14})}>
          <div style={{fontWeight:700,fontSize:15,marginBottom:5}}>📅 Ventana de defensa — {dispute.daysLeft} días restantes</div>
          <div style={{fontSize:13,color:C.muted,marginBottom:14,lineHeight:1.6}}>Ambas partes tienen <strong style={{color:C.warn}}>7 días</strong> para subir su defensa. Al cerrar el plazo, Gemini analiza todo y emite su veredicto automáticamente.</div>
          <Bar v={(7-dispute.daysLeft)/7*100} h={8} color={C.warn}/>
          <div style={{height:8,marginBottom:16}}/>
          {!defenseSent?(
            <>
              <textarea style={{...S.inp(),minHeight:80,resize:"vertical",marginBottom:10}} value={defense} onChange={e=>setDefense(e.target.value)} placeholder="Explica tu posición y aporta evidencia..."/>
              <button onClick={()=>{if(!defense.trim()){showToast("Escribe tu defensa","ℹ️");return;}setDefenseSent(true);showToast("Defensa registrada","📎","Gemini la considerará en el veredicto.");}} style={S.btnG({width:"100%",justifyContent:"center",padding:12})}>📎 Enviar mi defensa</button>
            </>
          ):(
            <div style={{background:C.successbg,border:"1px solid rgba(46,207,127,.2)",borderRadius:11,padding:13,fontSize:13,color:C.success}}>✅ Defensa registrada. Gemini la analizará en el veredicto.</div>
          )}
        </div>
      )}

      {/* AI Engine */}
      {!verdict&&(
        <div style={S.card({border:"1px solid rgba(124,58,237,.3)",background:"rgba(124,58,237,.04)",marginBottom:14})}>
          <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:10}}>
            <span style={{fontSize:24}}>🤖</span>
            <div><div style={{fontWeight:700,fontSize:15}}>Motor de Arbitraje IA — Gemini</div><div style={{fontSize:12,color:C.muted}}>Analiza evidencias y determina el % a liberar (0, 25, 50, 75 o 100%)</div></div>
          </div>
          {aiRunning?(
            <div>
              <div style={{fontSize:13,color:C.muted,marginBottom:10}}>🔍 {aiStatus}</div>
              <div style={{height:10,background:"rgba(255,255,255,.05)",borderRadius:99,overflow:"hidden",marginBottom:8}}>
                <div style={{width:aiProgress+"%",height:"100%",background:"linear-gradient(90deg,#7c3aed,#a78bfa)",borderRadius:99,transition:"width .5s ease"}}/>
              </div>
              <div style={{fontSize:12,color:C.purple}}>{aiProgress}% completado...</div>
            </div>
          ):(
            <div>
              {error&&<div style={{background:C.dangerbg,border:"1px solid rgba(240,101,74,.2)",borderRadius:10,padding:"10px 14px",fontSize:13,color:C.danger,marginBottom:14}}>⚠️ {error}</div>}
              <div style={{fontSize:13,color:C.muted,marginBottom:14,lineHeight:1.6}}>Gemini analiza toda la evidencia y emite un veredicto vinculante. Según la cláusula aceptada al firmar el contrato.</div>
              <button onClick={runAI} style={{background:"rgba(124,58,237,.8)",color:"#fff",border:"1px solid rgba(124,58,237,.5)",borderRadius:12,padding:"12px 20px",width:"100%",fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8,fontFamily:"Inter,sans-serif"}}>🤖 Ejecutar arbitraje con Gemini</button>
            </div>
          )}
        </div>
      )}

      {/* Verdict */}
      {verdict&&(
        <div style={{background:"rgba(124,58,237,.07)",border:"1.5px solid rgba(124,58,237,.4)",borderRadius:18,padding:24,animation:"slideUp .4s ease"}}>
          <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:18}}>
            <span style={{fontSize:28}}>🤖</span>
            <div><div style={{fontWeight:800,fontSize:19}}>Veredicto de Gemini IA</div><div style={{fontSize:12,color:C.purple}}>Arbitraje GetSponzo · Vinculante por contrato</div></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}}>
            <div style={{background:C.successbg,border:"1px solid rgba(46,207,127,.2)",borderRadius:13,padding:16,textAlign:"center"}}>
              <div style={{fontSize:11,color:C.muted,marginBottom:4}}>LIBERADO AL EVENTO</div>
              <div style={{fontFamily:"'Sora',sans-serif",fontSize:28,fontWeight:800,color:C.success}}>€{verdict.released.toLocaleString()}</div>
              <div style={{fontSize:13,color:C.success,fontWeight:600}}>{verdict.verdict_pct}%</div>
            </div>
            <div style={{background:C.dangerbg,border:"1px solid rgba(240,101,74,.2)",borderRadius:13,padding:16,textAlign:"center"}}>
              <div style={{fontSize:11,color:C.muted,marginBottom:4}}>DEVUELTO A LA MARCA</div>
              <div style={{fontFamily:"'Sora',sans-serif",fontSize:28,fontWeight:800,color:C.danger}}>€{verdict.retained.toLocaleString()}</div>
              <div style={{fontSize:13,color:C.danger,fontWeight:600}}>{100-verdict.verdict_pct}%</div>
            </div>
          </div>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,color:C.purple,marginBottom:8,textTransform:"uppercase",letterSpacing:".5px"}}>Razonamiento de Gemini</div>
            {(verdict.reasoning||[]).map((r,i)=>(
              <div key={i} style={{fontSize:13,color:C.muted,lineHeight:1.6,marginBottom:6,paddingLeft:12,borderLeft:"2px solid rgba(124,58,237,.3)"}}>{r}</div>
            ))}
          </div>
          <button onClick={executeVerdict} style={{background:"rgba(124,58,237,.8)",color:"#fff",border:"1px solid rgba(124,58,237,.5)",borderRadius:12,padding:"13px 20px",width:"100%",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"Inter,sans-serif"}}>✅ Confirmar y ejecutar veredicto</button>
        </div>
      )}
    </div>
  );}

  return(
    <div>
      <TH title="Centro de disputas" sub="Arbitraje vinculante por Gemini IA — 7 días de defensa para ambas partes."/>
      <div style={{background:"rgba(124,58,237,.04)",border:`1px solid ${C.border}`,borderRadius:16,padding:20,marginBottom:20}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:14}}>⚖️ Cómo funciona el arbitraje</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(80px,1fr))",gap:12}}>
          {[["📅","7 días","Para subir evidencia"],["🔒","Escrow","Pago congelado"],["🤖","Gemini","Analiza sin sesgo"],["📊","% justo","0, 25, 50, 75 o 100%"],["✅","Vinculante","Por contrato"]].map(([ic,t,d],i)=>(
            <div key={i} style={{textAlign:"center"}}>
              <div style={{fontSize:22,marginBottom:5}}>{ic}</div>
              <div style={{fontWeight:700,fontSize:12,marginBottom:2}}>{t}</div>
              <div style={{fontSize:11,color:C.muted}}>{d}</div>
            </div>
          ))}
        </div>
      </div>
      <div onClick={()=>dispute.status==="under_review"&&setSel(true)} style={S.card({cursor:dispute.status==="under_review"?"pointer":"default",borderLeft:`3px solid ${dispute.status==="resolved"?C.success:C.danger}`,transition:"transform .3s,border-color .3s"})}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
          <div>
            <div style={{fontWeight:700,fontSize:15,marginBottom:3}}>{dispute.title}</div>
            <div style={{fontSize:12,color:C.muted,marginBottom:4}}>Abierta por: {dispute.openedBy}</div>
            {dispute.status==="under_review"&&<div style={{fontSize:12,color:C.warn}}>📅 {dispute.daysLeft} días para presentar defensa · Haz clic para ver</div>}
            {dispute.status==="resolved"&&<div style={{fontSize:12,color:C.success}}>✅ Resuelta — veredicto ejecutado por Gemini</div>}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end"}}>
            <span style={S.tag(dispute.status==="resolved"?C.successbg:C.purplebg,dispute.status==="resolved"?C.success:C.purple)}>{dispute.status==="resolved"?"✅ Resuelta":"🤖 Arbitraje en curso"}</span>
            <span style={S.tag(C.dangerbg,C.danger)}>€{dispute.amount.toLocaleString()} en disputa</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function MessagesView({showToast}){
  const [msgs,setMsgs]=useState([
    {id:1,me:false,text:"Hola, vimos su perfil y nos interesa patrocinar el próximo torneo regional. ¿Podemos coordinar los detalles?",time:"10:24"},
    {id:2,me:true,text:"¡Hola! Claro, encantados. Tenemos paquetes desde €4.000 con visibilidad en camiseta y vallas. Te comparto la propuesta por aquí.",time:"10:31"},
    {id:3,me:false,text:"Perfecto. ¿Qué incluye el paquete básico exactamente?",time:"10:35"},

  const [txt,setTxt]=useState("");

    setMsgs(m=>[...m,{id:Date.now(),me:true,text:txt,time:new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})}]);

  return(
    <div>
      <TH title="Mensajes" sub="Comunicación segura. Compartir datos de contacto está bloqueado."/>
      <div style={S.card({padding:0,overflow:"hidden"})}>
        <div style={{padding:"14px 18px",borderBottom:`1px solid ${C.borders}`,display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:38,height:38,borderRadius:11,background:"rgba(23,212,160,.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>⚽</div>
          <div><div style={{fontWeight:700,fontSize:14}}>Club Deportivo Andes</div><div style={{fontSize:11,color:C.success}}>● Comunicación segura</div></div>
        </div>
        <div style={{minHeight:240,maxHeight:340,overflowY:"auto",padding:16,display:"flex",flexDirection:"column",gap:12}}>
          {msgs.map(m=>(
            <div key={m.id} style={{alignSelf:m.me?"flex-end":"flex-start",maxWidth:"75%"}}>
              <div style={{padding:"11px 15px",borderRadius:14,fontSize:14,lineHeight:1.5,background:m.me?"linear-gradient(135deg,#17d4a0,#0d9d76)":"rgba(255,255,255,.05)",color:m.me?C.navy:C.white,fontWeight:m.me?600:400}}>{m.text}</div>
              <div style={{fontSize:10,color:C.muted2,marginTop:4,textAlign:m.me?"right":"left"}}>{m.time}</div>
            </div>
          ))}
          <div ref={endRef}/>
        </div>
        <div style={{padding:14,borderTop:`1px solid ${C.borders}`,display:"flex",gap:10}}>
          <input value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Escribe un mensaje…" style={S.inp({flex:1})}/>
          <button onClick={send} style={S.btnP({padding:"11px 18px"})}>Enviar</button>

// ─── ROOT APP ──────────────────────────────────────────────────
function App(){
  const [page,setPage]=useState("landing");
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem("gs_apikey")||"");
  const [toast,setToast]=useState(null);
  const [investOpen,setInvestOpen]=useState(false);

  const showToast=(msg,icon="✓",sub="")=>{setToast({msg,icon,sub});setTimeout(()=>setToast(null),3200);};
  const saveKey=(k)=>{localStorage.setItem("gs_apikey",k);setApiKey(k);showToast("API Key guardada","🔑","El árbitro Gemini está listo.");};
  const clearKey=()=>{localStorage.removeItem("gs_apikey");setApiKey("");setPage("landing");};
  const goToPlatform=()=>{if(!apiKey){setPage("apikey");}else{setPage("platform");}window.scrollTo(0,0);};

  return(
    <div>
      {page==="landing"&&<Landing goToPlatform={goToPlatform} openInvest={()=>setInvestOpen(true)}/>}
      {page==="apikey"&&<ApiKeySetup onSave={k=>{saveKey(k);setPage("platform");}}/>}
      {page==="platform"&&<Platform apiKey={apiKey} showToast={showToast} onClearKey={clearKey} goHome={()=>setPage("landing")}/>}
      {investOpen&&<InvestModal close={()=>setInvestOpen(false)} showToast={showToast}/>}
      {toast&&<Toast {...toast}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
