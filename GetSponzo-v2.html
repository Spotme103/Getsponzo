<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GetSponzo — Marketplace de patrocinio protegido</title>
<meta name="description" content="Conecta marcas con eventos. Pago protegido por escrow. Árbitro IA en 7 días."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07101e;--bg2:#0b1828;--card:#0e2030;--card2:#112438;
  --teal:#17d4a0;--td:#0cb888;--tl:#3de8b5;
  --white:#f0f8fc;--muted:#6b8fa8;--muted2:#4a6a82;
  --border:rgba(23,212,160,.14);--bs:rgba(255,255,255,.06);
  --warn:#f5c842;--wbg:rgba(245,200,66,.09);
  --err:#f0604a;--ebg:rgba(240,96,74,.09);
  --ok:#28cf7a;--obg:rgba(40,207,122,.09);
  --pur:#a78bfa;--pbg:rgba(124,58,237,.1);
}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--white);line-height:1.5;overflow-x:hidden;min-height:100vh}
h1,h2,h3,h4{font-family:'Sora',sans-serif;letter-spacing:-.02em}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;background:none;-webkit-appearance:none}
input,textarea,select{font-family:'Inter',sans-serif;-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:rgba(107,143,168,.5)}
select option{background:#0e2030;color:#fff}
img{max-width:100%;height:auto}
a{color:var(--teal);text-decoration:none}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(23,212,160,.2);border-radius:99px}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.7)}}
@keyframes fill{from{width:0}to{width:var(--w)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(23,212,160,.3))}50%{filter:drop-shadow(0 0 12px rgba(23,212,160,.7))}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes gridMove{from{background-position:0 0}to{background-position:60px 60px}}

.fu{animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) both}
.fu1{animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) .07s both}
.fu2{animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) .14s both}
.fu3{animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) .21s both}

/* Layout */
.container{max-width:1100px;margin:0 auto;padding:0 16px}
@media(min-width:640px){.container{padding:0 24px}}
@media(min-width:1024px){.container{padding:0 32px}}

/* Reusable components */
.card{background:var(--card);border:1px solid var(--bs);border-radius:16px;padding:20px}
@media(min-width:640px){.card{border-radius:20px;padding:24px}}

.btn-p{background:linear-gradient(135deg,var(--teal),var(--td));color:#07101e;font-weight:700;border-radius:12px;padding:13px 22px;font-size:15px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;box-shadow:0 4px 18px rgba(23,212,160,.22);font-family:'Inter',sans-serif;min-height:48px;width:100%}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(23,212,160,.38)}
.btn-p:active{transform:translateY(0)}
@media(min-width:640px){.btn-p{width:auto}}

.btn-g{background:rgba(255,255,255,.04);color:var(--white);font-weight:600;border:1px solid var(--bs);border-radius:12px;padding:13px 22px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;font-family:'Inter',sans-serif;min-height:48px;width:100%}
.btn-g:hover{background:rgba(255,255,255,.08);border-color:var(--border)}
@media(min-width:640px){.btn-g{width:auto}}

.btn-sm{padding:9px 16px;font-size:13px;min-height:40px;border-radius:10px}

.inp{width:100%;padding:13px 15px;border:1.5px solid var(--bs);border-radius:11px;background:rgba(255,255,255,.03);color:var(--white);font-size:15px;outline:none;transition:border .2s;font-family:'Inter',sans-serif;min-height:48px}
.inp:focus{border-color:var(--teal)}
.inp-wrap{margin-bottom:16px}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:7px}

.tag{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}

/* Bottom nav (mobile) */
.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(7,16,30,.95);backdrop-filter:blur(20px);border-top:1px solid var(--bs);padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:200}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:10px;font-weight:600;cursor:pointer;color:var(--muted);background:none;border:none;font-family:'Inter',sans-serif;transition:color .2s}
.bnav-item.active{color:var(--teal)}
.bnav-icon{font-size:20px;line-height:1}

/* Sidebar (desktop) */
.sidebar{display:none}
@media(min-width:768px){
  .bottom-nav{display:none}
  .sidebar{display:flex;flex-direction:column;gap:2px;width:220px;position:sticky;top:74px;height:fit-content;flex-shrink:0}
  .sidebar button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);background:transparent;border:1px solid transparent;transition:all .2s;text-align:left;font-family:'Inter',sans-serif}
  .sidebar button.active{background:rgba(23,212,160,.1);color:var(--teal);border-color:var(--border)}
  .sidebar button:hover:not(.active){background:rgba(255,255,255,.04)}
  .sidebar .nav-icon{font-size:18px}
}

/* Platform layout */
.platform-layout{display:flex;gap:24px;align-items:flex-start;padding-bottom:80px}
@media(min-width:768px){.platform-layout{padding-bottom:24px}}

.main-content{flex:1;min-width:0;width:100%}

/* Grid helpers */
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}

.grid3{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:480px){.grid3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:768px){.grid3{grid-template-columns:repeat(3,1fr)}}

.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid4{grid-template-columns:repeat(4,1fr)}}

/* Toast */
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 16px 50px rgba(0,0,0,.5);max-width:340px;width:calc(100% - 32px);animation:slideUp .3s ease}
@media(min-width:768px){.toast{bottom:26px}}

/* Bar */
.bar-track{height:8px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--td));border-radius:99px;animation:fill 1s ease both}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.overlay{align-items:center;padding:16px}}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:24px;width:100%;max-height:92vh;overflow-y:auto;position:relative;animation:slideUp .35s ease}
@media(min-width:640px){.modal{border-radius:20px;max-width:520px}}

/* Profile type cards */
.type-card{border:2px solid var(--bs);border-radius:16px;padding:20px;cursor:pointer;transition:all .25s;text-align:center;background:var(--card)}
.type-card:hover,.type-card.sel{border-color:var(--teal);background:rgba(23,212,160,.06)}

/* Section header */
.sec-header{margin-bottom:20px}
.sec-header h2{font-size:22px;font-weight:700;margin-bottom:4px}
@media(min-width:640px){.sec-header h2{font-size:26px}}
.sec-header p{font-size:14px;color:var(--muted)}

/* Nav */
.topnav{position:sticky;top:0;z-index:100;background:rgba(7,16,30,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bs);padding:0 16px}
@media(min-width:640px){.topnav{padding:0 24px}}
.topnav-inner{display:flex;align-items:center;justify-content:space-between;height:60px}
@media(min-width:640px){.topnav-inner{height:68px}}

/* Stat card */
.stat-card{background:rgba(255,255,255,.03);border-radius:14px;padding:16px;text-align:center}
.stat-val{font-family:'Sora',sans-serif;font-size:26px;font-weight:800;color:var(--teal);margin-bottom:4px}
.stat-lbl{font-size:12px;color:var(--muted)}

/* Opportunity card */
.opp-card{cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}
.opp-card:hover{transform:translateY(-3px);border-color:var(--border);box-shadow:0 10px 32px rgba(0,0,0,.3)}

/* Pulse dot */
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite;display:inline-block}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

/* ─── GEMINI ─────────────────────────────────────────── */
async function callGemini(apiKey,dispute){
  const prompt=`Eres el árbitro de GetSponzo. Analiza esta disputa y decide el porcentaje a liberar al patrocinado.
DISPUTA: ${dispute.title}
DESCRIPCIÓN: ${dispute.description}
EVIDENCIA DEMANDANTE: ${dispute.claimantEvidence}
DEFENSA ACUSADO: ${dispute.defense||"Sin defensa presentada"}
Solo puedes usar: 0, 25, 50, 75 o 100.
Responde SOLO este JSON: {"verdict_pct":NÚMERO,"reasoning":["punto 1","punto 2","punto 3"]}`;
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.3,maxOutputTokens:600}})
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||"Error Gemini")}
  const d=await res.json();
  const text=d.candidates?.[0]?.content?.parts?.[0]?.text||"";
  const m=text.match(/\{[\s\S]*\}/);
  if(!m)throw new Error("Respuesta inválida");
  return JSON.parse(m[0]);
}

/* ─── STORAGE ────────────────────────────────────────── */
const DB={
  getUsers:()=>JSON.parse(localStorage.getItem("gs_users")||"[]"),
  saveUsers:(u)=>localStorage.setItem("gs_users",JSON.stringify(u)),
  getSession:()=>JSON.parse(localStorage.getItem("gs_session")||"null"),
  saveSession:(u)=>localStorage.setItem("gs_session",JSON.stringify(u)),
  clearSession:()=>localStorage.removeItem("gs_session"),
  getApiKey:()=>localStorage.getItem("gs_apikey")||"",
  saveApiKey:(k)=>localStorage.setItem("gs_apikey",k),
  clearApiKey:()=>localStorage.removeItem("gs_apikey"),
};

/* ─── SEED DATA ───────────────────────────────────────── */
const SEED_USERS=[
  {id:"u1",name:"Cristóbal Torretti",email:"cristobal@demo.com",password:"demo123",role:"patrocinado",avatar:"CT",
   profile:{company:"Club Deportivo Andes",category:"Deporte",location:"Santiago, Chile",description:"Club de fútbol amateur con 12.000 asistentes por temporada.",budget:"€4.000–€8.000",audience:"Familias 25-45 · 12K asistentes",compliance:97,deals:8,trust:96}},
  {id:"u2",name:"María González",email:"maria@demo.com",password:"demo123",role:"patrocinador",avatar:"MG",
   profile:{company:"Marca Deportiva Chile",category:"Retail",location:"Santiago, Chile",description:"Empresa de artículos deportivos buscando visibilidad en eventos.",budget:"€5.000–€20.000",focus:"Deporte y bienestar"}},
  {id:"u3",name:"Pablo Rodríguez",email:"pablo@demo.com",password:"demo123",role:"inversor",avatar:"PR",
   profile:{company:"VC Chile Capital",investmentRange:"€50K–€500K",focus:"SaaS y marketplace"}},
];

/* ─── LOGOS & ICONS ──────────────────────────────────── */
function Logo({size=32,glow=true}){
  return(
    <svg width={size} height={size} viewBox="0 0 80 80" style={glow?{animation:"glow 4s ease-in-out infinite"}:{}}>
      <defs>
        <filter id="gf2"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#3de8b5"/><stop offset="1" stopColor="#0cb888"/></linearGradient>
      </defs>
      <g stroke="url(#lg2)" strokeWidth="1" strokeOpacity=".5" fill="none" filter="url(#gf2)">
        <line x1="40" y1="8" x2="58" y2="26"/><line x1="58" y1="26" x2="72" y2="40"/><line x1="72" y1="40" x2="58" y2="54"/><line x1="58" y1="54" x2="40" y2="72"/>
        <line x1="40" y1="72" x2="22" y2="54"/><line x1="22" y1="54" x2="8" y2="40"/><line x1="8" y1="40" x2="22" y2="26"/><line x1="22" y1="26" x2="40" y2="8"/>
        <line x1="40" y1="8" x2="40" y2="72"/><line x1="8" y1="40" x2="72" y2="40"/>
        <line x1="58" y1="26" x2="40" y2="40"/><line x1="40" y1="40" x2="22" y2="54"/><line x1="22" y1="26" x2="40" y2="40"/><line x1="40" y1="40" x2="58" y2="54"/>
      </g>
      <g filter="url(#gf2)">
        {[[40,8],[72,40],[40,72],[8,40]].map(([x,y],i)=><g key={i}><circle cx={x} cy={y} r="4" fill="#17d4a0"/><circle cx={x} cy={y} r="1.5" fill="#cffff0"/></g>)}
        {[[58,26],[58,54],[22,54],[22,26]].map(([x,y],i)=><circle key={i} cx={x} cy={y} r="3" fill="#3de8b5"/>)}
        <circle cx="40" cy="40" r="5" fill="#0cb888"/><circle cx="40" cy="40" r="2.2" fill="#cffff0"/>
      </g>
    </svg>
  );
}

function Avatar({initials,size=40,gradient="linear-gradient(135deg,#17d4a0,#0cb888)"}){
  return(
    <div style={{width:size,height:size,borderRadius:"50%",background:gradient,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Sora',sans-serif",fontWeight:800,fontSize:size*0.32,color:"#07101e",flexShrink:0}}>
      {initials}
    </div>
  );
}

function Toast({msg,icon,sub}){
  return(
    <div className="toast">
      <span style={{fontSize:20}}>{icon}</span>
      <div><div style={{fontWeight:700,fontSize:14}}>{msg}</div>{sub&&<div style={{fontSize:12,color:"#6b8fa8",marginTop:2}}>{sub}</div>}</div>
    </div>
  );
}

function Bar({v,color="var(--teal)",h=8}){
  return(
    <div className="bar-track" style={{height:h}}>
      <div className="bar-fill" style={{"--w":v+"%",width:v+"%",background:`linear-gradient(90deg,${color},${color}cc)`}}/>
    </div>
  );
}

/* ─── AUTH ───────────────────────────────────────────── */
function AuthScreen({onLogin,showToast}){
  const [mode,setMode]=useState("login"); // login | register
  const [step,setStep]=useState(1); // register: 1=datos, 2=tipo perfil, 3=perfil específico
  const [role,setRole]=useState("");
  const [form,setForm]=useState({name:"",email:"",password:"",company:"",category:"",location:"",description:"",budget:"",audience:"",focus:"",investRange:""});
  const [loading,setLoading]=useState(false);

  const F=(k,v)=>setForm(f=>({...f,[k]:v}));

  const handleLogin=()=>{
    setLoading(true);
    setTimeout(()=>{
      // Init seed users if first time
      let users=DB.getUsers();
      if(users.length===0){DB.saveUsers(SEED_USERS);users=SEED_USERS;}
      const user=users.find(u=>u.email===form.email&&u.password===form.password);
      if(!user){showToast("Email o contraseña incorrectos","❌");setLoading(false);return;}
      DB.saveSession(user);onLogin(user);setLoading(false);
    },800);
  };

  const handleRegister=()=>{
    if(step===1){
      if(!form.name||!form.email||!form.password){showToast("Completa todos los campos","⚠️");return;}
      if(form.password.length<6){showToast("La contraseña debe tener al menos 6 caracteres","⚠️");return;}
      const users=DB.getUsers();
      if(users.some(u=>u.email===form.email)){showToast("Ya existe una cuenta con ese email","❌");return;}
      setStep(2);return;
    }
    if(step===2){if(!role){showToast("Elige un tipo de perfil","⚠️");return;}setStep(3);return;}
    if(step===3){
      setLoading(true);
      setTimeout(()=>{
        let users=DB.getUsers();
        if(users.length===0){DB.saveUsers(SEED_USERS);users=SEED_USERS;}
        const initials=form.name.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
        const newUser={
          id:"u"+Date.now(),name:form.name,email:form.email,password:form.password,role,avatar:initials,
          profile:role==="patrocinado"?{company:form.company,category:form.category,location:form.location,description:form.description,budget:form.budget,audience:form.audience,compliance:100,deals:0,trust:70}
            :role==="patrocinador"?{company:form.company,category:form.category,location:form.location,description:form.description,budget:form.budget,focus:form.focus}
            :{company:form.company,investmentRange:form.investRange,focus:form.focus}
        };
        const updated=[...users,newUser];
        DB.saveUsers(updated);DB.saveSession(newUser);
        onLogin(newUser);setLoading(false);
        showToast("¡Cuenta creada!","🎉","Bienvenido a GetSponzo.");
      },900);
    }
  };

  const demoLogin=(email)=>{
    let users=DB.getUsers();
    if(users.length===0){DB.saveUsers(SEED_USERS);users=SEED_USERS;}
    const user=users.find(u=>u.email===email);
    if(user){DB.saveSession(user);onLogin(user);}
  };

  const ROLES=[
    {id:"patrocinado",icon:"🎯",title:"Patrocinado",desc:"Evento, club, podcast o creador buscando marcas patrocinadoras"},
    {id:"patrocinador",icon:"🏢",title:"Patrocinador",desc:"Marca o empresa que quiere patrocinar eventos y creadores"},
    {id:"inversor",icon:"💼",title:"Inversor",desc:"Interesado en conocer la oportunidad de inversión en GetSponzo"},
  ];

  return(
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",flexDirection:"column"}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"20px 20px 0"}}>
        <Logo size={30}/><span style={{fontFamily:"'Sora',sans-serif",fontWeight:800,fontSize:20}}>Get<span style={{color:"var(--teal)"}}>Sponzo</span></span>
      </div>

      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 16px 40px"}}>
        <div style={{width:"100%",maxWidth:440}}>
          {mode==="login"?(
            <div className="fu">
              <h1 style={{fontSize:28,fontWeight:800,marginBottom:6}}>Bienvenido de nuevo</h1>
              <p style={{color:"var(--muted)",marginBottom:28,fontSize:15}}>Entra a tu cuenta de GetSponzo</p>
              <div className="inp-wrap"><label className="lbl">Email</label><input className="inp" type="email" value={form.email} onChange={e=>F("email",e.target.value)} placeholder="tu@email.com"/></div>
              <div className="inp-wrap"><label className="lbl">Contraseña</label><input className="inp" type="password" value={form.password} onChange={e=>F("password",e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&handleLogin()}/></div>
              <button className="btn-p" onClick={handleLogin} disabled={loading} style={{marginBottom:16}}>{loading?"Entrando...":"Entrar a mi cuenta →"}</button>
              <div style={{textAlign:"center",fontSize:14,color:"var(--muted)",marginBottom:24}}>¿No tienes cuenta? <button onClick={()=>{setMode("register");setStep(1);}} style={{color:"var(--teal)",fontWeight:600,background:"none",border:"none",cursor:"pointer",fontSize:14}}>Crear cuenta gratis</button></div>
              {/* Demo accounts */}
              <div style={{background:"rgba(23,212,160,.05)",border:"1px solid var(--border)",borderRadius:14,padding:16}}>
                <div style={{fontSize:12,fontWeight:700,color:"var(--teal)",textTransform:"uppercase",letterSpacing:".5px",marginBottom:12}}>🎮 Cuentas demo para explorar</div>
                {[["cristobal@demo.com","Cristóbal — Patrocinado (Club Andes)","🎯"],["maria@demo.com","María — Patrocinadora (Marca)","🏢"],["pablo@demo.com","Pablo — Inversor","💼"]].map(([email,label,icon])=>(
                  <button key={email} onClick={()=>demoLogin(email)} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"10px 12px",borderRadius:10,background:"rgba(255,255,255,.04)",border:"1px solid var(--bs)",marginBottom:8,cursor:"pointer",fontFamily:"'Inter',sans-serif",transition:"all .2s",color:"var(--white)",fontSize:13,fontWeight:500}}>
                    <span style={{fontSize:18}}>{icon}</span><span>{label}</span>
                  </button>
                ))}

            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:6}}><span style={{color:"var(--muted)"}}>Escrow</span><span style={{fontWeight:700}}>€{c.paid.toLocaleString()} / €{c.amount.toLocaleString()}</span></div>

    </div>
  );
}

  const [sel,setSel]=useState(false);

  const [running,setRunning]=useState(false);const [prog,setProg]=useState(0);const [status,setStatus]=useState("");
  const [verdict,setVerdict]=useState(null);const [err,setErr]=useState("");

  const runAI=async()=>{
    setRunning(true);setVerdict(null);setErr("");setProg(0);
    const steps=[[500,20,"Verificando evidencias..."],[1100,45,"Analizando defensa..."],[1800,70,"Evaluando cumplimiento..."],[2500,88,"Consultando Gemini..."]];

            <div style={{fontFamily:"'Sora',sans-serif",fontSize:26,fontWeight:800,color:"var(--warn)"}}>{disp.daysLeft}</div>
            <div style={{fontSize:11,color:"var(--muted)"}}>días</div>
          </div>}
        </div>
        <div style={{background:"rgba(0,0,0,.2)",borderRadius:10,padding:13,fontSize:13,color:"var(--muted)",lineHeight:1.6,marginBottom:10}}>{disp.description}</div>

          <div style={{height:14}}/>
          {!defenseSent?(

              <textarea className="inp" style={{minHeight:80,resize:"none",marginBottom:10}} value={defense} onChange={e=>setDefense(e.target.value)} placeholder="Explica tu posición y aporta evidencias..."/>
              <button className="btn-g" onClick={()=>{if(!defense.trim()){showToast("Escribe tu defensa","⚠️");return;}setDefenseSent(true);showToast("Defensa registrada","📎");}}>📎 Enviar mi defensa</button>
            </>
          ):(
            <div style={{background:"var(--obg)",border:"1px solid rgba(40,207,122,.2)",borderRadius:11,padding:13,fontSize:13,color:"var(--ok)"}}>✅ Defensa registrada. Gemini la analizará.</div>

              <div style={{fontFamily:"'Sora',sans-serif",fontSize:26,fontWeight:800,color:"var(--ok)"}}>€{verdict.released.toLocaleString()}</div>

          <button onClick={execute} style={{background:"rgba(124,58,237,.8)",color:"#fff",border:"1px solid rgba(124,58,237,.4)",borderRadius:12,padding:"13px 16px",width:"100%",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"'Inter',sans-serif"}}>✅ Ejecutar veredicto</button>

        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8}}>
          {[["📅","7 días"],["🔒","Congela"],["🤖","IA"],["📊","% justo"],["✅","Ejecuta"]].map(([ic,t],i)=>(
            <div key={i} style={{textAlign:"center"}}><div style={{fontSize:20,marginBottom:4}}>{ic}</div><div style={{fontSize:11,color:"var(--muted)",fontWeight:600}}>{t}</div></div>

        <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>

        {!editing?(
          <>
            {p.company&&<div style={{marginBottom:10}}><div style={{fontSize:11,color:"var(--muted)",marginBottom:3}}>EMPRESA / PROYECTO</div><div style={{fontWeight:600,fontSize:14}}>{p.company}</div></div>}
            {p.location&&<div style={{marginBottom:10}}><div style={{fontSize:11,color:"var(--muted)",marginBottom:3}}>UBICACIÓN</div><div style={{fontWeight:600,fontSize:14}}>{p.location}</div></div>}
            {p.description&&<div style={{marginBottom:10}}><div style={{fontSize:11,color:"var(--muted)",marginBottom:3}}>DESCRIPCIÓN</div><div style={{fontSize:14,color:"var(--muted)",lineHeight:1.6}}>{p.description}</div></div>}
            {p.budget&&<div style={{marginBottom:10}}><div style={{fontSize:11,color:"var(--muted)",marginBottom:3}}>PRESUPUESTO</div><div style={{fontWeight:600,fontSize:14,color:"var(--teal)"}}>{p.budget}</div></div>}
            <button className="btn-g" style={{marginTop:8}} onClick={()=>setEditing(true)}>✏️ Editar perfil</button>
          </>
        ):(
          <>
            <div className="inp-wrap"><label className="lbl">Empresa / Proyecto</label><input className="inp" value={form.company} onChange={e=>setForm(f=>({...f,company:e.target.value}))}/></div>
            <div className="inp-wrap"><label className="lbl">Ubicación</label><input className="inp" value={form.location} onChange={e=>setForm(f=>({...f,location:e.target.value}))}/></div>
            <div className="inp-wrap"><label className="lbl">Descripción</label><textarea className="inp" style={{minHeight:70,resize:"none"}} value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))}/></div>
            <div style={{display:"flex",gap:10}}>
              <button className="btn-p" onClick={save} style={{flex:1}}>Guardar</button>
              <button className="btn-g" onClick={()=>setEditing(false)} style={{width:"auto",padding:"13px 18px",flex:"0 0 auto"}}>Cancelar</button>
            </div>
          </>
        )}
      </div>
      {user.role==="patrocinado"&&(
        <div className="card">
          <div style={{fontSize:13,fontWeight:700,marginBottom:14}}>Reputación verificada</div>
          <div className="grid4" style={{marginBottom:14}}>
            {[["Trust","96","var(--teal)"],["Acuerdos","8","var(--white)"],["Cumple","97%","var(--ok)"],["Rating","4.8 ★","var(--warn)"]].map(([l,v,c],i)=>(
              <div key={i} className="stat-card"><div style={{fontFamily:"'Sora',sans-serif",fontSize:20,fontWeight:800,color:c}}>{v}</div><div style={{fontSize:11,color:"var(--muted)"}}>{l}</div></div>
            ))}
          </div>
          {[["Cumplimiento",97],["Respuesta",88],["Satisfacción",94]].map(([l,v],i)=>(
            <div key={i} style={{marginBottom:11}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5}}><span style={{color:"var(--muted)"}}>{l}</span><span style={{fontWeight:700,color:"var(--teal)"}}>{v}%</span></div>
              <Bar v={v}/>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ─── MAIN APP ───────────────────────────────────────── */
function App(){
  const [user,setUser]=useState(()=>DB.getSession());
  const [apiKey,setApiKey]=useState(()=>DB.getApiKey());
  const [needApiKey,setNeedApiKey]=useState(false);
  const [toast,setToast]=useState(null);

  const showToast=(msg,icon="✓",sub="")=>{setToast({msg,icon,sub});setTimeout(()=>setToast(null),3200);};

  const handleLogin=(u)=>{setUser(u);setNeedApiKey(false);};
  const handleLogout=()=>{DB.clearSession();setUser(null);setNeedApiKey(false);};
  const saveApiKey=(k)=>{DB.saveApiKey(k);setApiKey(k);setNeedApiKey(false);showToast("Árbitro IA activado","🤖");};

  // Init seed data on first load
  useEffect(()=>{if(DB.getUsers().length===0)DB.saveUsers(SEED_USERS);},[]);

  if(!user)return <><AuthScreen onLogin={handleLogin} showToast={showToast}/>{toast&&<Toast {...toast}/>}</>;

  if(needApiKey||(!apiKey&&user.role!=="inversor"))
    return <><ApiSetup onSave={saveApiKey}/>{toast&&<Toast {...toast}/>}</>;

  return(
    <div style={{minHeight:"100vh",background:"var(--bg)"}}>
      <TopNav user={user} onLogout={handleLogout} />
      {user.role==="patrocinado"&&<PatrocinadoDash user={user} apiKey={apiKey} showToast={showToast}/>}
      {user.role==="patrocinador"&&<PatrocinadorDash user={user} apiKey={apiKey} showToast={showToast}/>}
      {user.role==="inversor"&&<InversorDash user={user} showToast={showToast}/>}
      {toast&&<Toast {...toast}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
